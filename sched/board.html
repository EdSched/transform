<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>教室看板 · 唯新</title>
<link rel="stylesheet" href="style.css">
</head><body>
<div id="nav"></div>
<div class="wrap">
  <div class="card">
    <div class="row">
      <div class="field"><label>校区</label><select id="campus"></select></div>
      <div class="field"><label>日期</label><input type="date" id="date"></div>
      <div class="field"><label>&nbsp;</label><button class="ghost sm" id="today">回到今天</button></div>
      <div class="field" style="margin-left:auto"><label>&nbsp;</label>
        <span class="muted" id="meta"></span></div>
    </div>
    <div class="legend">
      <span><i style="background:var(--course)"></i>排课</span>
      <span><i style="background:var(--vip)"></i>VIP</span>
      <span><i style="background:var(--temp)"></i>临时使用</span>
      <span><i style="background:var(--rental)"></i>对外出租</span>
      <span><i style="background:var(--meeting)"></i>开会</span>
      <span class="mic">📶 = 同时占用会议账号</span>
    </div>
  </div>
  <div class="card board" id="boardBox"><div class="muted">加载中…</div></div>
</div>

<script src="common.js?v=20261006"></script>
<script>
el('nav').innerHTML = renderNav('board.html');
pageRole().then(r=>{ if(r) el('nav').innerHTML = renderNav('board.html', r); }).catch(()=>{});
let ROOMS=[], BOOKINGS=[];

async function boot(){
  fillSelect(el('campus'), CAMPUSES);
  el('date').value = todayStr();
  el('campus').onchange = render;
  el('date').onchange = render;
  el('today').onclick = ()=>{ el('date').value=todayStr(); render(); };
  try{
    ROOMS    = await sbGet('sched_rooms','select=*&active=eq.true&order=campus,sort');
    BOOKINGS = await sbGet('sched_bookings','select=*');
    const cs = await sbGet('sched_courses','select=id,skip_dates');
    window.SKIPMAP={}; cs.forEach(c=>{ if(c.skip_dates) window.SKIPMAP[c.id]=new Set(c.skip_dates.split(',').map(s=>s.trim())); });
    render();
  }catch(e){ el('boardBox').innerHTML = '<div class="b-err badge">'+esc(e.message)+'</div>'; }
}
function render(){
  const campus = el('campus').value, date = el('date').value;
  const rooms = ROOMS.filter(r => r.campus===campus);
  el('meta').textContent = WEEKDAYS[weekdayOf(date)] + ' · ' + rooms.length + ' 间教室';

  const todays = BOOKINGS.filter(b => bookingOnDate(b, date) &&
    !(b.kind==='course' && b.course_id && window.SKIPMAP[b.course_id] && window.SKIPMAP[b.course_id].has(date)));
  // 某教室在某时刻是否被占用（含跨时段中间格）
  const covered = (roomId, slot) => todays.some(b => String(b.room_id)===String(roomId) &&
    b.start_time<=slot && slot<b.end_time);

  const gridRooms = rooms.map(r=>({ id:r.id, name:r.name, sub:(r.type==='大课'?(r.size_label+'·'+r.capacity+'人'):(r.capacity+'人')) }));
  el('boardBox').innerHTML = renderOccupancyGrid(gridRooms, todays, 'room_id');
}
boot();
</script>
</body></html>
