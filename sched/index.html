  el('cEdit').innerHTML=h;
  // 周几切换
  const box=el('e_wd');
  for(let d=1;d<=7;d++){ const b=document.createElement('button'); b.type='button'; b.className='ghost sm';
    b.textContent=WEEKDAYS[d]; b.dataset.d=d; if(wd.includes(d)){ b.dataset.on='1'; b.style.background='var(--blue)'; b.style.color='#fff'; }
    b.onclick=()=>{ const on=b.dataset.on==='1'; b.dataset.on=on?'':'1'; b.style.background=on?'#fff':'var(--blue)'; b.style.color=on?'var(--ink)':'#fff'; };
    box.appendChild(b); }
  el('e_cancel').onclick=()=>el('cEdit').innerHTML='';
  // 休讲日期管理
  let SKIP = (c.skip_dates||'').split(',').map(s=>s.trim()).filter(Boolean).sort();
  function renderSkip(){
    el('e_skipList').innerHTML = SKIP.length ? SKIP.map(d=>
      `<span class="badge b-mute" style="cursor:pointer" data-sk="${d}">${d} ✕</span>`).join('')
      : '<span class="muted" style="font-size:12px">暂无</span>';
    el('e_skipList').querySelectorAll('[data-sk]').forEach(x=>x.onclick=()=>{ SKIP=SKIP.filter(d=>d!==x.dataset.sk); renderSkip(); });
    el('e_skipInfo').textContent = SKIP.length? ('共 '+SKIP.length+' 次休讲；顺延会把结课日按上课周期往后推 '+SKIP.length+' 周') : '';
  }
  renderSkip();
  // 全局假期单天豁免：列出这门课命中的假期日，点击切换放假/照常上课
  let EXCEPT = new Set((c.holiday_except||'').split(',').map(s=>s.trim()).filter(Boolean));
  function courseHolidayDates(){
    // 用当前表单的周几+开课/结课日，找命中的全局假期日
    const days=[...box.querySelectorAll('button[data-on="1"]')].map(b=>Number(b.dataset.d));
    const sd=el('e_sd').value, ed=el('e_ed').value;
    if(!days.length||!sd||!ed) return [];
    const out=[]; let d=sd, g=0;
    while(d<=ed&&g++<800){ const w=weekdayOf(d); const wN=w===0?7:w;
      if(days.includes(wN)){ for(const h of HOLIDAYS){ const s=h.start_date, e=h.end_date||h.start_date; if(s&&d>=s&&d<=e){ out.push({date:d, label:h.label||'假期'}); break; } } }
      d=addDays(d,1);
    }
    return out;
  }
  function renderHolExcept(){
    const box2=el('e_holBox'); if(!box2) return;
    const hits=courseHolidayDates();
    if(!hits.length){ box2.innerHTML='<span class="muted" style="font-size:12px">这门课在其日期区间内没有命中全局假期。</span>'; return; }
    const WD=['周日','周一','周二','周三','周四','周五','周六'];
    box2.innerHTML=hits.map(x=>{ const on=EXCEPT.has(x.date);   // on=照常上课
      return `<span class="exhit" data-eh="${x.date}" style="cursor:pointer;user-select:none;border-radius:14px;padding:4px 12px;font-size:12px;margin:3px;display:inline-block;border:1px solid ${on?'#2c8a4f':'#c0392b'};background:${on?'#e7f6ec':'#fdecea'};color:${on?'#2c8a4f':'#c0392b'}">${x.date}（${WD[weekdayOf(x.date)]}）·${esc(x.label)}：${on?'照常上课':'放假'}</span>`;
    }).join('')+'<div class="muted" style="font-size:11px;margin-top:4px">红=按全局假期放假；绿=这门课这天照常上课（豁免）。</div>';
    box2.querySelectorAll('[data-eh]').forEach(n=>n.onclick=()=>{ const d=n.dataset.eh; EXCEPT.has(d)?EXCEPT.delete(d):EXCEPT.add(d); renderHolExcept(); refreshRecalc(); });
  }
  // 实时推算：按当前表单的开课日+回数+周几+休讲，算应有结课日和命中假期
  function curFormCourse(){
    const days=[...box.querySelectorAll('button[data-on="1"]')].map(b=>Number(b.dataset.d)).join(',');
    return { start_date:el('e_sd').value||null, end_date:el('e_ed').value||null, weekdays:days,
      sessions:el('e_sess').value?Number(el('e_sess').value):null, skip_dates:SKIP.join(','), holiday_except:[...EXCEPT].join(',') };
  }
  renderHolExcept();
  function refreshRecalc(){
    const fc=curFormCourse(); const rb=el('e_recalc'); if(!rb) return;
    if(!fc.start_date||!fc.sessions||!fc.weekdays){ rb.innerHTML='<span class="muted">填好开课日、回数、周几后，这里会推算应有结课日。</span>'; return; }
    const det=computeEndDetail(fc);
    const blocked=det.blocked.length?('，跳过 '+det.blocked.length+' 天（'+det.blocked.map(b=>b.date+'·'+b.why).join('、')+'）'):'（无假期/休讲命中）';
    const cur=el('e_ed').value;
    const same=cur===det.end;
    rb.innerHTML='按回数 <b>'+fc.sessions+'</b> 从 '+esc(fc.start_date)+' 排'+esc(blocked)+'，应有结课日：<b style="color:#2c5aa0">'+esc(det.end||'—')+'</b>'+
      (cur?(same?' <span class="badge b-ok" style="font-size:10px">与当前一致</span>':' <span class="badge b-warn" style="font-size:10px">当前填的是 '+esc(cur)+'，不一致</span>'):'');
  }
  ['e_sd','e_ed','e_sess'].forEach(id=>{ if(el(id)) el(id).addEventListener('input', ()=>{ refreshRecalc(); renderHolExcept(); }); });
  box.querySelectorAll('button').forEach(b=>b.addEventListener('click', ()=>setTimeout(()=>{ refreshRecalc(); renderHolExcept(); },0)));
  const _rs=renderSkip; renderSkip=function(){ _rs(); refreshRecalc(); }; refreshRecalc();
  if(el('e_useEnd')) el('e_useEnd').onclick=()=>{ const det=computeEndDetail(curFormCourse()); if(det.end){ el('e_ed').value=det.end; refreshRecalc(); } };
  if(el('e_useStart')) el('e_useStart').onclick=()=>{ const fc=curFormCourse(); if(!fc.end_date){ toast('请先填结课日', false); return; } const sd=computeStartByCount(fc); if(sd){ el('e_sd').value=sd; refreshRecalc(); } };
  el('e_skipBtn').onclick=()=>{ const d=el('e_skipAdd').value; if(d && !SKIP.includes(d)){ SKIP.push(d); SKIP.sort(); renderSkip(); } };
  el('e_postpone').onclick=()=>{
    const ed=el('e_ed').value; const days=[...box.querySelectorAll('button[data-on="1"]')].map(b=>Number(b.dataset.d));
    if(!ed){ el('e_warn').className=''; el('e_warn').innerHTML='<span class="badge b-err">请先填结课日</span>'; return; }
    if(!days.length){ el('e_warn').className=''; el('e_warn').innerHTML='<span class="badge b-err">请先选周几</span>'; return; }
    // 每休讲一次，结课日顺延到“下一个上课日”，重复 SKIP.length 次
    let d=ed;
    for(let i=0;i<SKIP.length;i++){ do{ d=addDays(d,1); }while(!days.includes(weekdayOf(d))); }
    el('e_ed').value=d;
    el('e_warn').className=''; el('e_warn').innerHTML='<span class="badge b-ok">结课日已顺延至 '+d+'（可再手动微调）</span>';
  };
  el('e_save').onclick=async()=>{
    const days=[...box.querySelectorAll('button[data-on="1"]')].map(b=>b.dataset.d).join(',');
    const st=el('e_st').value, et=el('e_et').value;
    if(et<=st){ el('e_warn').className=''; el('e_warn').innerHTML='<span class="badge b-err">结束需晚于开始</span>'; return; }
    const patch={ name:el('e_name').value.trim(), teacher:el('e_teacher').value.trim()||null,
      category:el('e_cat').value, campus:el('e_campus').value, term:el('e_term').value.trim()||null,
      major:el('e_major').value.trim()||null, course_type:el('e_ctype').value||null,
      mode:el('e_mode').value, start_time:st, end_time:et,
      start_date:el('e_sd').value||null, end_date:el('e_ed').value||null,
      weekdays:days, sessions:el('e_sess').value?Number(el('e_sess').value):null,
      est_students:el('e_est').value?Number(el('e_est').value):null, meeting_link:el('e_link').value.trim()||null,
      skip_dates: SKIP.length? SKIP.join(',') : null,
      holiday_except: EXCEPT.size? [...EXCEPT].sort().join(',') : null };
    if(el('e_morder')) patch.merge_order = el('e_morder').value?Number(el('e_morder').value):null;
    if(!patch.name){ el('e_warn').className=''; el('e_warn').innerHTML='<span class="badge b-err">请填课程名</span>'; return; }
    // 按回数核对结课日：与推算不一致时提醒，让用户选用推算值还是保留手填
    if(patch.sessions && patch.start_date && patch.weekdays){
      const realEnd=computeEndByCount({start_date:patch.start_date, end_date:patch.end_date, weekdays:patch.weekdays, sessions:patch.sessions, skip_dates:patch.skip_dates, holiday_except:patch.holiday_except});
      const sessChanged = String(c.sessions||'')!==String(patch.sessions||'');
      if(realEnd && realEnd!==patch.end_date){
        const useReal=confirm((sessChanged?'回数改为 '+patch.sessions+' 后，':'')+'按回数+假期推算，结课日应为：\n\n'+realEnd+'\n\n你当前填的是：'+(patch.end_date||'（空）')+'\n\n点「确定」用推算的 '+realEnd+'；点「取消」保留你填的。');
        if(useReal) patch.end_date=realEnd;
      }
    }
    try{
      if(isNew){
        await sbInsert('sched_courses', patch);
        await reloadAll(); tabCourses(); toast('课程已新增');
        return;
      }
      // 记录变更日志（供首页提醒）
      const FLBL={name:'课程名',teacher:'讲师',category:'类别',campus:'校区',term:'期',major:'专业',course_type:'属性',mode:'方式',start_time:'开始',end_time:'结束',start_date:'开课日',end_date:'结课日',weekdays:'周几',sessions:'回数',est_students:'人数',meeting_link:'会议链接',skip_dates:'休讲日'};
      const changes=[];
      Object.keys(FLBL).forEach(f=>{ const ov=(c[f]==null?'':String(c[f])), nv=(patch[f]==null?'':String(patch[f]));
        if(ov!==nv) changes.push({field:f,label:FLBL[f],from:ov||'（空）',to:nv||'（空）'}); });
      await sbUpdate('sched_courses', c.id, patch);
      if(changes.length){ try{ await sbInsert('sched_change_log',{ course_id:c.id, course_name:patch.name||c.name,
        actor_role:(ROLE&&ROLE.role)||'', actor_label:(ROLE&&(ROLE.label||ROLE.role))||'某账号', action:'edit', changes, acked_by:'' }); }catch(e){} }
      // 若已排教室，同步把休讲日/结课日写进对应占用，看板才准
      const bs=BOOKINGS.filter(b=>b.kind==='course'&&String(b.course_id)===String(c.id));
      for(const b of bs) await sbUpdate('sched_bookings', b.id, {end_date:patch.end_date, note: SKIP.length?('排课自动生成；休讲:'+SKIP.join(',')):'排课自动生成'});
      await reloadAll(); tabCourses(); toast('已保存');
    }catch(e){ el('e_warn').className=''; el('e_warn').innerHTML='<span class="badge b-err">'+esc(e.message)+'</span>'; }
  };
}

function pickExemptDays(hol, allDates){
  return new Promise(resolve=>{
    const WD=['周日','周一','周二','周三','周四','周五','周六'];
    const sel=new Set(allDates);   // 默认全选
    const mask=document.createElement('div');
    mask.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;z-index:70;overflow:auto;padding:40px 16px';
    const chips=allDates.map(d=>`<span class="exday" data-d="${d}" style="cursor:pointer;user-select:none;border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:14px;padding:4px 12px;font-size:12px;margin:3px">${d}（${WD[weekdayOf(d)]}）</span>`).join('');
    mask.innerHTML='<div class="card" style="width:520px;max-width:94vw;margin:auto"><h3 style="margin-top:2px">选择「'+esc(hol.label||'假期')+'」里照常上课的日期</h3>'+
      '<div class="muted" style="font-size:12px;margin-bottom:8px">默认全选。点击可取消/选中某一天——只有选中的日期，勾选的课才照常上课，其余日期仍放假。</div>'+
      '<div style="display:flex;flex-wrap:wrap;gap:2px;margin-bottom:6px">'+chips+'</div>'+
      '<div style="margin-bottom:10px"><button class="sm ghost" id="exd_all">全选</button> <button class="sm ghost" id="exd_none">全不选</button></div>'+
      '<div style="display:flex;gap:8px"><button id="exd_ok">确定</button><button class="ghost" id="exd_cancel">取消</button></div></div>';
    document.body.appendChild(mask);
    const paint=()=>mask.querySelectorAll('.exday').forEach(c=>{ const on=sel.has(c.dataset.d);
      c.style.background=on?'var(--blue)':''; c.style.color=on?'#fff':'#888'; c.style.borderColor=on?'var(--blue)':'var(--line)'; });
    mask.querySelectorAll('.exday').forEach(c=>c.onclick=()=>{ const d=c.dataset.d; sel.has(d)?sel.delete(d):sel.add(d); paint(); });
    mask.querySelector('#exd_all').onclick=()=>{ allDates.forEach(d=>sel.add(d)); paint(); };
    mask.querySelector('#exd_none').onclick=()=>{ sel.clear(); paint(); };
    mask.querySelector('#exd_cancel').onclick=()=>{ mask.remove(); resolve(null); };
    mask.querySelector('#exd_ok').onclick=()=>{ mask.remove(); resolve(allDates.filter(d=>sel.has(d))); };
    paint();
  });
}
function renderReview(list){
  const box=el('cf_trashBox'); if(!box) return;
  const all=(list||COURSES).filter(c=>c.sessions&&c.start_date&&c.weekdays);
  // 只关心「受假期/休讲影响」的课：命中过假期或休讲的才需要审查
  const affected=[];
  all.forEach(c=>{ const det=computeEndDetail(c); if(det.blocked.length) affected.push({c,det}); });
  if(!affected.length){ box.innerHTML='<div class="muted" style="margin:8px 0;padding:10px;border:1px dashed var(--line);border-radius:8px">没有任何课受假期/休讲影响，回数都不受影响，无需审查。</div>'; return; }
  const need=affected.filter(r=>r.det.end!==r.c.end_date);   // 需调整
  const ok=affected.filter(r=>r.det.end===r.c.end_date);      // 已一致
  const rowHtml=(r,isOk)=>{
    const c=r.c, det=r.det;
    const blockedTxt=det.blocked.map(b=>b.date+'('+b.why+')').join('、');
    return `<tr${isOk?'':' style="background:#fff8f0"'}><td><b>${esc(c.name)}</b></td><td>${esc(String(c.sessions))}</td><td>${esc(c.start_date||'')}</td>`+
      `<td>${esc(c.end_date||'（空）')}${isOk?' <span class="badge b-ok" style="font-size:10px">一致</span>':''}</td>`+
      `<td class="muted" style="max-width:240px">${esc(blockedTxt)}</td>`+
      `<td><b>${esc(det.end||'')}</b>${isOk?'':' <span class="badge b-warn" style="font-size:10px">需调整</span>'}</td>`+
      `<td>${isOk?'—':('<button class="sm ghost" data-rvend="'+c.id+'" data-end="'+esc(det.end||'')+'">用此结课日</button>')} <button class="sm ghost" data-rvedit="${c.id}">编辑休假</button></td></tr>`;
  };
  const thead='<thead><tr><th>课程</th><th>回数</th><th>开课日</th><th>当前结课日</th><th>命中假期/休讲</th><th>应有结课日</th><th>操作</th></tr></thead>';
  let h='<div style="border:1px solid #cdd8e6;background:#f8fafd;border-radius:8px;padding:10px 12px;margin:8px 0">'+
    '<div style="font-size:13px;margin-bottom:6px"><b>回数审查</b> <span class="muted" style="font-size:12px">只列出受假期/休讲影响的课。没受影响的课回数不会错，不显示。</span></div>';
  // 需调整（置顶）
  h+='<div style="font-size:13px;margin:6px 0 4px;color:#c0392b"><b>需调整（'+need.length+'）</b></div>';
  if(need.length){
    h+='<div style="margin-bottom:6px"><button class="sm" id="rv_applyall">把这些「应有结课日」一次性应用</button></div>';
    h+='<table style="font-size:12px">'+thead+'<tbody>'+need.map(r=>rowHtml(r,false)).join('')+'</tbody></table>';
  } else h+='<div class="badge b-ok" style="margin-bottom:6px">受影响的课结课日都已对上，无需调整</div>';
  // 一致（折叠）
  if(ok.length){
    h+='<details style="margin-top:10px"><summary class="muted" style="font-size:12px;cursor:pointer">已一致（'+ok.length+'）— 点开查看</summary>'+
       '<table style="font-size:12px;margin-top:6px">'+thead+'<tbody>'+ok.map(r=>rowHtml(r,true)).join('')+'</tbody></table></details>';
  }
  h+='</div>';
  box.innerHTML=h;
  box.querySelectorAll('[data-rvend]').forEach(x=>x.onclick=async()=>{
    const id=x.dataset.rvend, nd=x.dataset.end; if(!nd) return;
    if(!confirm('把该课结课日改为 '+nd+'？（同步更新教室占用）')) return;
    await applyEnd(id, nd); await reloadAll(); tabCourses(); el('cf_trashBox').dataset.open='review'; renderReview(); toast('已更新结课日');
  });
  box.querySelectorAll('[data-rvedit]').forEach(x=>x.onclick=()=>{ courseEdit(x.dataset.rvedit); });
  const aa=el('rv_applyall'); if(aa) aa.onclick=async()=>{
    if(!need.length) return;
    if(!confirm('把 '+need.length+' 门课的结课日改为「应有结课日」？（同步更新教室占用）')) return;
    let done=0; for(const r of need){ try{ await applyEnd(r.c.id, r.det.end); done++; }catch(e){} }
    await reloadAll(); tabCourses(); el('cf_trashBox').dataset.open='review'; renderReview(); toast('已应用 '+done+' 门');
  };
}

    const c=COURSES.find(y=>String(y.id)===String(x.dataset.rvback)); if(!c) return;
    const sd=computeStartByCount(c);
    if(!confirm('固定结课日 '+esc(c.end_date||'')+'，按回数 '+c.sessions+' 倒推，应有开课日为：\n\n'+sd+'\n\n把开课日改为这个？')) return;
    await sbUpdate('sched_courses', c.id, {start_date:sd});
    const bs=BOOKINGS.filter(b=>b.kind==='course'&&String(b.course_id)===String(c.id));
    for(const b of bs) await sbUpdate('sched_bookings', b.id, {start_date:sd});
    await reloadAll(); tabCourses(); el('cf_trashBox').dataset.open='review'; renderReview(); toast('已更新开课日');
  });
  // 全部应用
  const aa=el('rv_applyall'); if(aa) aa.onclick=async()=>{
    const need=rows.filter(r=>r.det.end&&r.det.end!==r.c.end_date);
    if(!need.length){ toast('全部一致，无需应用'); return; }
    if(!confirm('把 '+need.length+' 门课的结课日改为「应有结课日」？（同步更新教室占用）')) return;
    let done=0; for(const r of need){ try{ await applyEnd(r.c.id, r.det.end); done++; }catch(e){} }
    await reloadAll(); tabCourses(); el('cf_trashBox').dataset.open='review'; renderReview(); toast('已应用 '+done+' 门');
  };
}
async function applyEnd(courseId, nd){
  await sbUpdate('sched_courses', courseId, {end_date:nd});
  const bs=BOOKINGS.filter(b=>b.kind==='course'&&String(b.course_id)===String(courseId));
  for(const b of bs) await sbUpdate('sched_bookings', b.id, {end_date:nd});
}
async function fixEndByCount(list){
  const targets=[];
  (list||COURSES).forEach(c=>{
    if(!c.sessions||!c.start_date||!c.weekdays) return;
    const real=computeEndByCount(c);
    if(real && real!==c.end_date) targets.push({c, real, dir:(!c.end_date||real>c.end_date)?'延后':'提前'});
  });
  if(!targets.length){ toast('所有课结课日都已符合回数，无需修正'); return; }
  const lines=targets.slice(0,40).map(t=>`${esc(t.c.name)}（回数${t.c.sessions}）：${esc(t.c.end_date||'（空）')} → ${esc(t.real)}  [${t.dir}]`).join('\n');
  if(!confirm('将按「当前回数 + 假期/休讲」重新计算 '+targets.length+' 门课的结课日：\n\n'+lines+(targets.length>40?'\n…':'')+'\n\n确认按回数覆盖结课日？（会同时更新已排教室占用）')) return;
  let done=0;
  for(const t of targets){
    try{
      await sbUpdate('sched_courses', t.c.id, {end_date:t.real});
      const bs=BOOKINGS.filter(b=>b.kind==='course'&&String(b.course_id)===String(t.c.id));
      for(const b of bs) await sbUpdate('sched_bookings', b.id, {end_date:t.real});
      done++;
    }catch(e){}
  }
  await reloadAll(); tabCourses(); toast('已按回数重算 '+done+' 门课的结课日');
}
/* 按回数算真实结束日：从开课日按周几排，跳过全局假期和个别休讲（豁免的照常计），数满 sessions 次 */
/* 正推带明细：从开课日按回数排，返回 {end, blocked:[命中的假期/休讲日期], classDates:[实际上课日]} */
function computeEndDetail(c){
  const out={end:c.end_date||null, blocked:[], classDates:[]};
  if(!c.start_date || !c.weekdays || !c.sessions) return out;
  const wds=parseWeekdaysSched(c.weekdays);
  if(!wds.length) return out;
  const N=Number(c.sessions); if(!N||N<1) return out;
  const skip=new Set((c.skip_dates||'').split(',').map(s=>s.trim()).filter(Boolean));
  const except=new Set((c.holiday_except||'').split(',').map(s=>s.trim()).filter(Boolean));
  const inHoliday=d=>{ for(const h of HOLIDAYS){ const s=h.start_date, e=h.end_date||h.start_date; if(s&&d>=s&&d<=e) return {label:h.label||'假期'}; } return null; };
  let d=c.start_date, cnt=0, guard=0, last=c.start_date;
  while(cnt<N && guard++<3000){
    const wd=weekdayOf(d), wdN=(wd===0?7:wd);
    if(wds.includes(wdN)||wds.includes(wd)){
      const hol=inHoliday(d); const isSkip=skip.has(d);
      const blocked=(hol&&!except.has(d))||isSkip;
      if(blocked){ out.blocked.push({date:d, why: isSkip?'休讲':(hol?hol.label:'假期')}); }
      else { cnt++; last=d; out.classDates.push(d); }
    }
    if(cnt>=N) break;
    d=addDays(d,1);
  }
  out.end=last;
  return out;
}
/* 倒推：从结课日往前按回数排，返回应有的开课日 */
function computeStartByCount(c){
  if(!c.end_date || !c.weekdays || !c.sessions) return c.start_date||null;
  const wds=parseWeekdaysSched(c.weekdays);
  if(!wds.length) return c.start_date||null;
  const N=Number(c.sessions); if(!N||N<1) return c.start_date||null;
  const skip=new Set((c.skip_dates||'').split(',').map(s=>s.trim()).filter(Boolean));
  const except=new Set((c.holiday_except||'').split(',').map(s=>s.trim()).filter(Boolean));
  const inHoliday=d=>{ for(const h of HOLIDAYS){ const s=h.start_date, e=h.end_date||h.start_date; if(s&&d>=s&&d<=e) return true; } return false; };
  let d=c.end_date, cnt=0, guard=0, first=c.end_date;
  while(cnt<N && guard++<3000){
    const wd=weekdayOf(d), wdN=(wd===0?7:wd);
    if(wds.includes(wdN)||wds.includes(wd)){
      const blocked=(inHoliday(d)&&!except.has(d))||skip.has(d);
      if(!blocked){ cnt++; first=d; }
    }
    if(cnt>=N) break;
    d=addDays(d,-1);
  }
  return first;
}
function computeEndByCount(c){
  if(!c.start_date || !c.weekdays || !c.sessions) return c.end_date||null;
  const wds=parseWeekdaysSched(c.weekdays);
  if(!wds.length) return c.end_date||null;
  const N=Number(c.sessions); if(!N||N<1) return c.end_date||null;
  const skip=new Set((c.skip_dates||'').split(',').map(s=>s.trim()).filter(Boolean));
  const except=new Set((c.holiday_except||'').split(',').map(s=>s.trim()).filter(Boolean));
  const inHoliday=d=>{ for(const h of HOLIDAYS){ const s=h.start_date, e=h.end_date||h.start_date; if(s&&d>=s&&d<=e) return true; } return false; };
  let d=c.start_date, cnt=0, guard=0, last=c.start_date;
  while(cnt<N && guard++<2000){
    const wd=weekdayOf(d); const wdN=(wd===0?7:wd);
    if(wds.includes(wdN) || wds.includes(wd)){
      const blocked = (inHoliday(d) && !except.has(d)) || skip.has(d);  // 全局假期(未豁免)或个别休讲→不计
      if(!blocked){ cnt++; last=d; }
    }
    if(cnt>=N) break;
    d=addDays(d,1);
  }
  return last;
}
/* 角色链接统一指向 index 分发板（进去后按权限看到自己的功能） */
function landingFor(role){
  const ps=(role.perms||'').split(',').map(s=>s.trim());
  return (ps.includes('manage')||role.role==='admin') ? 'admin.html' : 'index.html';
}
/* ---------- 角色权限 ---------- */
function tabCodes(){
  const base = location.origin + location.pathname.replace(/[^/]*$/,'');  // 取目录（去掉当前文件名），避免拼出 index.htmlindex.html
  let h='<div class="card"><h3 style="margin-top:2px">角色权限</h3>'+
    '<div class="tip">每个角色一条：勾选它能用的功能（点击标签切换），保存后生效。把「专属链接」发给对应的人，他们打开就只看到自己有权限的功能。</div>'+
    '<table><thead><tr><th>角色</th><th>功能权限（点击切换）</th><th>专属链接</th><th>状态</th><th></th></tr></thead><tbody>';
  CODES.slice().sort((a,b)=>(a.sort||100)-(b.sort||100)).forEach(c=>{
    const ps = new Set((c.perms?c.perms.split(','):[]).map(s=>s.trim()).filter(Boolean));
    const chips = PERM_DEFS
      .filter(([perm])=>perm!=='entry_room_full')     // 去掉“录入(全部)”，合并为单一“教室占用录入”
      .map(([perm,label])=>{
        const on = ps.has(perm);
        const nm = perm==='entry_room'?'教室占用录入':label;
        return `<span class="permchip${on?' on':''}" data-perm="${perm}" data-cid="${c.id}">${on?'✓ ':''}${esc(nm)}</span>`;
      }).join(' ');
    const link = base+landingFor(c)+'?k='+encodeURIComponent(c.code);
    h+=`<tr><td><b>${esc(c.label||c.role||'')}</b><br><small class="muted">${esc(c.role||'')}</small></td>`+
      `<td style="max-width:520px">${chips}</td>`+
      `<td style="max-width:220px"><input readonly value="${esc(link)}" style="width:190px;font-size:11px" data-link="${c.id}"> <button class="sm ghost" data-copy="${c.id}">复制</button></td>`+
      `<td>${c.active?'<span class="badge b-ok">启用</span>':'<span class="badge b-mute">停用</span>'}</td>`+
      `<td><button class="sm ghost" data-savep="${c.id}">保存</button> <button class="sm ghost" data-togc="${c.id}">${c.active?'停用':'启用'}</button> <button class="sm danger" data-delc2="${c.id}">删</button></td></tr>`;
  });
  h+='</tbody></table>'+
    '<h4 style="margin:16px 0 8px">新增角色</h4><div class="row">'+
    '<div class="field"><label>角色显示名</label><input id="nc_label" placeholder="如 教务助理"></div>'+
    '<div class="field"><label>角色标识</label><input id="nc_role" placeholder="如 assistant" style="width:120px"></div>'+
    '<div class="field"><label>编码(链接用,留空自动生成)</label><input id="nc_code" placeholder="留空自动" style="width:140px"></div>'+
    '<div class="field"><label>&nbsp;</label><button id="nc_add">新增</button></div></div>'+
    '<p class="muted" style="font-size:12px;margin-top:6px">新增后在上表勾选它的权限并保存。</p></div>';
  render(h);

  // 本地暂存每行勾选状态
  const draft={}; CODES.forEach(c=>draft[c.id]=new Set((c.perms?c.perms.split(','):[]).map(s=>s.trim()).filter(Boolean)));
  async function saveCodePerms(cid){ try{ await sbUpdate('sched_access_codes',cid,{perms:[...draft[cid]].join(',')}); toast('已保存'); }catch(e){ toast('保存失败：'+e.message,false); } }
  document.querySelectorAll('.permchip').forEach(chip=>{
    chip.onclick=async()=>{
      const cid=chip.getAttribute('data-cid'), perm=chip.getAttribute('data-perm');
      if(draft[cid].has(perm)){ draft[cid].delete(perm); chip.classList.remove('on'); chip.textContent=chip.textContent.replace('✓ ',''); }
      else { draft[cid].add(perm); chip.classList.add('on'); if(!chip.textContent.startsWith('✓')) chip.textContent='✓ '+chip.textContent; }
      await saveCodePerms(cid);
    };
  });
  bind('[data-savep]', async id=>{ await saveCodePerms(id); await reloadAll(); toast('权限已保存'); });
  bind('[data-togc]', async id=>{ const c=CODES.find(x=>String(x.id)===String(id)); await sbUpdate('sched_access_codes',id,{active:!c.active}); await reloadAll(); show('codes'); });
  bind('[data-delc2]', async id=>{ if(confirm('删除该角色？其链接将失效。')){ await sbDelete('sched_access_codes',id); await reloadAll(); show('codes'); } });
  bind('[data-copy]', id=>{ const inp=document.querySelector(`[data-link="${id}"]`); navigator.clipboard.writeText(inp.value).then(()=>toast('链接已复制')); });
  el('nc_add').onclick=async()=>{
    const label=el('nc_label').value.trim(), role=el('nc_role').value.trim();
    if(!label){ toast('填角色显示名',false); return; }
    let code=el('nc_code').value.trim(); if(!code){ code=(role||'r')+'-'+Math.random().toString(36).slice(2,8); }
    await sbInsert('sched_access_codes',{code,role:role||label,label,perms:'timetable',sort:100,active:true});
    await reloadAll(); show('codes'); toast('已新增，请勾选权限并保存');
  };
}

/* helpers */
function render(html){ el('panel').innerHTML=html; }
function bind(sel, fn){
  const attr = sel.match(/data-[\w-]+/)[0];
  document.querySelectorAll(sel).forEach(b => { b.onclick = () => fn(b.getAttribute(attr)); });
}
