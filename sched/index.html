<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理后台 · 唯新</title>
<link rel="stylesheet" href="style.css?v=20261030">
<script>if(new URLSearchParams(location.search).get('embed')==='admin') document.documentElement.classList.add('embedadmin');</script>
<style>.embedadmin header.top{display:none}</style>
</head><body>
<header class="top"><div class="wrap" style="display:flex;align-items:center;flex-wrap:wrap;gap:14px">
  <h1 style="margin:0;font-size:17px">唯新 · 教学资源调度</h1>
  <nav id="adminNav" style="display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;margin-left:auto"></nav>
</div></header>
<div id="roleBar" style="max-width:1400px;margin:0 auto;padding:10px 16px 0;text-align:right"><span id="whoami"></span></div>
<div class="wrap">
  <div id="gate" class="card hidden" style="text-align:center;padding:60px 20px;color:var(--sub)">
    此链接无效或已停用。请使用管理员发放的专属链接进入。
  </div>

  <div id="main" class="hidden">
    <div id="hub">
      <div id="hello" style="margin:4px 0 16px"></div>
      <div id="schedRemind"></div>
      <div class="hub" id="hubCards"></div>
    </div>
    <div id="work" class="hidden">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
        <button class="ghost sm" id="backHub">← 返回</button>
        <b id="workTitle" style="font-size:15px"></b>
      </div>
      <div id="workRemind"></div>
      <div id="panel"></div>
      <iframe id="frame" style="display:none;width:100%;height:calc(100vh - 160px);border:1px solid var(--line);border-radius:8px"></iframe>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="../shared/constants.js?v=20270422"></script>
<script src="../shared/course-room-view.js?v=20270429"></script>
<script src="common.js?v=20270428"></script>
<script src="../shared/course-confirm.js?v=20270112"></script>
<script src="../shared/course-sessions.js?v=20270429"></script>
<script src="../shared/session-online.js?v=20270430"></script>
<script src="../shared/search.js?v=20261029"></script>
<script src="health.js?v=20270428"></script>
<script>
let ROOMS=[], ACCOUNTS=[], COURSES=[], BOOKINGS=[], ROLE=null;
let ALL_COURSES=[];   // 全部未删除的课（含已结课、已移出排课）：只给「追溯查询 / 批量移出」用；教室占空、同步检查仍用 COURSES
const EMBED_ADMIN = new URLSearchParams(location.search).get('embed')==='admin';   // 嵌在管理端「资源管理」里

/* 口令登录（口令即 access_codes 的 code，需 manage 权限）。admin-7910 可直接进 */
/* 凭 ?k= 进入：任何有效角色都进，按其权限显示功能。无效才拦。 */
(async function gate(){
  const rec = await currentRole();
  if(!rec){
    if(EMBED_ADMIN) el('gate').textContent='请从管理端进入（没有取到登录身份，或没有资源管理权限）。';
    el('gate').classList.remove('hidden'); el('main').classList.add('hidden'); return;
  }
  ROLE=rec;
  if(!EMBED_ADMIN){ try{ sessionStorage.setItem('sched_role', JSON.stringify(rec)); }catch(e){} }   // 嵌入管理端的身份不写 sched_role，免得串到旧口令链接
  const who=el('whoami'); if(who) who.innerHTML = rec ? `<span style="background:#eef4f0;color:#2f6b4f;padding:2px 10px;border-radius:12px;font-size:12px">当前身份 · ${esc(rec.label||rec.role||'')}</span>` : '';
  el('gate').classList.add('hidden'); el('main').classList.remove('hidden');
  await reloadAll();
  const tab = new URLSearchParams(location.search).get('tab');
  if(tab){ openCard(tab); } else { renderHub(); }
})();
async function reloadAll(){
  [ROOMS,ACCOUNTS,COURSES,BOOKINGS] = await Promise.all([
    sbGet('sched_rooms','select=*&order=campus,sort'),
    sbGet('sched_meeting_accounts','select=*&order=id'),
    sbGet('sched_course_v','select=*&order=created_at.desc'),
    sbGet('sched_bookings','select=*&order=created_at.desc')
  ]);
  await loadCourseLink(); linkCourseBookings(BOOKINGS);
  DELETED_COURSES = COURSES.filter(c=>c.deleted_at);
  COURSES = COURSES.filter(c=>!c.deleted_at);
  ALL_COURSES = COURSES.slice();
  // 已上完的课（结课日已过）不再参与排课/教室占用/提醒——过去的期不需要占用显示
  // 只过滤 end_date 有值且已过的；没填 end_date 的不误伤
  { const _today=new Date().toISOString().slice(0,10); COURSES = COURSES.filter(c=>!(c.end_date && c.end_date < _today)); }
  try{ MTEMPLATES = await sbGet('sched_meeting_templates','select=*&order=created_at.desc'); }catch(e){ MTEMPLATES=[]; }
  try{ REQUESTS = await sbGet('sched_course_requests','select=*&order=created_at.desc'); }catch(e){ REQUESTS=[]; }   // 表还没建时不影响排课
  try{ HOLIDAYS = await sbGet('sched_holidays','select=*&order=start_date'); }catch(e){ HOLIDAYS=[]; }
  try{ CHANGELOG = await sbGet('sched_change_log','select=*&order=created_at.desc&limit=50'); }catch(e){ CHANGELOG=[]; }
  // 没处理的「需要协调教室 / 反馈给老师」单独读一遍：最近 50 条里被别的记录挤掉的也要看得到
  try{ const have=new Set(CHANGELOG.map(l=>String(l.id)));
    (await sbGet('sched_change_log','select=*&action=in.(room_coord,room_unavailable)&or=(acked_by.is.null,acked_by.eq.)&order=created_at.desc&limit=200')).forEach(l=>{ if(!have.has(String(l.id))) CHANGELOG.push(l); });
  }catch(e){}
  // 自动重算已关闭：改由「回数审查」面板 + 编辑时推算提醒，由用户自己拍板
  const pend=BOOKINGS.filter(b=>b.status==='pending').length;
  const pn=el('pendN'); if(pn){ pn.textContent = pend||''; pn.style.display=pend?'':'none'; }
}
let MTEMPLATES=[];
let REQUESTS=[];   // 推送给负责人确认的记录 sched_course_requests
/* HOLIDAYS 在 shared/constants.js 里声明（全局假期，和管理端共用同一个变量） */
let CHANGELOG=[];
let DELETED_COURSES=[];
const rname=id=>{ const r=ROOMS.find(x=>String(x.id)===String(id)); return r?r.name:'—'; };
const aname=id=>{ const a=ACCOUNTS.find(x=>String(x.id)===String(id)); return a?a.name:'—'; };

/* 卡片墙：所有功能都在 admin 内部打开，绝不外跳 */
const HUB_CARDS = [
  // key, 图标, 名称, 说明, 类型('tab'内部函数 / 'iframe'嵌页), 目标
  ['board',    '📋','教室看板','选校区+日期，看当天各教室占用','iframe','board.html'],
  ['timetable','🎓','课程表','按专业/期生成课表，可分享只读链接','iframe','timetable.html'],
  ['courseview','🔍','课程查询','只读查课：按类别/期数/校区/星期看每门课的上课日期和教室','iframe','courses.html'],
  ['meeting',  '📶','腾讯会议账号占用','查账号空闲/预留，给线上课预留账号','iframe','meeting.html'],
  ['bookingf', '🏫','教室占用录入','查空闲→点教室→录入临时/租用/开会','iframe','booking.html'],
  ['pending',  '✅','预约批准','审批老师提交的教室预约','tab','pending'],
  ['assign',   '🧩','排教室','把课程分配到教室（周历排课）','tab','assign'],
  ['conflict', '⚠️','同步检查','课程改了、教室没跟上的地方；教室冲突也在这里','tab','conflict'],
  ['rooms',    '🏠','教室管理','增删改教室、新增租借教室','tab','rooms'],
  ['accounts', '🎙️','会议账号管理','管理腾讯账号（固定/临时、登录名密码）','tab','accounts'],
  ['courses',  '✍️','课程管理','课程列表：新增/编辑/删除/查重','tab','courses'],
  ['oplog',    '📜','操作记录','教室占用的新建/批准/驳回/修改/删除记录，可按人、类型、时间查','iframe','oplog.html'],
];
/* 每张卡片需要的权限；manage(管理员)看到全部 */
const CARD_PERM = {
  board:'board', timetable:'timetable', courseview:'course_view', roster:'roster', meeting:'meeting_view', bookingf:'entry_room',
  pending:'approve', assign:'assign', conflict:'conflict',
  rooms:'room_manage', accounts:'account_manage', courses:'course'
};
function canSee(key){
  if(!ROLE) return false;
  const ps = permSet(ROLE);
  if(ps.has('manage')) return true;                 // 管理员看到全部
  if(key==='courseview') return ps.has('course_view')||ps.has('timetable')||ps.has('course');   // 有课程表/课程管理权限默认可见
  if(key==='oplog') return ps.has('occupy')||ps.has('manage');
  if(key==='bookingf') return ps.has('entry_room')||ps.has('entry_room_full');
  if(key==='meeting') return ps.has('meeting_view')||ps.has('meeting_arrange');
  const need = CARD_PERM[key];
  return need ? ps.has(need) : true;
}
function visibleCards(){ return HUB_CARDS.filter(c=>canSee(c[0])); }
function renderAdminNav(){
  const nav=el('adminNav'); if(!nav) return;
  nav.innerHTML = '<a href="#" data-nav="_hub" style="color:var(--blue)">首页</a>' +
    visibleCards().map(([k,ic,nm])=>`<a href="#" data-nav="${k}">${nm}</a>`).join('');
  nav.querySelectorAll('[data-nav]').forEach(a=>a.onclick=(e)=>{
    e.preventDefault();
    if(a.dataset.nav==='_hub') renderHub(); else openCard(a.dataset.nav);
  });
}
function renderHub(){
  renderAdminNav();
  el('hub').classList.remove('hidden');
  el('work').classList.add('hidden');
  const hi=el('hello'); if(hi) hi.innerHTML = `<div class="tip">你好，<b>${esc((ROLE&&(ROLE.label||ROLE.role))||'')}</b>。以下是你可用的功能。</div>`;
  // 排课提醒（有排教室权限才显示；出错也不影响卡片渲染）
  try{
    const rb=el('schedRemind');
    if(rb){
      const ps=permSet(ROLE);
      if((ps.has('assign')||ps.has('manage')) && typeof schedulingReminders==='function'){
        rb.innerHTML='<div class="remMain" data-nolink="1"></div>';
        mountRemind(rb.querySelector('.remMain'));
      } else rb.innerHTML='';
    }
  }catch(e){ const rb=el('schedRemind'); if(rb) rb.innerHTML=''; }
  // 管理员提醒：上个月（及更早）的教室占用还没归档
  try{
    const rb=el('schedRemind');
    if(rb && permSet(ROLE).has('manage')){
      const t=todayStr(), lastDay=addDays(t.slice(0,7)+'-01',-1);   // 上个月最后一天
      const n=BOOKINGS.filter(b=>b.kind!=='course' && (b.recurrence==='weekly' ? (b.end_date && b.end_date<=lastDay) : (b.booking_date && b.booking_date<=lastDay))).length;
      if(n){
        rb.insertAdjacentHTML('beforeend','<div style="background:#eef4fb;border:1px solid #cfe0f2;color:#2f5a8a;padding:10px 14px;border-radius:8px;margin-bottom:8px;font-size:13px;line-height:1.5;display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span>上个月的教室占用还没归档（共 <b>'+n+'</b> 条）。</span><button class="sm" id="rem_arch">去归档</button></div>');
        el('rem_arch').onclick=()=>{ window.__OPLOG_ARCH=true; openCard('oplog'); window.__OPLOG_ARCH=false; };
      }
    }
  }catch(e){}
  COORD_SES={};   // 回到首页时重新读一遍单回
  renderChangeAlerts();
  // 打开页面不再自动核对 / 补占：只有人点「核对单回和教室」等按钮才跑
  const pend = BOOKINGS.filter(b=>b.status==='pending').length;
  el('hubCards').innerHTML = visibleCards().map(([k,ic,nm,desc])=>{
    const badge = (k==='pending'&&pend)?` <span class="badge b-warn">${pend}</span>`:'';
    return `<a href="#" data-hub="${k}"><b>${ic} ${nm}${badge}</b><span>${desc}</span></a>`;
  }).join('') || '<span class="muted">当前账号暂无可用功能，请联系管理员。</span>';
  el('hubCards').querySelectorAll('[data-hub]').forEach(a=>a.onclick=(e)=>{ e.preventDefault(); openCard(a.dataset.hub); });
}
function renderChangeAlerts(){
  let box=el('changeAlerts');
  if(!box){ const hi=el('hello'); if(!hi) return; box=document.createElement('div'); box.id='changeAlerts'; hi.parentNode.insertBefore(box, hi.nextSibling); }
  const myRole=(ROLE&&ROLE.role)||'';
  const notAcked=l=>{ const acked=(l.acked_by||'').split(',').map(s=>s.trim()).filter(Boolean); return !acked.includes(myRole); };
  const pending=(CHANGELOG||[]).filter(l=>l.action!=='session_room' && l.action!=='room_coord' && l.action!=='room_unavailable' && l.action!=='course_review' && notAcked(l));
  // 需要协调教室：管理端改单回后检查出教室被占 / 没排教室，总务来处理。一门课一张卡，状态按现在的占用重新核对
  const cv=coordBuild(); COORD_VIEW=cv;
  const pendN=cv.groups.filter(g=>g.act.some(it=>!coordWaiting(it))).length;
  const coordHtml = (cv.groups.length ? `<div style="background:${pendN?'#fff5f5':'#f6f6f6'};border:2px solid ${pendN?'#c0392b':'#ccc'};border-radius:8px;padding:10px 14px;margin-bottom:8px">`+
    `<div style="font-size:14px;font-weight:600;color:${pendN?'#a33':'#777'}">${pendN?`需要协调教室（${pendN}）`:`教室协调：已反馈给老师，等待调整（${cv.groups.length}）`}</div>`+
    cv.groups.map(coordCardHtml).join('')+`</div>` : '')+coordOrphanSummaryHtml()+hcHomeHtml();
  if(!pending.length){
    box.innerHTML=coordHtml; bindCoord(box,myRole);
    return;
  }
  // 按学科（类别）分组：反查课程的 category
  const catOf=(l)=>{
    const c=(COURSES||[]).find(x=>String(x.legacy_sched_id)===String(l.course_id) || String(x.id)===String(l.course_id));
    return (c&&(c.category||c.major))||'未分类';
  };
  const groups={}; pending.forEach(l=>{ const k=catOf(l); (groups[k]=groups[k]||[]).push(l); });
  const cats=Object.keys(groups).sort();
  box.innerHTML = coordHtml + cats.map((cat,gi)=>{
    const items=groups[cat];
    const ids=items.map(l=>l.id).join(',');
    const detail=items.map(l=>{
      const chg=(Array.isArray(l.changes)?l.changes:[]).map(x=>`<div style="font-size:12px;margin-top:2px">· <b>${esc(x.label)}</b>：${esc(String(x.from))} → ${esc(String(x.to))}</div>`).join('');
      const when=(l.created_at||'').slice(0,16).replace('T',' ');
      return `<div style="border-top:1px solid #f0e6d0;padding-top:6px;margin-top:6px">`+
        `<div style="font-size:12px"><b>${esc(l.actor_label||'某账号')}</b>（${esc(l.actor_role||'')}）修改了「<b>${esc(l.course_name||'')}</b>」 <span class="muted" style="font-size:11px">${esc(when)}</span></div>`+
        chg+`</div>`;
    }).join('');
    return `<div style="background:#fbf6ee;border:1px solid #ecdcbe;border-radius:8px;padding:10px 14px;margin-bottom:8px">`+
      `<div style="font-size:13px;line-height:1.5">有 <b>${items.length}</b> 条关于「<b>${esc(cat)}</b>」的修改，请确认课程表、教室和腾讯会议使用是否需要修改更新。</div>`+
      `<div style="margin-top:8px;display:flex;gap:8px;align-items:center">`+
        `<button class="sm ghost" data-chgtoggle="${gi}">展开</button>`+
        `<button class="sm ghost" data-ackgrp="${ids}">知道了</button>`+
      `</div>`+
      `<div id="chgdetail_${gi}" style="display:none">${detail}</div>`+
      `</div>`;
  }).join('');
  bindCoord(box,myRole);
  box.querySelectorAll('[data-chgtoggle]').forEach(b=>b.onclick=()=>{
    const d=el('chgdetail_'+b.dataset.chgtoggle); if(!d) return;
    const open=d.style.display!=='none';
    d.style.display=open?'none':'block';
    b.textContent=open?'展开':'收起';
  });
  box.querySelectorAll('[data-ackgrp]').forEach(b=>b.onclick=async()=>{
    const ids=(b.dataset.ackgrp||'').split(',').filter(Boolean);
    for(const id of ids){
      const l=CHANGELOG.find(x=>String(x.id)===String(id)); if(!l) continue;
      const acked=(l.acked_by||'').split(',').map(s=>s.trim()).filter(Boolean);
      if(!acked.includes(myRole)) acked.push(myRole);
      try{ await sbUpdate('sched_change_log', l.id, {acked_by:acked.join(',')}); l.acked_by=acked.join(','); }catch(e){}
    }
    renderChangeAlerts();
  });
}
function bindCoord(box,myRole){
  box.querySelectorAll('[data-coordgo]').forEach(b=>b.onclick=()=>coordPanel(b.dataset.coordgo));
  box.querySelectorAll('[data-coordack]').forEach(b=>b.onclick=()=>coordAckGroup(b.dataset.coordack));
  box.querySelectorAll('[data-orphclean]').forEach(b=>b.onclick=()=>coordCleanOrphans(b.dataset.orphclean));
  box.querySelectorAll('[data-orphall]').forEach(b=>b.onclick=()=>coordCleanOrphans(null));
  box.querySelectorAll('[data-hcgo]').forEach(b=>b.onclick=e=>{ e.preventDefault(); openCard('conflict'); });
  coordKick();
}
/* 提醒只看显示窗口内、没移出的课 */
function remindCourses(){ return schedViewList(ALL_COURSES, null); }
/* ---------- 排课提醒：每条可展开，列出课并能直接去排 ---------- */
window.REM_OPEN = window.REM_OPEN || new Set();   // 展开状态只放内存，刷新后默认收起
/* 系列课：右栏一行下面的小字，列出每个成员（课名 · 时间 · 日期） */
function seriesMembersLine(c){
  const ms=COURSES.filter(x=>x.merge_group===c.merge_group).sort((a,b)=>(a.merge_order||99)-(b.merge_order||99));
  const md=d=>d?d.slice(5).replace('-','/'):'';
  return '<div class="muted" style="font-size:11px;margin-top:3px;line-height:1.6">'+ms.map(m=>esc(m.name)+'（'+esc(classTimeText(m))+(m.start_date?' '+md(m.start_date)+'~'+md(m.end_date):'')+'）').join('<br>')+'</div>';
}
function remCourseRow(c, act){
  const wd=weekdaysLabel(c.weekdays), tm=classTimeText(c);
  const where=schedIsOnline(c)?'线上':(c.campus||'');
  const parts=[c.teacher||'', [wd,tm].filter(Boolean).join(' '), where, c.start_date?('开课 '+c.start_date):''].filter(Boolean);
  return '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed rgba(0,0,0,.12)"><div style="flex:1;min-width:0"><b>'+esc(c.name||'')+'</b><div style="font-size:12px;opacity:.8">'+esc(parts.join(' ｜ '))+'</div></div>'+
    '<button class="sm" data-rem-act="'+act+'" data-cid="'+esc(String(c.id))+'">'+(act==='link'?'去设定':'去排')+'</button></div>';
}
function remBox(key, style, headHtml, courses, act, allBtn){
  const open=REM_OPEN.has(key);
  let h='<div class="remBox" style="'+style+';border-radius:8px;margin-bottom:8px;font-size:13px;line-height:1.5">'+
    '<div data-rem-tg="'+esc(key)+'" style="cursor:pointer;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span style="flex:1;min-width:0">'+headHtml+'</span>'+
    (allBtn&&!open?'':'')+'<span style="font-size:12px;white-space:nowrap">'+(open?'收起 ▴':'展开 ▾')+'</span></div>';
  if(open){
    h+='<div style="padding:0 14px 10px">';
    if(allBtn) h+='<div style="margin-bottom:4px"><button class="sm" data-rem-all="'+esc(allBtn)+'">全部去排</button></div>';
    h+=courses.map(c=>remCourseRow(c,act)).join('')+'</div>';
  }
  return h+'</div>';
}
function remindMainHtml(withNoLink){
  const ps=permSet(ROLE);
  const rems=schedulingReminders(remindCourses(), BOOKINGS);
  const anyMonth=rems.some(r=>/^\d{4}年\d{1,2}月$/.test(r.term));
  let h=rems.map(r=>{
    const tag=termKindTag(r.term);
    let head=esc(r.msg);
    if(tag && (anyMonth || /月$/.test(r.term))) head=head.replace(esc('【'+r.term+'】'), esc('【'+r.term+'】')+'<small style="opacity:.75">（'+esc(tag)+'）</small>');
    return remBox('t:'+r.term, 'background:'+(r.urgent?'#fdf1ed':'#f7f5f0')+';border:1px solid '+(r.urgent?'#f2d5cc':'#e6e0d4')+';color:'+(r.urgent?'#c85a3c':'#6b5d3e'), head, r.courses, 'assign', 'term:'+r.term);
  }).join('');
  const online=onlineTodoCourses(remindCourses(), BOOKINGS);
  if(online.length) h+=remBox('online','background:#eef4fb;border:1px solid #cfe0f2;color:#2f5a8a','有 <b>'+online.length+'</b> 门线上课还没设定腾讯会议。',online,'assign','online');
  if(withNoLink){
    const noLink=meetingNoLinkCourses(COURSES, BOOKINGS);
    if(noLink.length){

function mountRemind(box){
  if(!box) return;

    const t=ev.target;
    const mtg=t.closest('[data-rem-mtg]'); if(mtg){ openCard('meeting'); return; }
    const all=t.closest('[data-rem-all]');
    if(all){
      const v=all.dataset.remAll;
      window.AS_VIEW='table';
      window.AF_STATE = v==='online' ? {af_kind:'online', af_status:'todo'} : {af_term:v.slice(5), af_status:'todo', af_kind:'offline'};
      window.AF_TRACE=schedTraceNew(); openCard('assign'); return;

// 审批历史：已通过/已驳回的老师预约申请（有 reviewed_at 的；旧数据按 created_by 为老师姓名判断）
function pendHistoryHtml(){
  const isReq=b=>b.reviewed_at || (b.created_by && b.created_by!=='admin' && !String(b.created_by).includes('|'));
  const list=BOOKINGS.filter(b=>(b.status==='confirmed'||b.status==='rejected') && isReq(b))
    .sort((a,b)=>String(b.reviewed_at||'').localeCompare(String(a.reviewed_at||'')) || String(b.created_at||'').localeCompare(String(a.created_at||'')))
    .slice(0,LIST_PAGE);
  const fmt=t=>{ if(!t) return '<span class="muted">—</span>'; const d=new Date(t); if(isNaN(d)) return esc(t);
    const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); };
  const open=window.PEND_HIST_OPEN===true;
  let h='<div class="card" style="margin-top:14px"><h3 style="margin-top:2px;cursor:pointer;user-select:none" onclick="window.PEND_HIST_OPEN=!window.PEND_HIST_OPEN;const b=this.nextElementSibling;b.style.display=window.PEND_HIST_OPEN?\'\':\'none\';this.querySelector(\'.tog\').textContent=window.PEND_HIST_OPEN?\'收起 ▴\':\'展开 ▾\'">'+
    '审批历史 <small class="muted" style="font-weight:400">最近 '+list.length+' 条</small> <small class="tog muted" style="font-weight:400;margin-left:8px">'+(open?'收起 ▴':'展开 ▾')+'</small></h3>';
  h+='<div style="display:'+(open?'':'none')+'">';
  if(!list.length) return h+'<div class="muted">还没有审批记录</div></div></div>';
  h+='<table><thead><tr><th>审批时间</th><th>申请时间</th><th>上课日期</th><th>时段</th><th>教室</th><th>用途</th><th>人</th><th>结果</th></tr></thead><tbody>';
  list.forEach(b=>{
    const res = b.status==='confirmed'
      ? '<span class="badge b-ok">已通过</span>'
      : '<span class="badge b-err">已驳回</span>'+(b.reject_reason?' <small class="muted">'+esc(b.reject_reason)+'</small>':'');
    const room = b.room_id ? esc(rname(b.room_id)) : '<span class="muted">'+esc(b.req_campus||'')+'</span>';
    h+=`<tr><td>${fmt(b.reviewed_at)}</td><td class="muted">${fmt(b.created_at)}</td><td>${b.booking_date||''}</td><td>${b.start_time||''}-${b.end_time||''}</td><td>${room}</td>`+
       `<td>${esc(b.title||KIND_LABEL[b.kind]||'')}${b.student_name?(' <small class="muted">学生:'+esc(b.student_name)+'</small>'):''}</td>`+
       `<td>${esc(b.user_name||'')}</td><td>${res}</td></tr>`;
  });
  return h+'</tbody></table></div></div>';
}

function pendReject(id){
  const b=BOOKINGS.find(x=>String(x.id)===String(id)); if(!b) return;
  const campus=b.req_campus||''; const wd=WEEKDAYS[weekdayOf(b.booking_date)];
  const bigRooms=ROOMS.filter(r=>r.active!==false && r.campus===campus && isBigRoom(r));
  const daySlots=new Set(), dateSet=new Set();
  bigRooms.forEach(r=>{ const nb=findNearby(BOOKINGS, r.id, b.booking_date, b.start_time, b.end_time, 5);
    nb.sameDay.forEach(t=>daySlots.add(t)); nb.nearDates.forEach(o=>dateSet.add(o.date)); });
  const daysArr=[...daySlots].sort(), dateArr=[...dateSet].sort();
  const otherCampus=CAMPUSES.filter(c=>c!==campus);
  let reply=`${b.user_name||''}老师您好：${b.booking_date}（${wd}）${b.start_time}-${b.end_time} 在 ${campus} 的大教室（含备用）也已排满，暂时无法安排。`;
  if(daysArr.length) reply+=`当天可改约时段：${daysArr.join('、')}。`;
  if(dateArr.length) reply+=`同时段就近可约日期：${dateArr.join('、')}。`;
  if(otherCampus.length) reply+=`也可更换校区到 ${otherCampus.join('/')}。`;
  reply+=`麻烦回复希望的调整，谢谢！`;
  const box=el('pendReply');
  box.innerHTML='<div class="card" style="margin-top:10px;background:#fff7f7"><b style="color:#c85a3c">驳回回复 · 复制发给老师（含就近档期/换校区建议）</b>'+
    `<textarea rows="4" style="width:100%;margin-top:6px" readonly>${esc(reply)}</textarea>`+
    '<div style="margin-top:6px;display:flex;gap:8px"><button class="sm" id="copyReply">复制文字</button>'+
    '<button class="sm danger" id="doReject">确认驳回（删除申请）</button>'+
    '<button class="ghost sm" id="cancelReject">取消</button></div></div>';
  box.scrollIntoView({behavior:'smooth',block:'end'});
  el('copyReply').onclick=()=>navigator.clipboard.writeText(reply).then(()=>toast('已复制'));
  el('cancelReject').onclick=()=>{ box.innerHTML=''; };
  el('doReject').onclick=async()=>{ await sbUpdate('sched_bookings',id,{status:'rejected', reject_reason:reply, reviewed_at:new Date().toISOString()}); await reloadAll(); show('pending'); toast('已驳回（回复已随记录留给老师）'); };
}

/* ---------- 排课改课程：改前存快照、改完弹结果条、可撤销 ---------- */
async function schedRefreshView(){ await reloadAll(); if(el('coursesTable')) tabCourses(); else { try{ renderAssignView(); }catch(e){} } }
function schedActorLabel(){ return (ROLE&&(ROLE.label||ROLE.role))||'某账号'; }
/* ids：这次会动到的课程 id；work()：真正的写入；o.logs(d,res)：要写的 sched_change_log 行；o.text(d,res)：结果条文字（html） */
async function schedTrack(ids, work, o){
  o=o||{};
  const before=await schedSnap(ids);
  const res=await work();
  const after=await schedSnap(ids);
  const d=schedSnapDiff(before,after);
  const logIds=[];
  for(const row of (o.logs?o.logs(d,res):[])){ try{
    if(row.action==='room_coord') await coordSupersede(row);
    const r=await sbInsert('sched_change_log',row); if(r&&r[0]) logIds.push(r[0].id); }catch(e){ console.warn('写修改记录失败',e); } }
  if(!d.courses.length && !d.sessChanged && !d.sessAdded && !d.sessRemoved) return res;
  const sessTxt = (d.sessChanged||d.sessAdded||d.sessRemoved) ? '单回 '+(d.sessChanged+d.sessAdded+d.sessRemoved)+' 回跟着改。' : '';
  const dflt = d.courses.length===1
    ? '已同步到管理端：《'+esc(d.courses[0].name||'')+'》'+esc(Object.keys(d.courses[0].cols).map(k=>schedColText(k,d.courses[0].cols[k])).join('；'))+'。'+sessTxt
    : '已同步到管理端：改了 '+d.courses.length+' 门课。'+sessTxt;
  schedBar(o.text?o.text(d,res):dflt, async()=>{
    await schedUndo(before, ids);
    if(o.undo){ try{ await o.undo(res); }catch(e){ console.warn('撤销附带操作失败',e); } }
    for(const id of logIds){ try{ await sbDelete('sched_change_log', id); }catch(e){} }
    await schedRefreshView();
    return '已恢复';
  });
  return res;
}
/* 同一门课同一回已经有没处理的「需要协调教室」→ 旧的标成「系统」已处理，只留新的（不再一回堆两三条） */
async function coordSupersede(row){
  const x=(row.changes||[])[0]||{}; if(!x.session_id) return;
  const old=await sbGet('sched_change_log','select=id,changes,acked_by&action=eq.room_coord&or=(acked_by.is.null,acked_by.eq.)&order=created_at.desc&limit=200');
  for(const l of old){ if((l.changes||[]).some(y=>y&&y.field==='room_coord'&&String(y.session_id)===String(x.session_id)&&String(y.course_uuid||'')===String(x.course_uuid||''))){
    await sbUpdate('sched_change_log',l.id,{acked_by:'系统'}); const m=(CHANGELOG||[]).find(z=>z.id===l.id); if(m) m.acked_by='系统'; } }
}
/* 修改记录里带上课程 id，管理端卡片靠它认出是哪门课 */
function schedLogRow(c, action, changes){
  return { course_id:(c.legacy_sched_id!=null?c.legacy_sched_id:null), course_name:c.name||'', actor_role:(ROLE&&ROLE.role)||'', actor_label:schedActorLabel(),
    action, changes:changes.map(x=>Object.assign({course_uuid:String(c.id)},x)), acked_by:'' };
}
/* ---------- 总务：需要安排教室（管理端「课程安排」改单回后交过来的） ----------
   总务只管教室：先推荐空教室、一次换好；实在排不了 → 反馈给调整人（action='room_unavailable'），由他在课程安排里改日期 / 时间 / 休讲。
   卡片里的状态不是记录当时的快照，每次都按现在的占用重新核对：教室已经空出来 / 那一回已改走 → 自动标成已处理。 */
let COORD_SES={};              // 课程 key（系列课 = 整个系列）→ 今天以后的单回；读失败 = null；还没读 = undefined
let COORD_VIEW=null;           // 最近一次 coordBuild() 的结果
let COORD_BUSY=false;
const COORD_DONE=new Set();    // 已经自动标过的记录 id（防止反复写）
const coordXOf=l=>(Array.isArray(l.changes)?l.changes:[]).find(y=>y&&(y.field==='room_coord'||y.field==='room_unavailable'))||{};
const coordFresh=l=>!String(l.acked_by||'').trim();
const coordWD=['日','一','二','三','四','五','六'];
const coordMD=d=>{ const p=String(d||'').split('-'); return p.length===3?(+p[1])+'/'+(+p[2]):String(d||''); };
const coordMDW=d=>d?coordMD(d)+'（'+coordWD[weekdayOf(d)%7]+'）':'';
const coordT5=t=>String(t||'').slice(0,5);
function coordAgo(iso){ const t=new Date(iso).getTime(); if(!t) return ''; const m=Math.round((Date.now()-t)/60000);
  if(m<1) return '刚刚'; if(m<60) return m+' 分钟前'; if(m<1440) return Math.floor(m/60)+' 小时前'; const d=new Date(t); return (d.getMonth()+1)+'/'+d.getDate(); }
function coordFromTxt(f){ const s=String(f||''); const m=s.match(/^(\d{4}-\d{2}-\d{2})\s*(.*)$/); return m?(coordMD(m[1])+(m[2]?' '+m[2]:'')):s; }
function coordCourseOf(l,x){
  if(x.course_uuid){ const c=ALL_COURSES.find(y=>String(y.id)===String(x.course_uuid)); if(c) return c; }
  return ALL_COURSES.find(y=>(y.merge_name||y.name)===l.course_name||y.name===l.course_name)||null;
}
const coordGrpCourses=c=>c?(c.merge_group?ALL_COURSES.filter(y=>y.merge_group===c.merge_group):[c]):[];
const coordKeyOf=c=>c?(c.merge_group?'g:'+c.merge_group:String(c.id)):'';
function coordSpanOf(s,grp,c){
  const cc=grp.find(g=>String(g.id)===String(s.course_id))||c||{};
  const tr=normalizeTimeRanges(s.time_range||''); const sp=tr?timeRangesSpan(tr):null;
  return sp&&sp.start?{start:sp.start,end:sp.end}:{start:cc.start_time,end:cc.end_time};
}
const coordBks=idset=>BOOKINGS.filter(b=>b.kind==='course'&&idset.has(String(b.course_id))&&b.status!=='rejected');
function coordCurBk(idset,d,courseId){
  const l=coordBks(idset).filter(b=>String(b.course_id)===String(courseId)&&bookingOnDate(b,d));
  return l.find(b=>b.recurrence==='once')||l[0]||null;
}
function coordBlockersOf(roomId,d,sp,idset){
  return roomConflicts(BOOKINGS,roomId,d,sp.start,sp.end,null).filter(b=>!idset.has(String(b.course_id)))
    .map(b=>{ const t=bookingTimeOn(b,d); return {title:b.title||KIND_LABEL[b.kind]||'占用', who:b.user_name||'', time:coordT5(t[0])+'-'+coordT5(t[1])}; });
}
/* 这一回现在的真实状态：gone 已不在这一天 / ok 有教室且没人占 / blocked 教室被占 / noroom 没排教室；还没读到单回 = null */
function coordLive(g,it){
  const ses=COORD_SES[g.key]; if(!Array.isArray(ses)||!g.course) return null;
  const d=it.x.date, grp=coordGrpCourses(g.course), idset=new Set(grp.map(y=>String(y.id)));
  const ss=ses.filter(s=>s.session_date===d&&!s.is_cancelled);
  if(!ss.length) return {st:'gone'};
  const s0=ss[0], sp=coordSpanOf(s0,grp,g.course), cur=coordCurBk(idset,d,s0.course_id);
  if(solIsOnline(s0)) return {st:'ok',online:true,sess:ss,sp,roomId:null};       // 这一回单独改成线上：不需要教室
  const hasRoom=!!(cur&&cur.room_id!=null&&cur.room_id!=='');
  if(cur&&!hasRoom&&cur.uses_meeting) return {st:'ok',sess:ss,sp,roomId:null};       // 线上课：用会议账号，不需要教室
  if(!hasRoom) return {st:'noroom',sess:ss,sp,roomId:null};
  const blockers=coordBlockersOf(cur.room_id,d,sp,idset);
  return {st:blockers.length?'blocked':'ok',sess:ss,sp,roomId:cur.room_id,blockers};
}
/* 遗留占用：课程临时占用（once），那一天这门课已经没有课了（排课判断「教室被谁占」时早就不算它，但数据还留在库里，数据库防撞触发器有可能还认它） */
function coordOrphanBks(cid){ const t=todayStr();
  return BOOKINGS.filter(b=>b.kind==='course'&&b.recurrence==='once'&&b.status!=='rejected'&&b.booking_date>=t&&(cid==null||String(b.course_id)===String(cid))&&courseOnceOrphan(b,b.booking_date)); }
function coordOrphansNear(roomId,d,sp,idset){
  if(roomId==null||roomId==='') return [];
  return BOOKINGS.filter(b=>b.kind==='course'&&b.recurrence==='once'&&b.status!=='rejected'&&String(b.room_id)===String(roomId)&&b.booking_date===d
    &&!(idset&&idset.has(String(b.course_id)))&&courseOnceOrphan(b,d)&&overlap(coordT5(sp.start),coordT5(sp.end),coordT5(b.start_time),coordT5(b.end_time)));
}
const coordCourseName=cid=>{ const c=ALL_COURSES.find(x=>String(x.id)===String(cid)); return c?(c.merge_name||c.name):''; };

/* 把记录整理成「一门课一张卡」：同一回只留最新一条，教室已空 / 那一回已改走的单独拿出来（自动标已处理） */
function coordBuild(){
  const logs=(CHANGELOG||[]).filter(l=>(l.action==='room_coord'||l.action==='room_unavailable')&&coordFresh(l))
    .sort((a,b)=>String(a.created_at||'').localeCompare(String(b.created_at||'')));
  const groups=new Map(), fbs=[];
  logs.forEach(l=>{
    const x=coordXOf(l), c=coordCourseOf(l,x), gk=c?coordKeyOf(c):'n:'+(l.course_name||'');
    const ik=String(x.session_id||('n'+(x.num||'')+'|'+(x.date||'')));
    if(l.action==='room_unavailable'){ fbs.push({gk,ik,l,x}); return; }
    let g=groups.get(gk); if(!g){ g={key:gk,course:c,name:(c&&(c.merge_name||c.name))||l.course_name||'',items:new Map()}; groups.set(gk,g); }
    const prev=g.items.get(ik);
    g.items.set(ik,{ik,l,x,logs:(prev?prev.logs:[]).concat(l),fb:null,fbLogs:[]});
  });
  const stale=[];
  fbs.forEach(f=>{
    const g=groups.get(f.gk), it=g&&g.items.get(f.ik);
    if(it&&it.x.date===f.x.date&&String(it.x.time||'')===String(f.x.time||'')){ it.fb=f; it.fbLogs.push(f.l); } else stale.push(f.l);   // 日期 / 时间已经改了：旧的反馈作废
  });
  const out=[], resolved=[];
  groups.forEach(g=>{
    const act=[];
    g.items.forEach(it=>{
      it.live=coordLive(g,it);
      if(it.live&&(it.live.st==='gone'||it.live.online||(it.live.st==='ok'&&it.x.reason!=='released'&&it.x.reason!=='changed'))) resolved.push({it,live:it.live}); else act.push(it);
    });
    if(!act.length) return;
    act.sort((a,b)=>String(a.x.date||'').localeCompare(String(b.x.date||'')));
    g.act=act; out.push(g);
  });
  out.sort((a,b)=>String(a.act[0].x.date||'').localeCompare(String(b.act[0].x.date||'')));
  return {groups:out,resolved,stale};
}
const coordWaiting=it=>!!it.fb;

function coordCardHtml(g){
  const its=g.act, todo=its.filter(it=>!coordWaiting(it)), allWait=!todo.length;
  const newest=its.map(it=>it.l).sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')))[0]||{};
  const nx=coordXOf(newest);

      st='<span style="color:#a33">需要的教室 '+esc(rn)+' 在这个时间被'+bl+'占着</span>';

        coordOrphansNear(rid,x.date,lv.sp,idset).forEach(b=>{ const k=String(b.course_id); (orph.get(k)||orph.set(k,[]).get(k)).push(b); }); }
    }
    return '<div style="margin-top:4px"><b>'+esc(num)+'</b> → <b>'+esc(coordMDW(x.date))+' '+esc(t5)+'</b>'+(x.from&&!/新增/.test(x.from)?' <span class="muted" style="font-size:12px">（原 '+esc(coordFromTxt(x.from))+'）</span>':'')+'<div style="margin-left:14px">'+st+'</div>'+(x.memo?'<div style="margin-left:14px;font-size:12px;color:#555">备注：'+esc(x.memo)+'</div>':'')+'</div>';
  }).join('');
  const orphHtml=[...orph.entries()].map(([cid,bs])=>{
    const nm=coordCourseName(cid)||bs[0].title||'别的课', all=coordOrphanBks(cid);
    return '<div style="margin-top:6px;padding:6px 8px;background:#f3f3f3;border-radius:6px;font-size:12px;color:#555">这是「'+esc(nm)+'」以前留下的占用，它这天已经没有课（'+esc(bs.map(b=>coordMD(b.booking_date)).join('、'))+'）。'+
      ' <button class="sm ghost" data-orphclean="'+esc(cid)+'">清理这门课的遗留占用（'+all.length+' 条）</button></div>';
  }).join('');
  const head=allWait?'【'+esc(g.name)+'】已反馈给老师，等待调整':'【'+esc(g.name)+'】需要安排教室';
  return '<div style="border-top:1px solid '+(allWait?'#ddd':'#f0c8c8')+';padding-top:8px;margin-top:8px;font-size:13px;line-height:1.5;'+(allWait?'color:#666':'')+'">'+
    '<div style="font-size:14px"><b>'+head+'</b>'+(its.length>1?' <span class="muted" style="font-size:12px">共 '+its.length+' 回</span>':'')+'</div>'+
    '<div class="muted" style="font-size:12px">'+esc(who)+' 在「课程安排」里改了日期 / 时间　'+esc(coordAgo(newest.created_at))+'</div>'+

    (allWait?'':'<div style="margin-top:6px"><b>你要做的：</b>给这 '+todo.length+' 回安排教室</div>')+

async function hcFix(kind,idx){
  const r=HC_RES; if(!r) return;
  const items=idx==='all'?r[kind]:[r[kind][+idx]].filter(Boolean);
  if(!items.length) return;
  const sec=HC_SECS.find(s=>s[0]===kind);
  const who=await schedAskActor('「'+sec[1]+'」：'+sec[3]+'，共 '+items.length+' 处。确认修复？','确认修复');
  if(!who) return;
  let ok=0, fail=[];
  const course=cid=>ALL_COURSES.find(c=>String(c.id)===String(cid))||COURSES.find(c=>String(c.id)===String(cid));
  const coordRow=(cid,date,time,room,blocker,reason)=>{ const c=course(cid); if(!c) return null;
    return schedLogRow(c,'room_coord',[{field:'room_coord',label:'上课日',num:null,session_id:null,from:'（一致性体检）',to:date+' '+time,date,time,room_name:room||'',room_id:null,blocker:blocker||'',reason,actor_name:who,note:'一致性体检发现：'+(reason==='no_room'?'这一回没有教室占用':'教室重叠')}]); };
  for(const it of items){
    try{
      if(kind==='orphans') await sbDeleteAs('sched_bookings',it.b.id,who);
      else if(kind==='timeMismatch') await sbUpdate('sched_bookings',it.b.id,Object.assign({start_time:it.to[0],end_time:it.to[1]},schedActorStamp(who)));
      else if(kind==='uncovered'){ const row=coordRow(it.cid,it.date,(it.time||[]).join('-'),'','','no_room'); if(!row) throw new Error('找不到课程'); await coordSupersede(row); await sbInsert('sched_change_log',row); }
      else{
        let n=0;
        for(const b of [it.a,it.b]){ if(b.kind!=='course'||!b.course_id) continue;
          const other=b===it.a?it.b:it.a, ot=bookingTimeOn(other,it.days[0]);
          for(const d of it.days.slice(0,20)){ const row=coordRow(b.course_id,d,bookingTimeOn(b,d).map(coordT5).join('-'),rname(it.roomId),'《'+(other.title||KIND_LABEL[other.kind]||'占用')+'》（'+coordT5(ot[0])+'-'+coordT5(ot[1])+'）','blocked'); if(row){ await sbInsert('sched_change_log',row); n++; } } }
        if(!n) throw new Error('涉及的都不是课程，请手动处理');
      }
      ok++;
    }catch(e){ fail.push(e.message||String(e)); }
  }
  try{ await reloadAll(); }catch(e){}
  hcMount(); try{ renderChangeAlerts(); }catch(e){}
  toast(fail.length?('已修复 '+ok+' 处，'+fail.length+' 处失败：'+fail[0]):('已修复 '+ok+' 处'), !fail.length);
}

function coordHomeRoom(idset){
  const cnt={}; coordBks(idset).filter(b=>b.recurrence!=='once'&&b.room_id!=null&&b.room_id!=='').forEach(b=>{ cnt[b.room_id]=(cnt[b.room_id]||0)+1; });

function coordPlan(g){
  const c=g.course, grp=coordGrpCourses(c), idset=new Set(grp.map(y=>String(y.id)));
  const its=g.act.filter(it=>!coordWaiting(it)&&it.live&&(it.live.st==='blocked'||it.live.st==='noroom'||(it.live.st==='ok'&&(it.x.reason==='released'||it.x.reason==='changed'))));
  const home=coordHomeRoom(idset), est=Number(c.est_students)||0;
  const campusRaw=(home&&home.campus)||c.campus, campus=CAMPUSES.includes(campusRaw)?campusRaw:'';
  const floor=r=>(String(r.name||'').match(/^\D*(\d)/)||[])[1];
  const rank=r=>{
    let s=0; if(home&&String(r.id)===String(home.id)) s+=100;
    if(campus&&r.campus===campus) s+=40;
    if(home&&r.type&&r.type===home.type) s+=10;
    if(home&&floor(home)&&floor(home)===floor(r)) s+=5;
    if(est&&r.capacity) s-=Math.min(9,Math.max(0,(r.capacity-est))/20);   // 同样合适就不占太大的教室
    return s;
  };
  const rooms=ROOMS.filter(r=>r.active!==false&&(!campus||r.campus===campus)&&(!est||!r.capacity||r.capacity>=est)).sort((a,b)=>rank(b)-rank(a));
  const freeOf=new Map();
  rooms.forEach(r=>{ const s=new Set(); its.forEach((it,i)=>{ if(!coordBlockersOf(r.id,it.x.date,it.live.sp,idset).length) s.add(i); }); freeOf.set(String(r.id),s); });
  const full=rooms.filter(r=>freeOf.get(String(r.id)).size===its.length&&its.length>0);
  let bestN=0; rooms.forEach(r=>{ bestN=Math.max(bestN,freeOf.get(String(r.id)).size); });
  const best=rooms.filter(r=>freeOf.get(String(r.id)).size===bestN&&bestN>0);
  return {g,c,grp,idset,its,home,rooms,freeOf,full,bestN,best,campus};
}
const coordRoomTxt=r=>((r.campus||'')+' '+r.name).trim();
/* 反馈里的替代建议：当天其他空时段、就近同时段可用的日期、其他校区（和预约批准里的「驳回回复」同一套算法 findNearby） */
function coordAdvice(pl,it){
  const d=it.x.date, sp=it.live.sp, c=pl.c;
  const courseDays=new Set((COORD_SES[pl.g.key]||[]).filter(s=>!s.is_cancelled).map(s=>s.session_date));
  const est=Number(c.est_students)||0;
  const cands=ROOMS.filter(r=>r.active!==false&&(!pl.campus||r.campus===pl.campus)&&(!est||!r.capacity||r.capacity>=est));
  // 同一套思路（findNearby）：当天其他能放下这一回的时段、就近日期同时段；这里改成「离原来最近的排前面」，只看今天以后、这门课自己没课的日子
  const s0=coordT5(sp.start), e0=coordT5(sp.end), dur=durationMin(s0,e0), p=t=>{ const [h,m]=t.split(':').map(Number); return h*60+m; };
  const anyFree=(dd,st,et)=>cands.some(r=>!coordBlockersOf(r.id,dd,{start:st,end:et},pl.idset).length);
  const slotArr=SLOTS.map(st=>{ const em=p(st)+dur; if(st===s0||em>22*60) return null; const et=String(Math.floor(em/60)).padStart(2,'0')+':'+String(em%60).padStart(2,'0');
      return anyFree(d,st,et)?{t:st+'-'+et,k:Math.abs(p(st)-p(s0))}:null; }).filter(Boolean).sort((a,b)=>a.k-b.k).slice(0,3).map(o=>o.t);
  const dateArr=[]; for(let off=1;off<=7&&dateArr.length<3;off++){ for(const dd of [addDays(d,off),addDays(d,-off)]){
      if(dd>=todayStr()&&!courseDays.has(dd)&&dateArr.length<3&&anyFree(dd,s0,e0)) dateArr.push(dd); } }
  const camps=CAMPUSES.filter(x=>x!==pl.campus);
  const parts=[];
  if(slotArr.length) parts.push('当天 '+slotArr.join(' / '));
  dateArr.forEach(x=>parts.push(coordMDW(x)+'同时段'));
  if(camps.length) parts.push('换到 '+camps.join('/')+' 校区');
  return {slots:slotArr,dates:dateArr,campuses:camps,text:parts.length?'可改为：'+parts.join('；')+'。':''};
}

    }

}

      .filter(b=>!idset.has(String(b.course_id))).forEach(b=>{ if(seen.has(b.id)) return; seen.add(b.id); const t=bookingTimeOn(b,d); bl.push({title:b.title||KIND_LABEL[b.kind]||'占用',who:b.user_name||'',time:coordT5(t[0])+'-'+coordT5(t[1])}); });
    return {room:r,blockers:bl};
  }).concat(ACCOUNTS.filter(a=>a.kind==='临时'&&a.active!==false).map(a=>{   // 备用（临时）账号：不绑教室，排在固定账号后面

      (S.mode==='link'
        ?'<div class="field" style="margin-top:6px"><label>会议链接（可以先不填，之后在课程安排里补；填了要 http 开头）</label><input id="sol_url" style="width:100%;box-sizing:border-box" value="'+esc(S.url)+'" placeholder="https://meeting.tencent.com/…"><div id="sol_hint" style="color:#a33;font-size:12px;margin-top:2px;display:'+(solLinkValid(S.url)?'none':'block')+'">链接格式不对，要以 http 开头</div></div>'
        :'<div class="muted" style="font-size:12px;margin-top:6px">各会议账号（点一个空着的）：</div><div id="sol_acct">'+solAcctHtml(acctRows(),S.acct)+'</div>')+

/* ---------- 调整某一天 ---------- */
function adjustDayDialog(courseId, opts){
  opts=opts||{};
  const c=COURSES.find(x=>String(x.id)===String(courseId)); if(!c) return;
  const group=c.merge_group ? COURSES.filter(x=>x.merge_group===c.merge_group) : [c];
  const dispName=c.merge_name||c.name;
  const canEditSes=(()=>{ const ps=permSet(ROLE); return ps.has('manage')||ps.has('course')||!!(ROLE&&(ROLE.role==='admin'||ROLE.role==='teacher')); })();   // 总务（只有教室权限）看不到「改时间 / 休讲」
  let sel=opts.date||null;       // 选中的日期（总务从「需要协调教室」点进来时直接选中那一天）
  let mode=opts.date?(opts.mode||null):null;      // 'room' | 'move' | 'cx'，默认都不选
  let SES=[], sesLoaded=false;   // 这门课（系列课时含整个系列）今天以后的单回
  const loadSes=async()=>{ try{ SES=await sbGet('course_sessions','select=id,course_id,session_date,time_range,is_cancelled,session_number&course_id=in.('+group.map(g=>encodeURIComponent(g.id)).join(',')+')&session_date=gte.'+todayStr()); }catch(e){ SES=[]; } sesLoaded=true; };
  const WD=['日','一','二','三','四','五','六'];
  const mask=document.createElement('div');
  mask.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;z-index:60;overflow:auto;padding:40px 16px';
  document.body.appendChild(mask);
  const actor=()=>schedActorStamp((ROLE&&(ROLE.label||ROLE.role))||'排课');
  const idsAll=group.map(g=>g.id), idset=new Set(idsAll.map(String));
  const md=d=>d.slice(5).replace('-','/');
  const hm=t=>String(t||'').slice(0,5);
  const addOff=(b,d)=>{ const a=(b.manual_off_dates||'').split(',').filter(Boolean); if(!a.includes(d)) a.push(d); return a.sort().join(','); };
  const courseBks=()=>BOOKINGS.filter(b=>b.kind==='course' && idset.has(String(b.course_id)) && b.status!=='rejected');
  const sesOf=d=>SES.filter(x=>x.session_date===d&&!x.is_cancelled);
  // 这一回自己的起止时间（单回 time_range，没有才用课程时间）
  const spanOf=(s)=>{ const cc=group.find(g=>String(g.id)===String(s.course_id))||c;
    const tr=normalizeTimeRanges(s.time_range||''); const sp=tr?timeRangesSpan(tr):null;
    return sp&&sp.start?{start:sp.start,end:sp.end,text:tr}:{start:cc.start_time,end:cc.end_time,text:classTimeText(cc)}; };
  // 这一天这门课现在用的占用（临时占用优先）
  const curBk=(d,courseId)=>{ const l=courseBks().filter(b=>String(b.course_id)===String(courseId)&&bookingOnDate(b,d)); return l.find(b=>b.recurrence==='once')||l[0]||null; };
  function paint(){
    const today=todayStr();
    const days={}; SES.filter(x=>!x.is_cancelled&&x.session_date>=today).forEach(s=>{ (days[s.session_date]=days[s.session_date]||[]).push(s); });
    const dates=Object.keys(days).sort();
    const chips=dates.map(d=>{ const s=days[d][0], sp=spanOf(s), b=curBk(d,s.course_id);
      const rm=b&&b.room_id?rname(b.room_id):(b?'线上':'未排教室');
      const moved=!!(b&&b.recurrence==='once'); const on=sel===d;
      return `<span data-d="${d}" style="display:inline-block;cursor:pointer;margin:3px;padding:4px 10px;border-radius:14px;font-size:12px;border:1px solid ${on?'var(--pick-bd)':'var(--line)'};background:${on?'var(--pick-bg)':'#fff'};color:${on?'var(--pick-fg)':'#333'}">${md(d)} 周${WD[weekdayOf(d)%7]} · ${moved?'→ ':''}${esc(rm)}${moved?'（已换）':''} ${esc(hm(sp.start))}-${esc(hm(sp.end))}</span>`; }).join('');
    // 多余的临时占用：这门课那天没有单回
    const orphans=sesLoaded?courseBks().filter(b=>b.recurrence==='once'&&b.booking_date>=today&&!days[b.booking_date]):[];

    mask.innerHTML='<div class="card" style="width:600px;max-width:94vw;margin:auto"><h3 style="margin-top:2px">「'+esc(dispName)+'」调整某一天的教室</h3>'+
      '<div class="muted" style="font-size:12px;margin-bottom:8px">下面是这门课今天以后每一次上课和用的教室。点一天：可以换到别的空教室'+(canEditSes?'，或者改这一回的时间 / 休讲':'')+'。只影响这门课这一天，不影响教室里的其他课。</div>'+
      (!sesLoaded?'<span class="muted">加载中…</span>':(chips||'<span class="muted">今天以后没有可调整的上课日</span>'))+act+orphanHtml+

    mask.querySelectorAll('[data-orph]').forEach(x=>x.onclick=async()=>{

      if(!confirm('删除这门课 '+md(b.booking_date)+' 在 '+(b.room_id?rname(b.room_id):'线上')+' 的临时占用？不影响别的课。')) return;
      try{ await sbDeleteAs('sched_bookings', b.id, actor().last_actor); await reloadAll(); toast('已删除'); paint(); try{ renderAssignView(); }catch(e){} }catch(e){ toast('失败：'+e.message,false); }

    const mdHm=(d,t)=>md(d)+' '+(t||'');
    const ses0=sesOn()[0], bk0=curBk(sel,ses0.course_id), roomId=bk0&&bk0.room_id;
    if(mode==='move'&&canEditSes){
      const ses=sesOn(), tr0=ses[0].time_range||classTimeText(c);

        const nd=el('mv_d').value, tr=normalizeTimeRanges(el('mv_t').value), segs=parseTimeRanges(tr);

            { logs:()=>[schedLogRow(c,'edit',[{field:'session_cancel',label:'第 '+(num||'?')+' 回',from:from,to:'休讲'}])],
              text:()=>'已改：《'+esc(dispName)+'》第 '+esc(String(num||'?'))+' 回 '+esc(md(from))+' 标为休讲（管理端单回已同步，不顺延），那天的教室占用不再显示。' });

    }
    if(mode==='room'){
      const sp=spanOf(ses0), d=sel;
      const rows=ROOMS.filter(r=>r.active!==false).map(r=>({ room:r,
        blockers:(roomId&&String(r.id)===String(roomId))?[]:roomConflicts(BOOKINGS, r.id, d, sp.start, sp.end, null).filter(b=>!idset.has(String(b.course_id)))
          .map(b=>{ const t=bookingTimeOn(b,d); return { title:b.title||KIND_LABEL[b.kind]||'占用', who:b.user_name||'', time:hm(t[0])+'-'+hm(t[1]) }; }) }));
      const h=`<div class="muted" style="font-size:12px;margin-bottom:4px">${md(d)} ${esc(hm(sp.start))}-${esc(hm(sp.end))}（这一回的时间）各教室情况：</div>`+crvRoomPickHtml(rows, roomId);
      el('adj_rooms').innerHTML=h;
      el('adj_rooms').querySelectorAll('[data-room]').forEach(x=>x.onclick=async()=>{
        const r=ROOMS.find(y=>String(y.id)===String(x.dataset.room)); if(!r) return;
        const fromName=roomId?rname(roomId):'线上';
        const busyRow=rows.find(y=>String(y.room.id)===String(r.id)); const busy=(busyRow&&busyRow.blockers)||[];
        if(busy.length){ if(!confirm(crvBusyConfirmText(r, d, sp, busy))) return; }
        else if(!confirm('把 '+md(d)+' 这一回从 '+fromName+' 换到 '+r.name+'？只改这门课这一天的教室，'+fromName+' 的其他课不受影响。')) return;
        const undo=[]; // 撤销用：{del:id} / {upd:id, patch}
        try{
          for(const s of sesOn()){
            const cur=curBk(d,s.course_id), sps=spanOf(s);
            const um=(tpl)=>({uses_meeting:!!r.meeting_account_id && !!tpl.uses_meeting, meeting_account_id:(tpl.uses_meeting&&r.meeting_account_id)||null});
            if(cur&&cur.recurrence==='once'){
              const patch=Object.assign({room_id:r.id}, um(cur), actor());
              undo.push({upd:cur.id, patch:{room_id:cur.room_id, uses_meeting:cur.uses_meeting, meeting_account_id:cur.meeting_account_id}});
              await sbUpdate('sched_bookings', cur.id, patch);
              continue;
            }
            const tpl=cur||courseBks().find(b=>String(b.course_id)===String(s.course_id))||bk0||{};
            const wk=courseBks().filter(b=>b.recurrence==='weekly'&&String(b.course_id)===String(s.course_id)&&bookingOnDate(b,d));
            for(const b of wk){ undo.push({upd:b.id, patch:{manual_off_dates:b.manual_off_dates||null}}); await sbUpdate('sched_bookings', b.id, Object.assign({manual_off_dates:addOff(b,d)}, actor())); }
            const ins=await sbInsert('sched_bookings', Object.assign({
              room_id:r.id, kind:'course', course_id:s.course_id, title:tpl.title||dispName, user_name:tpl.user_name||c.teacher||null,
              recurrence:'once', booking_date:d, start_time:sps.start, end_time:sps.end,
            }, um(tpl), { status:'confirmed', created_by:tpl.created_by||'admin', entry_name:'调整某一天', note:'调整某一天', auto_sync:false }, actor()));
            if(ins&&ins[0]) undo.push({del:ins[0].id});
          }
          // 这一天的「需要协调教室」自动标成已处理，写上安排到哪里
          const ackBack=[];
          try{
            const myRole=(ROLE&&ROLE.role)||'总务', who=schedActorLabel(), toTxt=((r.campus||'')+' '+r.name).trim();
            const logs=(CHANGELOG||[]).filter(l=>(l.action==='room_coord'||l.action==='room_unavailable') && !String(l.acked_by||'').trim() && (Array.isArray(l.changes)?l.changes:[]).some(x=>x&&(x.field==='room_coord'||x.field==='room_unavailable')&&x.date===d&&(idset.has(String(x.course_uuid))||String(l.course_name||'')===String(dispName))));
            for(const l of logs){
              const chg=(l.changes||[]).map(x=>x&&(x.field==='room_coord'||x.field==='room_unavailable')&&x.date===d?Object.assign({},x,{done_room:toTxt, done_by:who, done_at:new Date().toISOString()}):x);
              ackBack.push({id:l.id, acked_by:l.acked_by||'', changes:l.changes});
              await sbUpdate('sched_change_log', l.id, {acked_by:myRole, changes:chg}); l.acked_by=myRole; l.changes=chg;
            }
          }catch(e){ console.warn('标记已处理失败',e); }
          await afterOp();
          schedBar('已把《'+esc(dispName)+'》'+esc(md(d))+' 这一回从 '+esc(fromName)+' 换到 '+esc(r.name)+'（只改这一天，'+esc(fromName)+' 的其他课不受影响）', async()=>{
            for(const u of undo.slice().reverse()){ if(u.del) await sbDelete('sched_bookings', u.del); else await sbUpdate('sched_bookings', u.upd, u.patch); }
            for(const a of ackBack){ await sbUpdate('sched_change_log', a.id, {acked_by:a.acked_by, changes:a.changes}); const l=(CHANGELOG||[]).find(x=>x.id===a.id); if(l){ l.acked_by=a.acked_by; l.changes=a.changes; } }
            await schedRefreshView(); try{ renderChangeAlerts(); }catch(e){} return '已恢复';
          });
          if(busy.length){ const bx=busy[0]; schedBar('<span style="color:#7a5b00">'+esc(md(d))+' 在 '+esc(r.name)+' 跟《'+esc(bx.title)+'》'+esc(bx.time)+' 撞了，调整另一门以后会自动消失。</span>'); }
        }catch(e){
          // 写到一半被数据库挡住：已经改的撤回，不留半截数据；报错改成一句人话
          for(const u of undo.slice().reverse()){ try{ if(u.del) await sbDelete('sched_bookings', u.del); else await sbUpdate('sched_bookings', u.upd, u.patch); }catch(e2){ console.warn('撤回失败',e2); } }
          try{ await schedRefreshView(); }catch(e3){}
          toast(crvDbBlockMsg(e, r.name)||('失败：'+e.message), false);
        }
      });
    }
  }
  function sesOn(){ return sesOf(sel); }
  paint(); loadSes().then(paint);
}
function renderAssignTable(){
  const q=(el('af_q').value||'').trim();
  const term=el('af_term').value, cat=el('af_cat').value, campus=el('af_campus').value, status=el('af_status').value;
  const assigned=new Set(BOOKINGS.filter(b=>isWeeklyCourseBk(b)).map(b=>String(b.course_id)));
  const kind=el('af_kind')?el('af_kind').value:'';
  let list=assignViewCourses().filter(c=>{
    const done=assigned.has(String(c.id));
    if(q && !searchMatch(q,[c.teacher,c.name])) return false;
    if(kind==='online' && !schedIsOnline(c)) return false;
    if(kind==='offline' && schedIsOnline(c)) return false;
    if(term && c.term!==term) return false;
    if(cat && c.category!==cat) return false;
    if(campus && c.campus!==campus) return false;
    if(status==='todo' && (done || schedRemoved(c))) return false;
    if(status==='done' && !done) return false;
    return true;
  });
  el('af_count').textContent = '共 '+list.length+' 门';
  window.AF_LIST = list;
  const tr=window.AF_TRACE;
  if(tr && tr.open && !schedTraceActive(tr)){ el('assignTable').innerHTML=''; return; }
  let h='<table><thead><tr><th>课程</th><th>类别</th><th>校区</th><th>周几</th><th>时段</th><th>日期区间</th><th>人数</th><th>方式</th><th>已排</th><th>操作</th></tr></thead><tbody>';
  if(!list.length) h+='<tr><td colspan="10" class="muted">无匹配课程</td></tr>';
  list.forEach(c=>{
    const done=assigned.has(String(c.id));
    const myb=BOOKINGS.filter(b=>isWeeklyCourseBk(b)&&String(b.course_id)===String(c.id));
    const where=myb.length?(myb[0].room_id?rname(myb[0].room_id):'线上')+(myb[0].uses_meeting?' 📶':''):'';
    const noDate = !c.start_date || !c.end_date;
    const cc=catColor(c.category);
    h+=`<tr><td>${esc(c.name)}<br><small class="muted">${esc(c.teacher||'')}</small></td>`+
      `<td><span style="display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:${cc.bg};color:${cc.tx};border:1px solid ${cc.bd}">${esc(c.category)}</span></td>`+
      `<td>${esc(c.campus)}</td>`+
      `<td>${weekdaysLabel(c.weekdays)}</td><td>${esc(classTimeText(c))}</td>`+
      `<td>${noDate?'<span class="badge b-warn">缺日期</span>':(c.start_date+' ~ '+c.end_date)}</td>`+
      `<td>${c.est_students||'?'}</td><td>${esc(c.mode)}</td>`+
      `<td>${schedRemoved(c)?'<span class="badge b-mute" style="background:#e4e4e4">已移出 · '+esc(c.sched_removed_reason)+'</span>':(done?'<span class="badge b-ok">已排 · '+esc(where)+'</span>':'<span class="badge b-mute">未排</span>')}${schedReqBadgeHtml(c)}</td>`+
      (schedRemoved(c)
        ? `<td><button class="sm ghost" data-restore="${c.id}">恢复到排课</button></td></tr>`
        : `<td><button class="sm" data-as="${c.id}">${done?'重排':'排教室'}</button>${done?(' <button class="sm ghost" data-adj="'+c.id+'">调整某一天</button> <button class="sm ghost" data-clr="'+c.id+'">清空教室</button>'):''}</td></tr>`);
  });
  h+='</tbody></table>';
  el('assignTable').innerHTML=h;
  bind('[data-as]', id=>assignRoomOnly(id));
  bind('[data-adj]', id=>adjustDayDialog(id));
  bind('[data-restore]', id=>schedRestore(id));
  bind('[data-reqview]', id=>schedReqDetail(id));
  bind('[data-clr]', async id=>{
    const c=COURSES.find(x=>String(x.id)===String(id))||{};
    if(!confirm('把「'+(c.name||'')+'」清空教室（改回未排）？将删除它的教室占用记录，会议号绑定不受影响。')) return;
    const bs=BOOKINGS.filter(b=>b.kind==='course'&&String(b.course_id)===String(id));
    for(const b of bs) await sbDelete('sched_bookings', b.id);
    await reloadAll(); renderAssignView(); toast('已清空教室，改为未排');
  });
}
/* 按周排课专用：只选教室、直接生成占用，不绑会议账号（账号统一到「会议链接设定」再绑） */
function assignRoomOnly(courseId){
  const c=COURSES.find(x=>String(x.id)===String(courseId)); if(!c) return;
  const isOnlineCourse = c.mode==='线上'||c.campus==='线上';
  // 系列课：整个系列一次选教室，一起排/一起清
  const groupCourses = c.merge_group ? COURSES.filter(x=>x.merge_group===c.merge_group).sort((a,b)=>(a.merge_order||99)-(b.merge_order||99)) : [c];
  const groupIds = groupCourses.map(x=>String(x.id));
  const dispName = c.merge_name || c.name;
  const wdays=parseWeekdaysSched(c.weekdays);
  if(!wdays.length){ toast('这门课没有设置上课日（周几），无法排。请先在课程管理里给它补上周几。', false); return; }
  const existing=BOOKINGS.filter(b=>isWeeklyCourseBk(b)&&groupIds.includes(String(b.course_id)));
  const ex=existing[0]||null;
  const noDate = groupCourses.some(gc=>!gc.start_date || !gc.end_date);
  // 系列课：每个成员按自己的星期 / 时段 / 日期检查（系列自己已有的占用不算撞）
  const roomFree=r=> groupCourses.every(gc=> parseWeekdaysSched(gc.weekdays).every(wd => !BOOKINGS.some(b=>
      b.status!=='pending' && b.recurrence==='weekly' &&
      !groupIds.includes(String(b.course_id)) &&
      String(b.room_id)===String(r.id) && Number(b.weekday)===wd &&
      overlap(gc.start_time,gc.end_time,b.start_time,b.end_time) &&
      !(gc.end_date&&b.start_date&&gc.end_date<b.start_date) &&
      !(gc.start_date&&b.end_date&&gc.start_date>b.end_date) )));
  // 教室下拉：按容量筛、标出已占。线上课的校区由弹窗里的校区 chips 决定（默认课程登记校区；登记「线上」时用顶部筛选；都没有就要先选）
  const topCampus = el('af_campus')?el('af_campus').value:'';
  let aroCampus = isOnlineCourse
    ? (CAMPUSES.includes(c.campus) ? c.campus : (CAMPUSES.includes(topCampus) ? topCampus : ''))
    : c.campus;

    const btn=el('aro_save'); btn.disabled=true; btn.textContent='生成中…';
    try{
      for(const o of existing) await sbDelete('sched_bookings', o.id);
      // 系列课：每个成员各建自己的占用（同一间教室，各自的星期 / 时段 / 日期），title 用系列名

/* ---------- 移出排课 / 恢复 ----------
   只写管理端 courses 上的 sched_removed_*（排课专用标记，管理端不显示、不用），并删掉这门课的教室占用；不改课程本身，也不删课程*/
async function schedDoRemove(courses, reason){
  const now=new Date().toISOString();
  await schedTrack(courses.map(c=>c.id), async()=>{
    for(const gc of courses){
      for(const b of BOOKINGS.filter(b=>b.kind==='course' && String(b.course_id)===String(gc.id))) await sbDelete('sched_bookings', b.id);
      await schedCourseUpdate(gc.id, {sched_removed_reason:reason, sched_removed_at:now});
    }
  }, { logs:()=>courses.map(gc=>schedLogRow(gc,'edit',[{field:'sched_removed',label:'移出排课',from:'在排课',to:reason}])),
       text:()=>'已同步到管理端：移出排课 '+courses.length+' 门（'+esc(reason)+'）。教室占用已释放，撤销只恢复标记，教室需要重新排。' });
}
function schedRemoveDialog(groupCourses, dispName, afterDone){
  let reason='';
  const m=document.createElement('div');
  m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;z-index:70;overflow:auto;padding:40px 16px';
  const draw=()=>{
    m.innerHTML='<div class="card" style="width:460px;max-width:94vw;margin:auto"><h3 style="margin-top:2px">移出排课：「'+esc(dispName)+'」</h3>'+
      '<div class="tip">只从排课里移出，管理端的课程不受影响；这门课已经占的教室会释放。</div>'+
      '<div class="field"><label>理由</label><div>'+SCHED_REMOVE_REASONS.map(r=>`<span data-rs="${esc(r)}" style="display:inline-block;padding:3px 12px;margin:2px 6px 2px 0;border:1px solid ${r===reason?'var(--pick-bd)':'var(--line)'};border-radius:14px;font-size:13px;cursor:pointer;user-select:none;background:${r===reason?'var(--pick-bg)':'#fff'};color:${r===reason?'var(--pick-fg)':'#666'}">${esc(r)}</span>`).join('')+'</div></div>'+
      (reason==='其他'?'<div class="field" style="margin-top:6px"><label>一句话说明</label><input id="rm_other" placeholder="如：并入别的班" style="width:100%"></div>':'')+
      (groupCourses.length>1?'<p class="muted" style="font-size:12px">这是系列课，整个系列 '+groupCourses.length+' 门课一起移出。</p>':'')+
      '<div style="display:flex;gap:8px;margin-top:12px"><button id="rm_ok">确认移出</button><button class="ghost" id="rm_cancel">返回</button></div></div>';
    m.querySelectorAll('[data-rs]').forEach(x=>x.onclick=()=>{ reason=x.dataset.rs; draw(); });
    m.querySelector('#rm_cancel').onclick=()=>m.remove();
    m.querySelector('#rm_ok').onclick=async()=>{
      let rs=reason; if(!rs){ toast('请选一个理由', false); return; }

      const btn=m.querySelector('#rm_ok'); btn.disabled=true; btn.textContent='处理中…';
      try{
        await schedDoRemove(groupCourses, rs);
        await reloadAll(); m.remove(); if(afterDone) afterDone(); renderAssignView(); toast('已移出排课（管理端课程不受影响）');
      }catch(e){ toast('失败：'+e.message, false); btn.disabled=false; btn.textContent='确认移出'; }

async function schedRestore(id){
  const c=ALL_COURSES.find(x=>String(x.id)===String(id)); if(!c) return;
  const grp = c.merge_group ? ALL_COURSES.filter(x=>x.merge_group===c.merge_group && schedRemoved(x)) : [c];
  if(!confirm('把「'+(c.merge_name||c.name)+'」恢复到排课？恢复后它会重新出现在排教室列表里。')) return;
  try{
    await schedTrack(grp.map(g=>g.id), async()=>{ for(const gc of grp) await schedCourseUpdate(gc.id, {sched_removed_reason:null, sched_removed_at:null}); },
      { logs:()=>grp.map(gc=>schedLogRow(gc,'edit',[{field:'sched_removed',label:'移出排课',from:'已移出',to:'恢复到排课'}])),
        text:()=>'已同步到管理端：《'+esc(c.merge_name||c.name)+'》恢复到排课。' });
    await reloadAll(); if(el('coursesTable')) tabCourses(); else renderAssignView(); toast('已恢复到排课');
  }catch(e){ toast('失败：'+e.message, false); }
}
/* 批量移出已结课：end_date < 今天、没移出、没占教室的课，点选后一起移出（理由「已过期」） */
function schedBatchRemoveEnded(){
  const today=todayStr();
  const hasRoom=new Set(BOOKINGS.filter(b=>isWeeklyCourseBk(b)).map(b=>String(b.course_id)));
  const list=ALL_COURSES.filter(c=>c.end_date && c.end_date<today && !schedRemoved(c) && !hasRoom.has(String(c.id)))
    .sort((a,b)=>(b.end_date||'').localeCompare(a.end_date||''));
  const sel=new Set(list.map(c=>String(c.id)));
  const m=document.createElement('div');
  m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;z-index:70;overflow:auto;padding:40px 16px';
  const draw=()=>{
    m.innerHTML='<div class="card" style="width:640px;max-width:94vw;margin:auto"><h3 style="margin-top:2px">批量移出已结课</h3>'+
      '<div class="tip">列出结课日已过、没占教室的课。只从排课里移出（理由「已过期」），管理端的课程不受影响。点一行可取消 / 选中。</div>'+
      (list.length?('<div style="display:flex;gap:8px;margin:6px 0"><button class="ghost sm" id="bm_all">全选</button><button class="ghost sm" id="bm_none">全不选</button><span class="muted" style="align-self:center">已选 '+sel.size+' / '+list.length+' 门</span></div>'+
        '<div style="max-height:50vh;overflow:auto">'+list.map(c=>{ const on=sel.has(String(c.id));
          return `<div data-bm="${c.id}" style="cursor:pointer;border:1px solid ${on?'var(--pick-bd)':'var(--line)'};background:${on?'#eef4f0':'#fff'};border-radius:7px;padding:6px 10px;margin-bottom:5px;font-size:13px"><b>${esc(c.name)}</b> <span class="muted">${esc(c.teacher||'')} · ${esc(c.campus||'')} · 结课 ${esc(c.end_date)}</span></div>`; }).join('')+'</div>')
        :'<div class="muted" style="margin:10px 0">没有符合条件的课。</div>')+
      '<div style="display:flex;gap:8px;margin-top:12px">'+(list.length?'<button id="bm_ok"'+(sel.size?'':' disabled')+'>移出所选 '+sel.size+' 门</button>':'')+'<button class="ghost" id="bm_cancel">关闭</button></div></div>';
    m.querySelector('#bm_cancel').onclick=()=>m.remove();
    m.querySelectorAll('[data-bm]').forEach(x=>x.onclick=()=>{ const k=x.dataset.bm; sel.has(k)?sel.delete(k):sel.add(k); draw(); });
    if(m.querySelector('#bm_all')) m.querySelector('#bm_all').onclick=()=>{ list.forEach(c=>sel.add(String(c.id))); draw(); };
    if(m.querySelector('#bm_none')) m.querySelector('#bm_none').onclick=()=>{ sel.clear(); draw(); };
    if(m.querySelector('#bm_ok')) m.querySelector('#bm_ok').onclick=async()=>{
      const pick=list.filter(c=>sel.has(String(c.id)));
      if(!pick.length) return;
      if(!confirm('把 '+pick.length+' 门已结课的课从排课里移出？管理端的课程不受影响。')) return;
      const btn=m.querySelector('#bm_ok'); btn.disabled=true; btn.textContent='处理中…';
      try{ await schedDoRemove(pick, '已过期'); await reloadAll(); m.remove(); renderAssignView(); toast('已移出 '+pick.length+' 门（管理端课程不受影响）'); }
      catch(e){ toast('失败：'+e.message, false); btn.disabled=false; btn.textContent='重试'; }
    };
  };
  draw(); document.body.appendChild(m);
}
/* ---------- 推送给负责人确认（写 sched_course_requests；course_id = 管理端课程 id）---------- */
const CRQ_ISSUES=[['no_room','没有教室'],['time_conflict','时间冲突'],['capacity','容量不够'],['other','其他']];
const crqIssueText=k=>(CRQ_ISSUES.find(x=>x[0]===k)||[k,k])[1];
function schedReqOpenFor(courseId){ return (REQUESTS||[]).find(r=>String(r.course_id)===String(courseId) && (r.status==='pending'||r.status==='replied')) || null; }
function schedReqLabel(r){
  if(r.status==='pending') return '已推送 · 待负责人确认';
  if(r.status==='replied') return '负责人已回复：'+(r.reply_action||(r.reply||'').slice(0,12)||'已回复');
  return '';
}
function schedReqBadgeHtml(c){
  const r=schedReqOpenFor(c.id); if(!r) return '';
  return '<br><span class="badge '+(r.status==='replied'?'b-ok':'b-warn')+'" style="cursor:pointer;margin-top:3px" data-reqview="'+c.id+'">'+esc(schedReqLabel(r))+'</span>';
}
/* 自动生成推送说明：课程信息 + 冲突在哪 + 可调整建议（当天其他时段、前后几天同时段、另一校区），写法同 VIP 驳回文案 */
function schedPushMessage(c, dispName, groupCourses, issues){
  const groupIds=groupCourses.map(x=>String(x.id));
  const wdays=parseWeekdaysSched(c.weekdays);
  const bks=BOOKINGS.filter(b=>!(b.kind==='course' && groupIds.includes(String(b.course_id))));
  const topCampus=el('af_campus')?el('af_campus').value:'';
  const campus=CAMPUSES.includes(c.campus)?c.campus:(CAMPUSES.includes(topCampus)?topCampus:CAMPUSES[0]);
  const rooms=ROOMS.filter(r=>r.active!==false && r.campus===campus);
  const fit=r=>!c.est_students || !r.capacity || r.capacity>=c.est_students;
  const busyOf=(r)=>bks.filter(b=>b.status!=='pending' && b.recurrence==='weekly' && String(b.room_id)===String(r.id) && wdays.includes(Number(b.weekday)) &&
      overlap(c.start_time,c.end_time,b.start_time,b.end_time) &&
      !(c.end_date&&b.start_date&&c.end_date<b.start_date) && !(c.start_date&&b.end_date&&c.start_date>b.end_date));
  const range=(c.start_date||'?')+' ~ '+(c.end_date||'?');
  let m=`「${dispName}」${c.campus&&c.campus!=='线上'?c.campus+' ':''}${weekdaysLabel(c.weekdays)} ${c.start_time||''}-${c.end_time||''}，${range}，预估${c.est_students||'?'}人，目前排不进教室。`;
  m+='\n问题：'+(issues.length?issues.map(crqIssueText).join('、'):'（请选择）')+'。';
  const lines=[];
  rooms.forEach(r=>{ const bs=busyOf(r); if(bs.length) lines.push(`${campus} ${r.name} 该时段已被「${[...new Set(bs.map(b=>b.title||'占用'))].slice(0,2).join('」「')}」占用`); });
  if(lines.length) m+='\n冲突：'+lines.slice(0,5).join('；')+'。';
  if(issues.includes('capacity')){ const mx=Math.max(0,...rooms.map(r=>r.capacity||0)); m+=`\n容量：${campus}最大的教室只能坐 ${mx||'?'} 人，放不下预估的 ${c.est_students||'?'} 人。`; }
  // 就近建议：以第一个上课日为代表日期，在本校区放得下的教室里找
  let rep=null;
  if(wdays.length){ let d=(c.start_date && c.start_date>todayStr())?c.start_date:todayStr(); for(let i=0;i<14;i++){ if(wdays.includes(weekdayOf(d))){ rep=d; break; } d=addDays(d,1); } }
  const cand=rooms.filter(fit);
  const slots=new Set(), dates=new Set();
  if(rep && c.start_time && c.end_time){
    cand.forEach(r=>{ const nb=findNearby(bks, r.id, rep, c.start_time, c.end_time, 5); nb.sameDay.forEach(t=>slots.add(t)); nb.nearDates.forEach(o=>dates.add(o.date)); });
  }
  const adv=[];
  if(slots.size) adv.push('当天可改的时段：'+[...slots].sort().slice(0,5).join('、'));
  if(dates.size) adv.push('同时段前后几天有空：'+[...dates].sort().slice(0,5).map(d=>d.slice(5)+'（'+weekdaysLabel(String(weekdayOf(d)))+'）').join('、')+'（只供参考，课程是每周固定上课）');
  const oth=CAMPUSES.filter(x=>x!==campus).map(cp=>{
    const free=ROOMS.filter(r=>r.active!==false && r.campus===cp && fit(r) && !busyOf(r).length).map(r=>r.name);
    return free.length?`${cp}同时段有空教室：${free.slice(0,4).join('、')}`:'';
  }).filter(Boolean);
  adv.push(...oth);
  if(adv.length) m+='\n可调整的建议：'+adv.join('；')+'。';
  m+='\n麻烦回复希望的调整（改时间 / 改线上 / 本期不开 / 换校区），谢谢！';
  return m;
}
function schedPushDialog(c, dispName, groupCourses){

  const draw=()=>{

      '<div class="field"><label>问题（可多选）</label><div>'+CRQ_ISSUES.map(([k,t])=>`<span data-is="${k}" style="display:inline-block;padding:3px 12px;margin:2px 6px 2px 0;border:1px solid ${issues.has(k)?'var(--pick-bd)':'var(--line)'};border-radius:14px;font-size:13px;cursor:pointer;user-select:none;background:${issues.has(k)?'var(--pick-bg)':'#fff'};color:${issues.has(k)?'var(--pick-fg)':'#666'}">${t}</span>`).join('')+'</div></div>'+
      '<div class="field" style="margin-top:6px"><label>说明（自动生成，可以改）</label><textarea id="pu_msg" rows="9" style="width:100%">'+esc(msg)+'</textarea></div>'+

    m.querySelectorAll('[data-is]').forEach(x=>x.onclick=()=>{ const k=x.dataset.is; issues.has(k)?issues.delete(k):issues.add(k);
      if(!edited) msg=schedPushMessage(c, dispName, groupCourses, [...issues]); else msg=m.querySelector('#pu_msg').value; draw(); });
    m.querySelector('#pu_msg').oninput=e=>{ edited=true; msg=e.target.value; };
    m.querySelector('#pu_cancel').onclick=()=>m.remove();
    m.querySelector('#pu_ok').onclick=async()=>{
      msg=m.querySelector('#pu_msg').value.trim();
      if(!issues.size){ toast('请至少选一个问题', false); return; }
      if(!msg){ toast('说明不能为空', false); return; }
      const btn=m.querySelector('#pu_ok'); btn.disabled=true; btn.textContent='推送中…';
      const who=(ROLE&&(ROLE.label||ROLE.role))||'排课';
      try{
        if(pendingReq){
          const stamp=new Date().toLocaleString('zh-CN',{hour12:false});
          await sbUpdate('sched_course_requests', pendingReq.id, {
            issues:[...new Set([...(pendingReq.issues||[]), ...issues])],
            message:pendingReq.message+'\n\n【追加 '+stamp+' · '+who+'】\n'+msg });
        } else {
          let dom=c.category||null, maj=null;
          try{ const r=await sbGet('courses','select=domain,major&id=eq.'+c.id+'&limit=1'); if(r[0]){ dom=r[0].domain||dom; maj=r[0].major||null; } }catch(e){}
          await sbInsert('sched_course_requests', { course_id:c.id, domain:dom, major:maj, issues:[...issues], message:msg, status:'pending', created_by:who });
        }
        await reloadAll(); m.remove(); const am=document.getElementById('aroMask'); if(am) am.remove(); renderAssignView();

    };
  };
  draw(); document.body.appendChild(m);
}

function assignForm(courseId){
  const c=COURSES.find(x=>String(x.id)===String(courseId));
  const wdays=parseWeekdaysSched(c.weekdays);
  if(!wdays.length){ toast('这门课没有设置上课日（周几），无法排。请先在课程管理里给它补上周几。', false); return; }
  const online=c.mode==='线上';
  const existing=BOOKINGS.filter(b=>isWeeklyCourseBk(b)&&String(b.course_id)===String(c.id));
  const ex=existing[0]||null;  // 重排时回显
  function candList(allCampus){
    let list=ROOMS.filter(r=>r.active && (allCampus || r.campus===c.campus));
    if(c.est_students) list=list.filter(r=>r.capacity>=c.est_students);
    return list;
  }
  const roomFree=r=> wdays.every(wd => !BOOKINGS.some(b=>
      b.status!=='pending' && b.recurrence==='weekly' &&
      String(b.course_id)!==String(c.id) &&
      String(b.room_id)===String(r.id) && Number(b.weekday)===wd &&
      overlap(c.start_time,c.end_time,b.start_time,b.end_time) &&
      !(c.end_date&&b.start_date&&c.end_date<b.start_date) &&
      !(c.start_date&&b.end_date&&c.start_date>b.end_date) ));
  function roomOptions(allCampus){
    const cand=candList(allCampus);
    let o = cand.length? '' : '<option value="">无满足容量的教室</option>';
    cand.forEach(r=>{ const free=roomFree(r); const sel=ex&&String(ex.room_id)===String(r.id)?' selected':'';
      const camp = r.campus!==c.campus ? ('['+esc(r.campus)+'] ') : '';
      o+=`<option value="${r.id}"${(free||sel)?'':' disabled'}${sel}>${camp}${esc(r.name)}（${r.capacity}人）${free?'':' — 有上课日该时段已占'}</option>`; });
    return o;
  }
  let h='<div style="position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;z-index:60;overflow:auto;padding:40px 16px">'+
    '<div class="card" style="width:520px;max-width:94vw;margin:auto"><h3 style="margin-top:2px">'+(ex?'重排':'排')+'「'+esc(dispName)+'」教室</h3>'+
    `<div class="muted" style="margin-bottom:8px">${esc(c.campus)} · ${weekdaysLabel(c.weekdays)} · ${c.start_time}-${c.end_time} · 预估${c.est_students||'?'}人 · ${c.mode}</div>`;
  if(ex){ const exRoom=ex.room_id?rname(ex.room_id):'线上'; h+='<div class="tip">当前已排：<b>'+esc(exRoom)+'</b> · '+(ex.uses_meeting?('占用账号 '+esc(aname(ex.meeting_account_id))):'不占账号')+'。下面可调整后重新生成。</div>'; }
  const noDate = !c.start_date || !c.end_date;
  if(noDate){
    h+='<div class="tip" style="background:#fdecea;border-color:#e6b8b3">这门课还没有日期，请先在管理端『课程安排』填好，不能排。</div>';
  }else{
    h+=`<div class="field" style="margin-bottom:8px"><label>日期区间</label><div>${c.start_date} ~ ${c.end_date}</div></div>`;
  }
  if(!online){
    h+='<div class="field"><label>选择教室（仅列容量足够）</label><select id="as_room">'+roomOptions(false)+'</select></div>'+
      '<label style="font-size:12px;display:flex;align-items:center;gap:6px;margin-top:4px;cursor:pointer">'+
      '<input type="checkbox" id="as_all"> 显示其它校区/租借的教室（本校区教室不够时用）</label>';
  }
  const exUm = ex? ex.uses_meeting : online;
  h+='<div class="field" style="margin-top:8px"><label>是否占用会议账号'+(online?'（线上课必占）':'（线下直播才占）')+'</label>'+
    `<select id="as_um">${online?`<option value="true">是</option>`:`<option value="false"${exUm?'':' selected'}>否</option><option value="true"${exUm?' selected':''}>是</option>`}</select></div>`;
  // 账号：默认用教室固定账号，自动带出；冲突时才提示并允许改临时账号
  h+='<div class="field '+((online||exUm)?'':'hidden')+'" id="as_accWrap" style="margin-top:8px"><label>会议账号</label><div id="as_accBox"></div></div>';
  h+='<div id="as_warn" class="hidden" style="margin-top:8px"></div>';
  h+='<div style="margin-top:12px"><button id="as_do">生成占用</button> <button class="ghost" id="as_cancel">取消</button></div></div></div>';
  el('asForm').innerHTML=h;
  el('as_cancel').onclick=()=>el('asForm').innerHTML='';

  function acctConflictDays(accId, sd, ed){
    return wdays.filter(wd => BOOKINGS.some(b=>
      b.status!=='pending' && b.uses_meeting && String(b.meeting_account_id)===String(accId) &&
      String(b.course_id)!==String(c.id) && b.recurrence==='weekly' && Number(b.weekday)===wd &&
      overlap(c.start_time,c.end_time,b.start_time,b.end_time) &&
      !(ed&&b.start_date&&ed<b.start_date) && !(sd&&b.end_date&&sd>b.end_date) ));
  }
  function refreshAcc(){

      const cur = (ex&&ex.meeting_account_id) || (cand[0]&&cand[0].id);
      const opt = a=>{ const busy=acctConflictDays(a.id,sd,ed).length>0;
        return `<option value="${a.id}"${String(cur)===String(a.id)?' selected':''}${busy?' disabled':''}>${esc(a.name)}${busy?'（该时段已占）':'（空闲）'}</option>`; };
      el('as_accBox').innerHTML='<div class="muted" style="font-size:12px;margin-bottom:4px">线上课需手动指定腾讯账号（用对应教室的账号）：</div>'+
        '<select id="as_acc">'+cand.map(opt).join('')+'</select>';
      return;
    }
    // 线下课：默认用教室绑定的固定账号，但始终可手动改选
    const r=ROOMS.find(x=>String(x.id)===String(el('as_room').value));
    const boundAcc = r?r.meeting_account_id:null;
    let chosen = (ex&&ex.meeting_account_id) || boundAcc || null;
    // 列出所有账号（固定+临时），教室绑定的排最前并标注
    const opts=ACCOUNTS.map(a=>{
      const isBound = String(a.id)===String(boundAcc);
      const sel = String(a.id)===String(chosen)?' selected':'';
      return `<option value="${a.id}"${sel}>${esc(a.name)}${isBound?'（本教室固定）':(a.kind==='临时'?'（临时）':'')}</option>`;
    }).join('');
    let warnHtml='';
    const conflictDays = acctConflictDays(chosen, sd, ed);
    if(conflictDays.length){
      warnHtml='<div class="badge b-err" style="margin-bottom:6px">账号 '+esc(aname(chosen))+' 在 '+conflictDays.map(d=>WEEKDAYS[d]).join('/')+' 该时段已被占用，请改选其它账号</div>';
    }
    el('as_accBox').innerHTML=warnHtml+
      '<select id="as_acc">'+opts+'</select>'+
      (boundAcc?' <span class="badge b-ok">默认=本教室固定账号，可改</span>':' <span class="badge b-warn">本教室未设固定账号，请选择</span>');
    // 改选账号时重新检测冲突提示
    el('as_acc').onchange=()=>{
      const nid=el('as_acc').value; const cd=acctConflictDays(nid, sd, ed);
      const box=el('as_accBox').querySelector('.badge.b-err');
      if(cd.length){ if(!box){ const d=document.createElement('div'); d.className='badge b-err'; d.style.marginBottom='6px'; el('as_accBox').prepend(d); }
        el('as_accBox').querySelector('.badge.b-err').textContent='账号 '+aname(nid)+' 在 '+cd.map(x=>WEEKDAYS[x]).join('/')+' 该时段已被占用';
      } else if(box){ box.remove(); }
    };
  }
  if(!online){ el('as_um').onchange=refreshAcc; el('as_room').onchange=refreshAcc;
    el('as_all').onchange=()=>{ el('as_room').innerHTML=roomOptions(el('as_all').checked); refreshAcc(); }; }
  refreshAcc();

  el('as_do').onclick=async()=>{
    const um = online ? true : el('as_um').value==='true';
    const roomId = online ? null : Number(el('as_room').value);
    if(!online && !roomId){ el('as_warn').className=''; el('as_warn').innerHTML='<span class="badge b-err">请选择教室</span>'; return; }
    let sd=c.start_date, ed=c.end_date;
    if(noDate){ el('as_warn').className=''; el('as_warn').innerHTML='<span class="badge b-err">这门课还没有日期，请先在管理端『课程安排』填好</span>'; return; }
    const accId = um ? Number(el('as_acc').value) : null;
    const recs = wdays.map(wd=>({ room_id:roomId, kind:'course', course_id:c.id,
      title:c.name, user_name:c.teacher||null, recurrence:'weekly', weekday:wd,
      start_date:sd, end_date:ed, start_time:c.start_time, end_time:c.end_time,
      uses_meeting:um, meeting_account_id:accId,
      status:'confirmed', created_by:'admin', entry_name:'排课自动生成', note:'排课自动生成' }));
    try{
      for(const o of existing) await sbDelete('sched_bookings',o.id);
      await sbInsert('sched_bookings',recs);
      await reloadAll();
      if(el('assignTable')) renderAssignTable();
      if(um){ meetingLinkStep(c, accId); }   // 占账号 → 进入设定会议链接步骤
      else { el('asForm').innerHTML=''; toast('已生成整学期占用（'+recs.length+' 天/周）'); }
    }catch(e){ el('as_warn').className=''; el('as_warn').innerHTML='<span class="badge b-err">'+esc(e.message)+'</span>'; }
  };
}
/* 生成会议标题：期-类别-（课程名 或 专业名） */
function makeMeetingTitle(c, generic, majorName){
  const term=c.term||'', cat=c.category||'';
  const tail = generic ? (majorName||c.major||'专业课') : (c.name||'');
  return [term,cat,tail].filter(Boolean).join('-');
}

      h+='<table style="margin-top:6px"><tbody>'+

         `<tr><td class="muted">登录账号</td><td>${esc(acc.account_no||'—')} ${acc.account_no?('<button type="button" class="ghost sm" data-cp="'+esc(acc.account_no)+'">复制</button>'):''}</td></tr>`+

  function bindEvents(tpls){
    document.querySelectorAll('.ttype').forEach(b=>b.onclick=()=>{ useGeneric=b.dataset.g==='1'; chosenTpl=null; parsed=null; render(); });
    const mj=el('mk_major'); if(mj) mj.oninput=()=>{ const t=el('mk_title'); if(t) t.value=makeMeetingTitle(c,true,mj.value); };

    el('mk_parse').onclick=()=>{

      el('mk_prev').innerHTML='<table><tbody>'+
        `<tr><td class="muted">会议链接</td><td>${parsed.link?esc(parsed.link):'—'}</td></tr>`+
        `<tr><td class="muted">会议号</td><td>${parsed.id?esc(parsed.id):'—'}</td></tr>`+
        `<tr><td class="muted">时段</td><td>${parsed.start_time?parsed.start_time+'-'+parsed.end_time:'—'}</td></tr>`+
        (parsed.host_key?`<tr><td class="muted">主持人密钥</td><td>${esc(parsed.host_key)}</td></tr>`:'')+
        '</tbody></table>';
      if(parsed.host_key && el('mk_hostkey') && !el('mk_hostkey').value) el('mk_hostkey').value=parsed.host_key;
      el('mk_save').disabled=false;
    };
    el('mk_cancel').onclick=()=>{ el('asForm').innerHTML=''; toast('已取消：本次教室占用未完成（未绑定会议）', false); };
    el('mk_save').onclick=async()=>{
      // 复用模板：直接套用模板的会议信息
      let link, mid, hkey, title=el('mk_title')?el('mk_title').value.trim():'';
      if(chosenTpl){ link=chosenTpl.meeting_link; mid=chosenTpl.meeting_id; hkey=chosenTpl.host_key||null; }
      else { if(!parsed){ warn('请先解析会议邀请，或选一个已有通用会议'); return; } link=parsed.link||null; mid=parsed.id||null; hkey=(parsed&&parsed.host_key)||null; }
      const _hkInput=el('mk_hostkey')?el('mk_hostkey').value.trim():''; if(_hkInput) hkey=_hkInput;  // 手填优先
      const btn=el('mk_save'); if(btn.disabled) return; btn.disabled=true; btn.textContent='保存中…';
      try{
        await schedTrack([c.id], async()=>{ await schedCourseUpdate(c.id, { meeting_link:link||null, meeting_id:mid||null, host_key:hkey||null }); },
          { logs:d=>d.courses.length?[schedLogRow(c,'edit',[{field:'meeting_link',label:'会议链接',from:c.meeting_link||'（空）',to:link||'（空）'}])]:[],
            text:()=>'已同步到管理端：《'+esc(c.name)+'》会议链接已写入。' });
        // 通用标题且是新建 → 存入模板库，供本期同专业复用
        if(useGeneric && !chosenTpl){
          const majorName = el('mk_major')?el('mk_major').value.trim():'';
          await sbInsert('sched_meeting_templates', { term:c.term||null, major:majorName||null, title:title||null,
            meeting_link:link||null, meeting_id:mid||null, host_key:hkey||null, account_id:accId||null,
            start_time:c.start_time||null, end_time:c.end_time||null });
          try{ MTEMPLATES = await sbGet('sched_meeting_templates','select=*&order=created_at.desc'); }catch(e){}
        }
        await reloadAll(); if(el('assignTable')) renderAssignTable();
        el('asForm').innerHTML=''; toast('已完成：教室占用 + 腾讯会议已绑定');
      }catch(e){ warn(esc(e.message)); btn.disabled=false; btn.textContent='完成占用'; }
    };
    function warn(m){ el('mk_warn').className=''; el('mk_warn').innerHTML='<span class="badge b-err">'+m+'</span>'; }
  }
  render();
}

/* ---------- 同步检查（原「冲突检查」）：① 同步检查 ② 教室 / 会议账号冲突 ③ 排不下预警（默认折叠） ---------- */
function tabConflict(){
