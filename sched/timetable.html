<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>课表 · 唯新</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
:root{
  --bg:#f7f5f0; --surface:#fff; --border:#e2ded6; --border-light:#ede9e2;
  --tp:#1a1814; --ts:#5a5650; --tm:#9a9590; --sat:#1a4a8a; --sun:#8a1a2c;
  --k-lang-bg:#ddeaf8; --k-lang:#1a3a6a;
  --k-bunka-bg:#ddf0e0; --k-bunka:#1a4a28;
  --k-rika-bg:#e8e4f8; --k-rika:#3a2a7a;
  --k-gbunka-bg:#faecd8; --k-gbunka:#5a3010;
  --k-grika-bg:#d8f0ea; --k-grika:#0a4038;
  --k-common-bg:#ece8e0; --k-common:#3a3830;
}
#cal, #cal *{ font-family:'DM Mono','Noto Serif SC',monospace; }
#cal{ background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:1.5rem; margin-top:14px; color:var(--tp); }
#cal .chead{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:14px; }
#cal h2{ font-family:'Noto Serif SC',serif; font-size:1.4rem; font-weight:600; }
#cal .sub{ font-size:11px; color:var(--tm); letter-spacing:.05em; text-transform:uppercase; margin-top:3px; }
#cal .legend{ display:flex; gap:16px; flex-wrap:wrap; margin:0 0 16px; padding-bottom:12px; border-bottom:1px solid var(--border); }
#cal .lg{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ts); }
#cal .lg i{ width:9px; height:9px; border-radius:2px; }
#cal .vt{ display:flex; gap:6px; margin-bottom:16px; }
#cal .vt button{ padding:4px 14px; border:1px solid var(--border); border-radius:3px; background:transparent; font-family:inherit; font-size:11px; color:var(--tm); cursor:pointer; letter-spacing:.04em; }
#cal .vt button.on{ border-color:var(--ts); color:var(--tp); background:var(--surface); }
#cal .wk{ margin-bottom:1.6rem; }
#cal .wkl{ font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--tm); margin-bottom:6px; }
#cal .grid{ border:1px solid var(--border); border-radius:4px; overflow:hidden; background:var(--surface); display:grid; }
#cal .hcell{ background:var(--bg); padding:6px 4px 5px; text-align:center; border-bottom:1px solid var(--border); border-left:1px solid var(--border-light); }
#cal .hcell .dow{ display:block; font-size:10px; font-weight:500; letter-spacing:.04em; color:var(--ts); }
#cal .hcell.sat .dow{ color:var(--sat); } #cal .hcell.sun .dow{ color:var(--sun); }
#cal .hcell .dt{ display:block; font-size:10px; color:var(--tm); margin-top:1px; }
#cal .tcell{ background:var(--bg); padding:6px 8px; font-size:10px; color:var(--tm); display:flex; align-items:center; border-top:1px solid var(--border-light); white-space:pre-line; line-height:1.35; border-bottom:1px solid var(--border); }
#cal .ecell{ padding:4px; border-top:1px solid var(--border-light); border-left:1px solid var(--border-light); display:flex; flex-direction:column; gap:3px; align-items:stretch; justify-content:center; min-height:46px; }
#cal .ev{ border-radius:3px; padding:3px 5px; font-size:10px; font-weight:500; text-align:center; line-height:1.35; }
#cal .ev small{ display:block; font-size:9px; opacity:.7; }
.e-lang{ background:var(--k-lang-bg); color:var(--k-lang); }
.e-bunka{ background:var(--k-bunka-bg); color:var(--k-bunka); }
.e-rika{ background:var(--k-rika-bg); color:var(--k-rika); }
.e-gbunka{ background:var(--k-gbunka-bg); color:var(--k-gbunka); }
.e-grika{ background:var(--k-grika-bg); color:var(--k-grika); }
.e-common{ background:var(--k-common-bg); color:var(--k-common); }
#cal .mcell{ min-height:78px; padding:4px; border-top:1px solid var(--border-light); border-left:1px solid var(--border-light); display:flex; flex-direction:column; gap:2px; overflow:hidden; }
#cal .mcell.empty{ background:#faf8f4; }
#cal .ev.off{ background:#eee !important; color:#999 !important; text-decoration:line-through; }
/* 打印页眉：屏幕隐藏，打印显示 */
#printHead{ display:none; }
@media print{
  #nav,.card.filters,#cal .vt,#calBody{ display:none !important; }
  #cal{ border:none; padding:0; }
  #printHead{ display:none; }
  #printBlock{ display:block !important; }
  /* 封面页：back.jpg 铺满 A4 横版，标题+说明居中叠图上 */
  .cover{ position:relative; width:100%; height:190mm; break-after:page; overflow:hidden; }
  .cover img.bg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .cover .cov-in{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 30mm; }
  .cover .cov-logo{ height:22mm; width:auto; margin-bottom:8mm; }
  .cover .cov-title{ font-family:'Noto Serif SC',serif; font-size:26px; font-weight:700; color:#2b2822; letter-spacing:.04em; margin-bottom:2mm; }
  .cover .cov-sub{ font-size:13px; color:#6a655c; margin-bottom:10mm; letter-spacing:.05em; }
  .cover .cov-notes{ font-size:11px; color:#5a5650; line-height:1.9; text-align:left; max-width:170mm; }
  .cover .cov-notes .nt{ margin-bottom:2mm; padding-left:1.2em; text-indent:-1.2em; }
  .cover .cov-extra{ margin-top:8mm; font-size:11px; color:#7a756c; white-space:pre-wrap; }
  .print-sec{ margin-bottom:16px; }
  .print-sec > h3{ font-family:'Noto Serif SC',serif; font-size:15px; margin:0 0 10px; color:#2b2822; }
  .wk{ break-inside:avoid; }
  @page{ size: A4 landscape; margin:10mm; }
}
#cal .mcell .md{ font-size:10px; color:var(--tm); font-weight:500; }
#cal .mcell .md.sat{ color:var(--sat); } #cal .mcell .md.sun{ color:var(--sun); }
#cal .ev.mini{ text-align:left; padding:2px 4px; }
@media print{ #nav,.card.filters,#cal .vt{ display:none !important; } #cal{ border:none; } }
/* 分享模式：URL 带 ?t= 时，页面一加载就隐藏后台界面（避免闪现） */
html.shareview #nav, html.shareview .card.filters{ display:none !important; }
html.shareview #calBody:empty::after{ content:'课表加载中…'; color:#9a9590; font-size:13px; display:block; padding:24px; }
</style>
<script>if(new URLSearchParams(location.search).get('t')) document.documentElement.classList.add('shareview');</script>
</head><body>
<div id="nav"></div>
<div class="wrap">
  <div class="card filters">
    <div class="row">
      <div class="field"><label>模板</label><select id="tpl"><option value="">（不使用）</option></select></div>
      <div class="field"><label>模板名</label><input id="tplLabel" placeholder="如 张三·理科化学"></div>
      <div class="field"><label>分享后缀（英文，选填）</label><input id="tplSlug" placeholder="如 keiei-q4"></div>
      <div class="field"><label>&nbsp;</label><button class="ghost" id="tplSave">保存为模板</button></div>
      <div class="field"><label>&nbsp;</label><button class="ghost sm" id="tplDel">删除所选模板</button></div>
    </div>
    <div id="shareBar" class="hidden" style="margin:6px 0 0;font-size:13px"></div>
    <div class="row" style="margin-top:8px">
      <div class="field"><label>期（可多选）</label><div id="termTags" style="display:flex;gap:6px;flex-wrap:wrap;max-width:360px"></div></div>
      <div class="field"><label>类别</label><select id="cat"></select></div>
      <div class="field"><label>专业</label><select id="major"></select></div>
      <div class="field"><label>是否含语言课</label><select id="lang"><option value="1">含语言课</option><option value="0">不含</option></select></div>
      <div class="field"><label>校区（可选）</label><select id="campus"></select></div>
      <div class="field"><label>&nbsp;</label><button id="go">生成课表</button></div>
      <div class="field"><label>&nbsp;</label><button class="ghost" id="print">生成PDF预览</button></div>
    </div>
    <div class="row" style="margin-top:8px;align-items:flex-end">
      <div class="field"><label>限制日期范围</label><select id="ttLimit"><option value="0">不限（全部）</option><option value="1">只看某段时间</option></select></div>
      <div class="field"><label>封面显示课程小标</label><select id="ttLegend"><option value="1">显示</option><option value="0">不显示</option></select></div>
      <div class="field"><label>封面图</label><select id="ttCover"><option value="1">封面 1</option><option value="2">封面 2</option><option value="3">封面 3</option><option value="4">封面 4</option></select></div>
      <div class="field ttRange hidden"><label>起</label><input type="date" id="ttStart"></div>
      <div class="field ttRange hidden"><label>止</label><input type="date" id="ttEnd"></div>
      <div class="field ttRange hidden"><label>&nbsp;</label><span class="muted" style="font-size:12px">只生成这段时间内在上的课，跨度大时更清爽</span></div>
    </div>
    <div class="row" style="margin-top:8px">
      <div class="field" style="flex:1;min-width:280px"><label>课表标题（手动，留空则按模板自动生成）</label><input id="ttTitle" placeholder="如：唯新教育 2026年10月期 大学院文科 课程表" style="width:100%"></div>
    </div>
    <div class="row" style="margin-top:8px">
      <div class="field" style="flex:1;min-width:280px"><label>封面说明（每行一条，可自由换行）</label><textarea id="pdfCover" rows="4" placeholder="上课顺序和具体时间有调整的可能性，若有变动，将会在班级群内通知，一切以群内通知为准。&#10;校内考系列课程届时会根据同学实际出愿情况详细安排。&#10;定期面谈、升学规划、出愿材料指导、研究计划书修改等，均为班主任预约制1对1辅导，不显示在课表内。" style="width:100%;font-size:12px;line-height:1.7"></textarea></div>
      <div class="field" style="flex:1;min-width:220px"><label>页眉说明（每页顶部，选填）</label><textarea id="pdfHeader" rows="4" placeholder="如：唯新教育 · 社会人文课程表 · 2026年10月期" style="width:100%;font-size:12px;line-height:1.7"></textarea></div>
    </div>
    <div class="field" style="margin-top:12px">
      <label>专业/共通课程（点选加入，可多选；可用「全选当前结果」一次全选；不选则不含专业课）</label>
      <div class="row" style="margin:4px 0 6px">
        <div class="field"><label style="font-size:11px">班级性质</label><select id="c_kind" style="min-width:110px"><option value="">全部性质</option></select></div>
        <div class="field" style="flex:1;min-width:160px"><label style="font-size:11px">搜索课名</label><input id="c_q" placeholder="关键词过滤"></div>
        <div class="field"><label style="font-size:11px">&nbsp;</label><button type="button" class="ghost sm" id="c_all">全选当前结果</button></div>
        <div class="field"><label style="font-size:11px">&nbsp;</label><button type="button" class="ghost sm" id="c_none">清空</button></div>
      </div>
      <div id="courseTags" style="max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px;display:flex;flex-direction:column;gap:3px"></div>
    </div>
    <div class="field" id="langWrap" style="margin-top:16px;border-top:2px dashed #cfe3d6;padding-top:12px">
      <label style="color:#2f6b4f;font-weight:600">🗣️ 语言课（与专业课分开，点选加入；不选则不含语言课）</label>
      <div class="row" style="margin:4px 0 6px">
        <div class="field"><label style="font-size:11px">语种</label><select id="l_type" style="min-width:90px"><option value="">日语+英语</option><option value="日语">仅日语</option><option value="英语">仅英语</option></select></div>
        <div class="field"><label style="font-size:11px">班级性质</label><select id="l_kind" style="min-width:110px"><option value="">全部性质</option></select></div>
        <div class="field" style="flex:1;min-width:140px"><label style="font-size:11px">搜索课名</label><input id="l_q" placeholder="关键词过滤"></div>
        <div class="field"><label style="font-size:11px">&nbsp;</label><button type="button" class="ghost sm" id="l_all">全选当前结果</button></div>
        <div class="field"><label style="font-size:11px">&nbsp;</label><button type="button" class="ghost sm" id="l_none">清空</button></div>
      </div>
      <div id="langTags" style="max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px;display:flex;flex-direction:column;gap:3px"></div>
    </div>
    <details style="margin-top:10px">
      <summary style="cursor:pointer;font-size:13px;color:var(--blue)">+ 添加其他校区课程（学生跨校区上课时用）</summary>
      <div class="row" style="margin-top:8px">
        <div class="field"><label>校区</label><select id="x_campus"></select></div>
        <div class="field"><label>类别</label><select id="x_cat"></select></div>
        <div class="field"><label>专业</label><select id="x_major"></select></div>
        <div class="field" style="flex:1;min-width:160px"><label>搜索课名</label><input id="x_q" placeholder="关键词过滤"></div>
      </div>
      <div id="x_list" style="max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px;margin-top:8px;display:flex;flex-direction:column;gap:4px"></div>
      <div class="muted" id="x_info" style="font-size:12px;margin-top:6px"></div>
    </details>
    <div class="tip" style="margin:10px 0 0">选定专业后，课表自动含该专业<b>专业课</b>+同类别<b>共通课</b>（+语言课）。可勾选具体课程、跨校区加课，并保存为模板复用。</div>
  </div>
  <div id="cal">
    <div id="printHead"></div>
    <div id="calBody"></div>
    <div id="printBlock" style="display:none"></div>
  </div>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="common.js?v=20261006"></script>
<script>
el('nav').innerHTML = renderNav('timetable.html');
pageRole().then(r=>{ if(r) el('nav').innerHTML = renderNav('timetable.html', r); }).catch(()=>{});
let COURSES=[], EVENTS=[], curView='month', SELECTED_IDS=new Set(), EXTRA_IDS=new Set(), LANG_IDS=new Set(), TEMPLATES=[], MULTI=false, ALL_TERMS=[], SEL_TERMS=new Set(), HOLIDAYS=[];
const DOW=['周日','周一','周二','周三','周四','周五','周六'];

const PALETTE=[
  {bg:'#ddeaf8',fg:'#1a3a6a'},{bg:'#ddf0e0',fg:'#1a4a28'},{bg:'#e8e4f8',fg:'#3a2a7a'},
  {bg:'#faecd8',fg:'#5a3010'},{bg:'#d8f0ea',fg:'#0a4038'},{bg:'#f8e4dc',fg:'#6a2818'},
  {bg:'#e6e2f5',fg:'#40308a'},{bg:'#e0eef0',fg:'#1a5060'},{bg:'#f5e6f0',fg:'#7a2860'},
  {bg:'#eef0da',fg:'#4a5010'},{bg:'#dfe8f5',fg:'#2a3a6a'},{bg:'#ece8e0',fg:'#3a3830'}
];
// 共通课专属色（靛蓝，明显区别于语言课的绿）
const COMMON_COLOR={bg:'#e3e0f7',fg:'#332a78'};
function isCommon(c){ return c && (c.course_type==='共通课' || /共通/.test(c.name||'')); }
let COLORMAP={};
function buildColorMap(){
  COLORMAP={};
  const courseEvents=EVENTS.filter(e=>e.c);   // 排除假期标记（无课程）
  const names=[...new Set(courseEvents.map(e=>e.c.name))];
  names.forEach((n,i)=>{ COLORMAP[n]=PALETTE[i%PALETTE.length]; });
  // 共通课统一用专属色，避免和语言课撞
  courseEvents.map(e=>e.c).forEach(c=>{ if(isCommon(c)) COLORMAP[c.name]=COMMON_COLOR; });
}
function styleOf(c){
  const name=(c&&typeof c==='object')?c.name:c;
  const p=COLORMAP[name]||PALETTE[PALETTE.length-1];
  return 'background:'+p.bg+';color:'+p.fg;
}
function legendHtml(){
  const names=[...new Set(EVENTS.filter(e=>e.c).map(e=>e.c.name))];
  if(!names.length) return '';
  return '<div class="legend">'+names.map(n=>'<div class="lg"><i style="'+styleOf(n)+'"></i>'+esc(n)+'</div>').join('')+'</div>';
}
function fmtMD(iso){ const [y,m,d]=iso.split('-').map(Number); return m+'/'+d; }
function dowIdx(iso){ return new Date(iso+'T00:00:00').getDay(); } // 0=日
function dowClass(iso){ const w=dowIdx(iso); return w===6?'sat':w===0?'sun':''; }
function mondayOf(iso){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

async function boot(){
  fillSelect(el('cat'), CATEGORIES.filter(c=>c!=='语言'));
  fillSelect(el('campus'), ['高马','市谷','线上'], v=>v, v=>v, '全部校区');
  COURSES = (await sbGet('sched_courses','select=*')).filter(c=>!c.deleted_at);
  try{ HOLIDAYS = await sbGet('sched_holidays','select=*&order=start_date'); }catch(e){ HOLIDAYS=[]; }
  ALL_TERMS=[...new Set(COURSES.map(c=>c.term).filter(Boolean))].sort((a,b)=>termSortKey(a)-termSortKey(b));
  renderTermTags();
  // 跨校区控件
  fillSelect(el('x_campus'), ['高马','市谷','线上'], v=>v, v=>v, '选择校区');
  fillSelect(el('x_cat'), CATEGORIES, v=>v, v=>v, '全部类别');
  el('cat').onchange=()=>{ fillMajors(); SELECTED_IDS.clear(); refreshCourseTags(); };
  el('major').onchange=()=>{ SELECTED_IDS.clear(); refreshCourseTags(); };
  el('lang').onchange=()=>{ refreshLangTags(); gen(); };
  el('campus').onchange=()=>{ SELECTED_IDS.clear(); LANG_IDS.clear(); refreshCourseTags(); };
  // 专业课列表筛选
  el('c_kind').onchange=refreshCourseTags;
  el('c_q').oninput=refreshCourseTags;
  el('c_all').onclick=()=>{ (window._courseFiltered||[]).forEach(id=>SELECTED_IDS.add(id)); refreshCourseTags(); gen(); };
  el('c_none').onclick=()=>{ SELECTED_IDS.clear(); refreshCourseTags(); gen(); };
  // 语言课列表筛选
  el('l_type').onchange=refreshLangTags;
  el('l_kind').onchange=refreshLangTags;
  el('l_q').oninput=refreshLangTags;
  el('l_all').onclick=()=>{ (window._langFiltered||[]).forEach(id=>LANG_IDS.add(id)); refreshLangTags(); gen(); };
  el('l_none').onclick=()=>{ LANG_IDS.clear(); refreshLangTags(); gen(); };
  ['lang','campus'].forEach(id=>el(id).onchange=refreshCourseTags);
  el('x_campus').onchange=()=>{ fillXMajors(); refreshExtraList(); };
  el('x_cat').onchange=()=>{ fillXMajors(); refreshExtraList(); };
  el('x_major').onchange=refreshExtraList;
  el('x_q').oninput=refreshExtraList;
  el('go').onclick=gen; el('print').onclick=doPrint;
  if(el('ttLimit')) el('ttLimit').onchange=()=>{ document.querySelectorAll('.ttRange').forEach(x=>x.classList.toggle('hidden', el('ttLimit').value!=='1')); };
  el('tplSave').onclick=saveTpl; el('tplDel').onclick=delTpl; el('tpl').onchange=loadTpl;
  await fillTplSelect();
  fillMajors(); fillXMajors(); refreshCourseTags(); refreshExtraList();
  // 分享链接 ?t=slug → 只读展示模式
  const slug=new URLSearchParams(location.search).get('t');
  if(slug){
    const t=TEMPLATES.find(x=>x.slug===slug);
    if(t){ applyTemplate(t); enterShareMode(t); return; }
    else { el('cal').innerHTML='<div style="padding:20px">未找到该课表链接（后缀：'+esc(slug)+'）。</div>'; return; }
  }
  gen();
}
/* 只读展示模式：隐藏筛选栏与导航，隐藏讲师名 */
let SHARE=false, SHARE_TERMS=[], SHARE_VIEW_TERM='';
function enterShareMode(t){
  SHARE=true;
  SHARE_TERMS=[...SEL_TERMS]; SHARE_VIEW_TERM='';
  document.querySelector('.card.filters').style.display='none';
  const nav=document.getElementById('nav'); if(nav) nav.style.display='none';
  gen();
}
function gen(){
  let list=selectedCourses();
  if(SHARE && SHARE_VIEW_TERM) list=list.filter(c=>c.term===SHARE_VIEW_TERM);
  EVENTS=[];
  // 合并组按顺序轮流出现；非合并课正常展开
  const groups={}, singles=[];
  list.forEach(c=>{ if(c.merge_group){ (groups[c.merge_group]=groups[c.merge_group]||[]).push(c); } else singles.push(c); });
  singles.forEach(c=>EVENTS.push(...expand(c)));
  Object.values(groups).forEach(gc=>EVENTS.push(...expandMergedGroup(gc)));
  EVENTS.push(...holidayMarkers(list));   // 全局假期一天一个横幅
  // 限制日期范围
  if(el('ttLimit') && el('ttLimit').value==='1'){
    const s=el('ttStart').value, e=el('ttEnd').value;
    if(s) EVENTS=EVENTS.filter(ev=>ev.date>=s);

/* 主校区候选（未按课程多选过滤） */
function baseCourses(){
  const cat=el('cat').value, major=el('major').value,
        withLang=el('lang').value==='1', campus=el('campus').value;
  return COURSES.filter(c=>{
    if(SEL_TERMS.size && !SEL_TERMS.has(c.term)) return false;

    if(campus && c.campus!==campus) return false;

function holidayOf(dateStr){
  for(const h of HOLIDAYS){ const s=h.start_date, e=h.end_date||h.start_date;
    if(s && dateStr>=s && dateStr<=e) return h; }
  return null;
}
function skipReasonMap(c){
  const m={}; (c.skip_reasons||'').split(';').forEach(p=>{ const i=p.indexOf('='); if(i>0) m[p.slice(0,i).trim()]=p.slice(i+1); }); return m;
}
function expand(c){
  const out=[];
  if(!c.start_date||!c.end_date||!c.weekdays||!c.start_time) return out;
  const wds=parseWeekdaysSched(c.weekdays);
  const skip=new Set((c.skip_dates||'').split(',').map(s=>s.trim()).filter(Boolean));
  const except=new Set((c.holiday_except||'').split(',').map(s=>s.trim()).filter(Boolean));
  const rmap=skipReasonMap(c);
  let d=c.start_date, guard=0;
  while(d<=c.end_date && guard++<400){
    if(wds.includes(weekdayOf(d))){
      const hol=holidayOf(d);
      if(hol && !except.has(d)){ /* 全局假期且未豁免：不显示，由横幅统一标 */ }
      else if(skip.has(d)) out.push({date:d, s:c.start_time, e:c.end_time, c, off:true, skipReason:(rmap[d]||'')});   // 个别休讲：保留课名+下划线
      else out.push({date:d, s:c.start_time, e:c.end_time, c});   // 正常（含豁免后照常上课）
    }
    d=addDays(d,1);
  }
  return out;
}
/* 合并组：同周几/时段，按 merge_order 在连续上课日轮流出现（第1个上课日=order1，第2个=order2…循环） */
function expandMergedGroup(gc){
  const out=[];
  const grp=gc.slice().sort((a,b)=>(a.merge_order||99)-(b.merge_order||99));
  const ref=grp[0];
  if(!ref.weekdays||!ref.start_time) return out;
  const wds=parseWeekdaysSched(ref.weekdays);
  const starts=grp.map(c=>c.start_date).filter(Boolean).sort();
  const ends=grp.map(c=>c.end_date).filter(Boolean).sort();
  if(!starts.length||!ends.length) return out;
  const lo=starts[0], hi=ends[ends.length-1];
  let d=lo, guard=0, idx=0;
  while(d<=hi && guard++<500){
    if(wds.includes(weekdayOf(d))){
      const cur=grp[idx % grp.length];   // 轮到哪门课
      idx++;
      const inRange=(!cur.start_date||d>=cur.start_date)&&(!cur.end_date||d<=cur.end_date);
      if(inRange){
        const skip=new Set((cur.skip_dates||'').split(',').map(s=>s.trim()).filter(Boolean));
        const hol=holidayOf(d);
        const except=new Set((cur.holiday_except||'').split(',').map(s=>s.trim()).filter(Boolean));
        if(hol && !except.has(d)){ /* 假期由横幅统一标，课不显示 */ }
        else if(skip.has(d)){ const rmap=skipReasonMap(cur); out.push({date:d, s:cur.start_time, e:cur.end_time, c:cur, off:true, skipReason:(rmap[d]||'')}); }
        else out.push({date:d, s:cur.start_time, e:cur.end_time, c:cur});
      }
    }
    d=addDays(d,1);
  }
  return out;
}
/* 全局假期标记：一天一个（含没课的日子），范围取所选课程的整体日期跨度 */
function holidayMarkers(courses){
  if(!HOLIDAYS.length) return [];
  const starts=courses.map(c=>c.start_date).filter(Boolean).sort();
  const ends=courses.map(c=>c.end_date).filter(Boolean).sort();
  if(!starts.length||!ends.length) return [];
  const lo=starts[0], hi=ends[ends.length-1];
  // 已有真实上课（含被豁免照常上的课）的日期：这些日子不再显示假期横幅
  const classDates=new Set(EVENTS.filter(ev=>ev.c && !ev.off).map(ev=>ev.date));
  const seen=new Set(), marks=[];
  HOLIDAYS.forEach(h=>{
    let d=h.start_date, e=h.end_date||h.start_date, guard=0;
    while(d && d<=e && guard++<400){
      if(d>=lo && d<=hi && !seen.has(d) && !classDates.has(d)){ seen.add(d); marks.push({date:d, holiday:h, isHoliday:true}); }
      d=addDays(d,1);
    }
  });
  return marks;
}
function holColor(h){ return h && h.color==='green' ? {bg:'#e2f2e6',fg:'#1f6b3a'} : {bg:'#fbe3e0',fg:'#a5281c'}; }
function evOffHtml(e, mini){
  if(e.isHoliday || e.holiday){ const c=holColor(e.holiday);
    return '<div class="ev'+(mini?' mini':'')+'" style="background:'+c.bg+';color:'+c.fg+';font-weight:600;text-align:center">'+esc(e.holiday.label||'放假')+'</div>';
  }
  return '<div class="ev'+(mini?' mini':'')+' off" style="text-decoration:line-through">'+esc(e.c.name)+'<small style="text-decoration:none">休讲'+(e.skipReason?('· '+esc(e.skipReason)):'')+'</small></div>';
}
function campusTag(c){ return c.mode==='线上'?'线上':(c.campus||''); }
async function doPrint(){

  const subMeta = SEL_TERMS.size>1 ? ('含 '+[...SEL_TERMS].join('、')) : '唯新教育';
  const coverText = (el('pdfCover')?el('pdfCover').value:'').trim();
  // 封面课程颜色图例（合并课用合并名去重）
  const legendSeen=new Set(), legendItems=[];
  EVENTS.filter(e=>e.c).forEach(e=>{ const nm=e.c.merge_name||e.c.name; if(legendSeen.has(nm))return; legendSeen.add(nm);
    legendItems.push('<span class="cleg"><i style="'+styleOf(e.c)+'"></i>'+esc(nm)+'</span>'); });
  const coverLegend = (legendItems.length && el('ttLegend') && el('ttLegend').value==='1') ? ('<div class="cleg-wrap">'+legendItems.join('')+'</div>') : '';
  const headerText = (el('pdfHeader')?el('pdfHeader').value:'').trim();
  const coverLines = coverText? coverText.split(/\n/).filter(x=>x.trim()) : [];

  // 图片转 base64（内嵌，打印一定显示）
  const base = location.origin + location.pathname.replace(/[^/]*$/,'');
  async function toDataURL(url){
    try{ const r=await fetch(url); const b=await r.blob();
      return await new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.readAsDataURL(b); });
    }catch(e){ return ''; }
  }
  // 获取值，如果找不到元素则默认使用 '1'
const coverVal = el('ttCover')?.value || '1';

// 映射对应的文件名
const coverMap = {
  '1': 'back.jpg',
  '2': 'back2.jpg',
  '3': 'back3.jpg',
  '4': 'back4.jpg'
};

// 得到最终的文件名（和以前一样的字符串）
const coverFile = coverMap[coverVal] || 'back.jpg';
  const [bgData, logoData] = await Promise.all([toDataURL(base+coverFile), toDataURL(base+'logo.png')]);

  // 月历：每月一块，块内 break-inside avoid，块间分页
  // 月历：每月一块，见 buildMonthPaged

  const css = `

    .cover .cin-bottom{ position:absolute; left:0; right:0; top:50%; padding:7mm 34mm 0; text-align:center; }

    .cover .cleg{ display:inline-flex; align-items:center; gap:5px; font-size:10.5px; color:#5a5650; }

    .cover .csub{ font-size:13px; color:#6a655c; margin:0 0 8mm; letter-spacing:.05em; }
    .cover .cnotes{ font-size:11px; color:#5a5650; line-height:2.0; text-align:left; max-width:140mm; margin:0 auto; }
    .cover .cnotes div{ margin-bottom:2mm; padding-left:1.1em; text-indent:-1.1em; }
    .phead{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; border-bottom:1px solid #ddd6c8; padding-bottom:5px; margin-bottom:10px; }
    .phead{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
    .phead .ph-title{ font-family:'Noto Serif SC',serif; font-size:14px; font-weight:600; color:#2b2822; white-space:normal; word-break:break-word; flex:1; min-width:0; }
    .phead .ph-note{ font-size:11px; color:#6a655c; white-space:pre-wrap; text-align:right; }
    .sheet{ display:flex; flex-direction:column; }
    .page-legend{ display:flex; flex-wrap:wrap; gap:4px 12px; margin:0 0 8px; padding-bottom:6px; border-bottom:1px dashed #e0dccf; }
    .page-legend .cleg{ display:inline-flex; align-items:center; gap:5px; font-size:10px; color:#5a5650; }
    .page-legend .cleg i{ width:9px; height:9px; border-radius:2px; display:inline-block; }
    .pfoot{ margin-top:auto; padding-top:6px; text-align:center; font-size:10px; color:#9a958c; border-top:1px solid #ece7db; }
    .mblock{ break-inside:avoid; margin-bottom:6mm; }
    .mtitle{ font-family:'Noto Serif SC',serif; font-size:15px; margin:0 0 6px; color:#2b2822; }
    table.mg{ width:100%; border-collapse:collapse; table-layout:fixed; }
    table.mg th{ background:#f3efe6; font-size:10px; font-weight:600; padding:4px 2px; border:1px solid #e5ded0; color:#6a655c; }
    table.mg th.sat{ color:#3a6ea5; } table.mg th.sun{ color:#c0504d; }
    table.mg td{ border:1px solid #ece7db; vertical-align:top; height:26mm; width:14.28%; padding:2px 3px; background:#fff; word-break:break-word; overflow-wrap:anywhere; }
    table.mg td .dn{ font-size:10px; color:#9a958c; font-weight:600; }
    table.mg td.sat .dn{ color:#3a6ea5; } table.mg td.sun .dn{ color:#c0504d; }
    .ev{ border-radius:3px; padding:2px 4px; font-size:9px; line-height:1.3; margin-top:2px; word-break:break-word; overflow-wrap:anywhere; }
    .ev small{ display:block; font-size:8px; opacity:.72; }
    .ev.off{ background:#eee; color:#999; text-decoration:line-through; }
    .noprint{ position:fixed; top:0; left:0; right:0; background:#fff3cd; color:#7a5c00; font-size:13px; padding:8px 14px; text-align:center; z-index:99; }
    @media print{ .noprint{ display:none; } }
  `;
  const coverPage =
    '<div class="page cover">'+
      (bgData?'<img class="bg" src="'+bgData+'">':'')+
      '<div class="cin">'+
        '<div class="cin-top">'+
          (logoData?'<img class="clogo" src="'+logoData+'">':'')+
          '<div class="ctitle">'+esc(coverTitle)+'</div>'+
        '</div>'+
        '<div class="cin-bottom">'+
          '<div class="csub">'+esc(subMeta)+'</div>'+
          (coverLines.length?('<div class="cnotes">'+coverLines.map(l=>'<div>'+esc(l)+'</div>').join('')+'</div>'):'')+
          coverLegend+
        '</div>'+
      '</div>'+
    '</div>';
  const headTitle = customTitle || [campus, firstTerm, tplName, '课程日历'].filter(Boolean).join(' ');
  function pageHead(){
    return '<div class="phead"><div class="ph-title">'+esc(headTitle)+'</div>'+
      (headerText?'<div class="ph-note">'+esc(headerText)+'</div>':'')+'</div>';
  }
  // 每月一页，页眉+页码
  const monthBlocks = buildMonthPaged();   // 数组，每项是一个月的表格HTML
  const totalPages = 1 + monthBlocks.length;   // 封面 + 各月
  let bodyPages = coverPage;
  monthBlocks.forEach((mhtml, i)=>{
    const pageNo = i+2;   // 封面是第1页
    bodyPages += '<div class="page sheet">'+pageHead()+mhtml+
      '<div class="pfoot">第 '+pageNo+' / '+totalPages+' 页</div></div>';
  });
  const safeTitle = coverTitle.replace(/[\\/:*?"<>|]/g,'_');
  const doc =
    '<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>'+esc(coverTitle)+'</title>'+
    '<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">'+
    '<style>'+css+'</style></head><body>'+
    '<div class="topbar" style="background:#f4efe4;border-bottom:1px solid #e0d8c4;padding:14px 20px;text-align:center;position:sticky;top:0;z-index:99">'+
      '<button id="dlpdf" style="padding:10px 26px;border:none;border-radius:8px;background:#2c6b4f;color:#fff;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 2px 6px rgba(44,107,79,.3)">⬇ 下载 PDF（无空白页）</button>'+

    '</div>'+
    '<div style="height:16px"></div>'+
    bodyPages +
    '<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" async><\/script>'+

    '<script>'+
    'document.getElementById("dlpdf").onclick=async function(){'+
    ' var btn=this;'+
    ' if(typeof html2canvas==="undefined"||!window.jspdf){ alert("PDF 组件还在加载或被网络拦截，请稍等几秒重试；若一直不行请改用 Ctrl/⌘+P 打印。"); return; }'+
    ' btn.disabled=true; btn.textContent="生成中…";'+
    ' try{'+
    '  var pages=document.querySelectorAll(".page"); var jsPDF=window.jspdf.jsPDF; var pdf=null;'+
    '  for(var i=0;i<pages.length;i++){'+
    '   var cv=await html2canvas(pages[i],{scale:2,useCORS:true,backgroundColor:"#ffffff"});'+
    '   var w=297, h=Math.round(cv.height*w/cv.width*100)/100; var ori=(w>=h)?"l":"p";'+   // 页面物理尺寸正常(297mm宽)，方向跟形状走
    '   if(!pdf){ pdf=new jsPDF({orientation:ori,unit:"mm",format:[w,h]}); } else { pdf.addPage([w,h],ori); }'+
    '   pdf.addImage(cv.toDataURL("image/jpeg",0.94),"JPEG",0,0,w,h);'+
    '  }'+
    '  pdf.save('+JSON.stringify(safeTitle+'.pdf')+');'+
    '  btn.textContent="✓ 已下载"; setTimeout(function(){btn.disabled=false;btn.textContent="⬇ 下载 PDF（无空白页）";},2000);'+
    ' }catch(e){ alert("生成失败："+e.message); btn.disabled=false; btn.textContent="⬇ 下载 PDF（无空白页）"; }'+
    '};'+
    '<\/script>'+
    '</body></html>';
  const w=window.open('','_blank');
  if(!w){ toast('浏览器拦截了新窗口，请允许弹窗后重试', false); return; }
  w.document.write(doc); w.document.close();
}
/* 月历分页版：每月一块，块内不断开 */
function buildMonthPaged(){
  if(!EVENTS.length) return ['<div style="color:#999">该条件下暂无课程</div>'];
  const byDate={}; EVENTS.forEach(e=>{ (byDate[e.date]=byDate[e.date]||[]).push(e); });
  const months=[...new Set(EVENTS.map(e=>e.date.slice(0,7)))].sort();
  const blocks=[];
  months.forEach(mon=>{
    const [y,m]=mon.split('-').map(Number);
    const startCol=(new Date(y,m-1,1).getDay()+6)%7;
    const days=new Date(y,m,0).getDate();
    let html='<div class="mblock"><div class="mtitle">'+y+'年 '+m+'月</div><table class="mg"><thead><tr>';
    ['周一','周二','周三','周四','周五','周六','周日'].forEach((d,i)=>{ const cls=i===5?'sat':i===6?'sun':''; html+='<th class="'+cls+'">'+d+'</th>'; });
    html+='</tr></thead><tbody><tr>';
    const cells=[]; for(let i=0;i<startCol;i++) cells.push(null);
    for(let d=1;d<=days;d++) cells.push(d);
    while(cells.length%7) cells.push(null);
    cells.forEach((d,idx)=>{
      if(idx>0 && idx%7===0) html+='</tr><tr>';
      if(d===null){ html+='<td></td>'; return; }
      const ds=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      const w=new Date(y,m-1,d).getDay(); const dc=w===6?'sat':w===0?'sun':'';
      const evs=(byDate[ds]||[]).sort((a,b)=>((a.isHoliday?"":a.s||"")).localeCompare(b.isHoliday?"":b.s||""));
      html+='<td class="'+dc+'"><div class="dn">'+d+'</div>'+
        evs.map(e=>(e.off||e.isHoliday)?evOffHtml(e,false)
          :('<div class="ev" style="'+styleOf(e.c)+'">'+e.s+'–'+e.e+' '+esc(e.c.name)+(MULTI?'<small>'+esc(campusTag(e.c))+'</small>':'')+'</div>')).join('')+'</td>';
    });
    html+='</tr></tbody></table></div>';
    blocks.push(html);
  });
  return blocks;
}
function render(){
  const box=el('calBody');
  const title = (el('major').value||el('cat').value||'全部')+' 课程安排';
  let h='<div class="chead"><div><h2>'+esc(title)+'</h2><div class="sub">唯新教育 · '+esc(termLabel())+'</div></div></div>';
  // 分享模式：顶部给期切换小标签（在所选几期之间切）
  if(SHARE && SHARE_TERMS.length>1){
    h+='<div class="vt" style="margin-bottom:10px"><button class="'+(SHARE_VIEW_TERM===''?'on':'')+'" data-st="">全部</button>'+
       SHARE_TERMS.map(t=>'<button class="'+(SHARE_VIEW_TERM===t?'on':'')+'" data-st="'+esc(t)+'">'+esc(t)+'</button>').join('')+'</div>';
  }
  h+= legendHtml();
  h+='<div class="vt"><button class="'+(curView==='month'?'on':'')+'" data-v="month">月历</button>'+
     '<button class="'+(curView==='week'?'on':'')+'" data-v="week">周历</button>'+
     '<button class="'+(curView==='sum'?'on':'')+'" data-v="sum">课程详解</button></div>';
  h+= curView==='month' ? buildMonth() : curView==='week' ? buildCal() : buildSummary();
  box.innerHTML=h;
  box.querySelectorAll('.vt button[data-v]').forEach(b=>b.onclick=()=>{ curView=b.dataset.v; render(); });
  box.querySelectorAll('.vt button[data-st]').forEach(b=>b.onclick=()=>{ SHARE_VIEW_TERM=b.dataset.st; gen(); });
}
function buildMonth(){
  if(!EVENTS.length) return '<div class="muted" style="font-family:inherit">该条件下暂无课程</div>';
  const byDate={}; EVENTS.forEach(e=>{ (byDate[e.date]=byDate[e.date]||[]).push(e); });
  const months=[...new Set(EVENTS.map(e=>e.date.slice(0,7)))].sort();
  let html='';
  months.forEach(mon=>{
    const [y,m]=mon.split('-').map(Number);
    const startCol=(new Date(y,m-1,1).getDay()+6)%7;   // 0=周一
    const days=new Date(y,m,0).getDate();
    html+='<div class="wk"><div class="wkl">'+y+'年 '+m+'月</div>';
    html+='<div class="grid" style="grid-template-columns:repeat(7,minmax(0,1fr))">';
    ['周一','周二','周三','周四','周五','周六','周日'].forEach((d,i)=>{
      const cls=i===5?'sat':i===6?'sun':'';
      html+='<div class="hcell '+cls+'"><span class="dow">'+d+'</span></div>'; });
    const cells=[]; for(let i=0;i<startCol;i++) cells.push(null);
    for(let d=1;d<=days;d++) cells.push(d);
    while(cells.length%7) cells.push(null);
    cells.forEach(d=>{
      if(d===null){ html+='<div class="mcell empty"></div>'; return; }
      const ds=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      const w=new Date(y,m-1,d).getDay(); const dc=w===6?'sat':w===0?'sun':'';
      const evs=(byDate[ds]||[]).sort((a,b)=>((a.isHoliday?"":a.s||"")).localeCompare(b.isHoliday?"":b.s||""));
      html+='<div class="mcell"><div class="md '+dc+'">'+d+'</div>'+
        evs.map(e=>(e.off||e.isHoliday)?evOffHtml(e,true):`<div class="ev mini" style="${styleOf(e.c)}">${e.s}–${e.e} ${esc(e.c.name)}<small>${SHARE?'':esc(e.c.teacher||'')}${MULTI?' · '+esc(campusTag(e.c)):''}</small></div>`).join('')+'</div>';
    });
    html+='</div></div>';
  });
  return html;
}
function buildCal(){
  if(!EVENTS.length) return '<div class="muted" style="font-family:inherit">该条件下暂无课程</div>';
  // 全局统一时段行（按开始时间排序）
  const slots=[...new Set(EVENTS.filter(e=>e.c).map(e=>e.s+'–'+e.e))].sort((a,b)=>a.localeCompare(b));
  // 分周
  const weeks={};
  EVENTS.forEach(e=>{ const mon=mondayOf(e.date); (weeks[mon]=weeks[mon]||[]).push(e); });
  const monKeys=Object.keys(weeks).sort();
  let html='';
  monKeys.forEach((mon,wi)=>{
    const wev=weeks[mon];
    const dates=[...new Set(wev.map(e=>e.date))].sort();
    const cols=dates.length;
    const map={}; wev.forEach(e=>{ const k=e.date+'|'+e.s+'–'+e.e; (map[k]=map[k]||[]).push(e); });
    const gridCols='84px repeat('+cols+',minmax(0,1fr))';
    const gridRows='auto repeat('+slots.length+',auto)';
    html+='<div class="wk"><div class="wkl">第 '+(wi+1)+' 周</div>';
    html+='<div class="grid" style="grid-template-columns:'+gridCols+';grid-template-rows:'+gridRows+'">';
    // 表头空角
    html+='<div class="tcell" style="border-top:none;border-bottom:1px solid var(--border)"></div>';
    dates.forEach(ds=>{ const dc=dowClass(ds);
      html+='<div class="hcell '+dc+'"><span class="dow">'+DOW[dowIdx(ds)]+'</span><span class="dt">'+fmtMD(ds)+'</span></div>'; });
    // 每个时段一行
    slots.forEach(sl=>{
      const [ss,ee]=sl.split('–');
      html+='<div class="tcell">'+ss+'–\n'+ee+'</div>';
      dates.forEach(ds=>{
        const evs=map[ds+'|'+sl]||[];
        html+='<div class="ecell">'+evs.map(e=>(e.off||e.isHoliday)?evOffHtml(e,false):`<div class="ev" style="${styleOf(e.c)}">${esc(e.c.name)}<small>${e.s}–${e.e} ${SHARE?'':esc(e.c.teacher||'')}${MULTI?' · '+esc(campusTag(e.c)):''}</small></div>`).join('')+'</div>';
      });
    });
    html+='</div></div>';
  });
  return html;
}
function buildSummary(){
  if(!EVENTS.length) return '<div class="muted" style="font-family:inherit">该条件下暂无课程</div>';
  // 按课程分组
  const groups={};
  EVENTS.filter(e=>e.c).forEach(e=>{ (groups[e.c.id]=groups[e.c.id]||{c:e.c,items:[]}).items.push(e); });
  const keys=Object.keys(groups).sort((a,b)=>{
    const da=groups[a].items[0].date, db=groups[b].items[0].date; return da.localeCompare(db); });
  let h='<div style="display:flex;flex-direction:column;gap:1rem">';
  keys.forEach(k=>{
    const {c,items}=groups[k]; items.sort((a,b)=>a.date.localeCompare(b.date));
    h+='<div class="grid course-block" style="display:block">';
    h+='<div style="padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:10px">'+
       `<span class="ev" style="${styleOf(c)};padding:2px 10px">${esc(c.name)}</span>`+
       `<span style="font-size:10px;color:var(--tm)">${items.length} 课次${SHARE?'':' · '+esc(c.teacher||'')} · ${esc(campusTag(c))} · ${esc(c.mode)}</span>`+
       (c.meeting_link?` <a href="${esc(c.meeting_link)}" target="_blank" style="font-size:11px;color:#2c7a4a;margin-left:6px">🎦 进入会议${c.meeting_id?('（'+esc(c.meeting_id)+'）'):''}</a>`:'')+`</div>`;
    h+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">';
    items.forEach(e=>{ const dc=dowClass(e.date);
      h+='<div style="padding:8px 16px;border-right:1px solid var(--border-light);border-bottom:1px solid var(--border-light)'+(e.off?';opacity:.5':'')+'">'+
         `<div style="display:flex;gap:8px;align-items:center"><span style="font-size:12px;font-weight:500">${fmtMD(e.date)}</span>`+
         `<span style="font-size:11px" class="${dc==='sat'?'':''}">${DOW[dowIdx(e.date)]}</span></div>`+
         `<div style="font-size:10px;color:var(--tm)">${e.off?'休讲/放假':(e.s+'–'+e.e)}</div></div>`; });
    h+='</div></div>';
  });
  h+='</div>'; return h;
}
