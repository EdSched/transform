<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>腾讯会议账号占用 · 唯新</title>
<link rel="stylesheet" href="style.css">
<style>
  .chip{display:inline-block;cursor:pointer;user-select:none;border:1px solid var(--line);border-radius:14px;padding:3px 12px;font-size:12px;margin:2px;color:#666}
  .chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  .pickrow{cursor:pointer;padding:6px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:12px}
  .pickrow.on{border-color:var(--blue);background:#eef4ff}
  .acc-free{cursor:pointer;border:1px solid #b7e0c4;background:#eafaf0;color:#1f7a4d;border-radius:8px;padding:6px 12px;font-size:13px;margin:3px;display:inline-block}
  .acc-free.on{background:#1f7a4d;color:#fff;border-color:#1f7a4d}
</style>
</head><body>
<div id="nav"></div>
<div class="wrap">
  <div style="margin:2px 0 12px"><span class="vt2"><button class="ghost sm on" id="topTabBind">绑定账号</button><button class="ghost sm" id="topTabLink">链接设定</button></span></div>

  <div id="bindPane">
  <div class="tip">给<b>没排账号的线上课</b>或<b>临时用途</b>找一个空闲的腾讯账号并预留/占用。选好对象→自动筛出能用的账号→选一个→预留（先占住）或正式占用。</div>

  <!-- 一条龙：选对象 → 筛空闲账号 → 预留/占用 -->
  <!-- 区块1：绑定账号 -->
  <div class="card" id="sec1card">
    <div style="display:flex;gap:16px;flex-wrap:wrap">
      <!-- 左：对象与条件 -->
      <div style="flex:1;min-width:320px">
        <div class="row">
          <div class="field"><label>绑定对象</label><select id="r_bind"><option value="course">线上课</option><option value="temp">临时使用</option></select></div>
          <div class="field" id="r_courseWrap"><label>选未排线上课</label><select id="r_course"></select></div>
          <div class="field hidden" id="r_titleWrap"><label>用途/名称</label><input id="r_title" placeholder="如 XX说明会"></div>
        </div>
        <div class="row">
          <div class="field"><label>周期</label><select id="r_rec"><option value="weekly">每周重复</option><option value="once">单次</option></select></div>
          <div class="field hidden" id="r_dateWrap"><label>日期</label><input type="date" id="r_date"></div>
          <div class="field" id="r_sdWrap"><label>起始日</label><input type="date" id="r_sd"></div>
          <div class="field" id="r_edWrap"><label>结束日</label><input type="date" id="r_ed"></div>
          <div class="field"><label>开始</label><select id="r_st"></select></div>
          <div class="field"><label>结束</label><select id="r_et"></select></div>
        </div>
        <div id="r_wdWrap"><label style="font-size:12px;color:#555">周几（可多选）</label><div id="r_wd" style="margin-top:4px">
          <span class="chip" data-d="1">周一</span><span class="chip" data-d="2">周二</span><span class="chip" data-d="3">周三</span><span class="chip" data-d="4">周四</span><span class="chip" data-d="5">周五</span><span class="chip" data-d="6">周六</span><span class="chip" data-d="7">周日</span>
        </div></div>
      </div>
      <!-- 右：未排线上课点选 -->
      <div style="width:300px" id="r_pickPane">
        <label style="font-size:12px;color:#555">未排线上课（点选带入）</label>
        <div id="r_pickList" style="margin-top:4px;max-height:220px;overflow:auto"></div>
      </div>
    </div>
    <div style="margin-top:10px"><button id="r_find">筛出能用的账号</button></div>
    <div id="r_accBox" style="margin-top:10px"></div>
    <div id="r_actBox" style="margin-top:10px"></div>
    <div id="r_warn" style="margin-top:6px"></div>
  </div>

  </div><!-- /bindPane -->

  <div id="linkPane" class="hidden">
  <!-- 区块2：链接设定 -->
  <div class="card" id="sec2card">
    <div id="sec2body"></div>
  </div>
  </div><!-- /linkPane -->

  <!-- 区块3：账号占用一览（管理者可见） -->
  <div class="card" id="sec3card">
    <div style="display:flex;align-items:center;gap:10px">
      <h3 style="margin:2px 0">管理账号一览</h3>
      <span class="muted" id="v_count" style="font-size:12px"></span>
      <button class="ghost sm" id="v_toggle" style="margin-left:auto">展开</button>
    </div>
    <div id="v_wrap" class="hidden">
      <div class="row" style="margin-top:8px">
        <div class="field"><label>账号</label><select id="v_acc"><option value="">全部账号</option></select></div>
        <div class="field"><label>状态</label><select id="v_status"><option value="">全部</option><option value="reserved">预留</option><option value="confirmed">正式</option></select></div>
      </div>
      <div id="v_box"></div>
    </div>
  </div>
</div>
<script src="common.js"></script>
<script>
el('nav').innerHTML = renderNav('meeting.html');
let CANARRANGE = new URLSearchParams(location.search).get('canarrange')==='1';
getRoleByCode(currentCode()).then(r=>{ if(r){ window.ROLE=r; el('nav').innerHTML = renderNav('meeting.html', r);
  if(permSet(r).has('meeting_arrange')||permSet(r).has('manage')){ CANARRANGE=true; applyPerm(); } } }).catch(()=>{});
let ROOMS=[], ACCOUNTS=[], BOOKINGS=[], COURSES=[], MTEMPLATES=[], WDSEL=new Set(), PICKED=null;
async function boot(){
  fillSelect(el('r_st'), SLOTS); fillSelect(el('r_et'), SLOTS);
  const t0=todayStr(); el('r_sd').value=t0; el('r_ed').value=addDays(t0,90); el('r_date').value=t0;
  if(SLOTS.includes('18:00')){ el('r_st').value='18:00'; el('r_et').value='21:00'; }
  ROOMS=await sbGet('sched_rooms','select=*');
  ACCOUNTS=await sbGet('sched_meeting_accounts','select=*&active=eq.true');
  BOOKINGS=await sbGet('sched_bookings','select=*');
  COURSES=(await sbGet('sched_courses','select=*')).filter(c=>!c.deleted_at);
  try{ MTEMPLATES=await sbGet('sched_meeting_templates','select=*&order=created_at.desc'); }catch(e){ MTEMPLATES=[]; }
  window.SKIPMAP={}; COURSES.forEach(c=>{ if(c.skip_dates) window.SKIPMAP[c.id]=new Set(c.skip_dates.split(',').map(x=>x.trim())); });
  refreshCourseDropdown();
  fillSelect(el('v_acc'), accSorted(), a=>a.id, a=>acctName(a), '全部账号');
  el('r_wd').querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{ const d=ch.dataset.d; WDSEL.has(d)?WDSEL.delete(d):WDSEL.add(d); ch.classList.toggle('on'); });
  el('r_bind').onchange=syncBind; el('r_rec').onchange=syncRec;
  el('r_course').onchange=()=>{ prefillFromCourse(el('r_course').value); };
  el('r_find').onclick=findAccounts;
  ['v_acc','v_status'].forEach(id=>el(id).onchange=renderOverview);
  el('v_toggle').onclick=()=>{ const w=el('v_wrap'); const open=!w.classList.contains('hidden');
    w.classList.toggle('hidden'); el('v_toggle').textContent=open?'展开':'收起'; if(!open) renderOverview(); };
  el('topTabBind').onclick=()=>{ el('topTabBind').classList.add('on'); el('topTabLink').classList.remove('on'); el('bindPane').classList.remove('hidden'); el('linkPane').classList.add('hidden'); };
  el('topTabLink').onclick=()=>{ el('topTabLink').classList.add('on'); el('topTabBind').classList.remove('on'); el('linkPane').classList.remove('hidden'); el('bindPane').classList.add('hidden'); };
  syncBind(); syncRec(); renderPickList(); renderOverview();
  applyPerm();
}
function accSorted(){ return ACCOUNTS.slice().sort((a,b)=>(a.kind==='固定'?0:1)-(b.kind==='固定'?0:1)||(a.name||'').localeCompare(b.name||'')); }
function acctName(a){ return a.name + (a.note?('（'+a.note+'）'):''); }
function courseLabel(c){ return (c.term?c.term+' ':'')+(c.name||'')+'（'+weekdaysLabel(c.weekdays)+' '+(c.start_time||'')+'-'+(c.end_time||'')+'）'; }
function pendingOnlineCourses(){
  return COURSES.filter(c=>{
    const online=c.mode==='线上'||c.campus==='线上'; if(!online) return false;
    const bs=BOOKINGS.filter(b=>b.kind==='course'&&String(b.course_id)===String(c.id));
    return !bs.some(b=>b.room_id) && !bs.some(b=>b.uses_meeting&&b.meeting_account_id);
  });
}
function refreshCourseDropdown(){ const op=pendingOnlineCourses(); fillSelect(el('r_course'), op, c=>c.id, c=>courseLabel(c), op.length?'选一门未排线上课':'（暂无未排线上课）'); }
function renderPickList(){
  const list=pendingOnlineCourses();
  if(!list.length){ el('r_pickList').innerHTML='<div class="muted" style="font-size:12px">没有未排线上课</div>'; return; }
  el('r_pickList').innerHTML=list.map(c=>`<div class="pickrow${PICKED===String(c.id)?' on':''}" data-pc="${c.id}"><b>${esc(c.name)}</b><br><span class="muted">${esc(c.term||'')} ${weekdaysLabel(c.weekdays)} ${esc(c.start_time||'')}-${esc(c.end_time||'')}</span></div>`).join('');
  el('r_pickList').querySelectorAll('[data-pc]').forEach(x=>x.onclick=()=>{ el('r_bind').value='course'; syncBind(); el('r_course').value=x.dataset.pc; prefillFromCourse(x.dataset.pc); });
}
function syncBind(){ const isC=el('r_bind').value==='course';
  el('r_courseWrap').classList.toggle('hidden',!isC); el('r_titleWrap').classList.toggle('hidden',isC);
  el('r_pickPane').style.display=isC?'':'none';
}
function syncRec(){ const w=el('r_rec').value==='weekly';
  el('r_wdWrap').style.display=w?'':'none'; el('r_sdWrap').classList.toggle('hidden',!w); el('r_edWrap').classList.toggle('hidden',!w); el('r_dateWrap').classList.toggle('hidden',w);
}
function prefillFromCourse(id){
  PICKED=String(id); renderPickList();
  const c=COURSES.find(x=>String(x.id)===String(id)); if(!c) return;
  el('r_rec').value='weekly'; syncRec();
  WDSEL=new Set((c.weekdays||'').split(',').map(s=>s.trim()).filter(Boolean));
  el('r_wd').querySelectorAll('.chip').forEach(ch=>ch.classList.toggle('on', WDSEL.has(ch.dataset.d)));
  if(c.start_time) el('r_st').value=c.start_time; if(c.end_time) el('r_et').value=c.end_time;
  if(c.start_date) el('r_sd').value=c.start_date; if(c.end_date) el('r_ed').value=c.end_date;
}
// 收集查找的日期
function targetDates(){
  const s=el('r_st').value, e=el('r_et').value; if(e<=s) return null;
  if(el('r_rec').value==='once'){ const d=el('r_date').value; return d?[d]:[]; }
  const sd=el('r_sd').value, ed=el('r_ed').value; if(!sd||!ed) return [];
  if(!WDSEL.size) return [];
  const out=[]; let d=sd, g=0; while(d<=ed&&g++<400){ const w=weekdayOf(d); const wN=w===0?7:w; if(WDSEL.has(String(wN))) out.push(d); d=addDays(d,1); } return out;
}
// 筛出这些日期该时段全程空闲的账号
function findAccounts(){
  const s=el('r_st').value, e=el('r_et').value;
  const dates=targetDates();
  if(dates===null){ warn('结束需晚于开始'); return; }
  if(!dates.length){ warn('请补齐周几/日期'); return; }
  warn('');
  const rows=accSorted().map(a=>{
    let busy=0, resv=0;
    dates.forEach(dt=>{ const conf=accountConflicts(BOOKINGS,a.id,dt,s,e,null); conf.forEach(b=>{ if(b.status==='reserved') resv++; else busy++; }); });
    return {a, free:(busy+resv)===0, busy, resv};
  });
  const free=rows.filter(r=>r.free);
  let h='<div class="muted" style="font-size:12px;margin-bottom:6px">目标：'+dates.length+' 天 · '+s+'-'+e+'。全程空闲账号（点选一个）：</div>';
  h+= free.length? '<div>'+free.map(r=>`<span class="acc-free" data-selacc="${r.a.id}">${esc(acctName(r.a))}</span>`).join('')+'</div>'
     : '<div class="badge b-warn">这些日期该时段没有全程空闲的账号（可看下方一览调整）</div>';
  const partial=rows.filter(r=>!r.free);
  if(partial.length){ h+='<details style="margin-top:8px"><summary class="muted" style="font-size:12px;cursor:pointer">被占用的账号（'+partial.length+'）</summary><div style="margin-top:4px">'+
    partial.map(r=>`<span class="chip">${esc(acctName(r.a))} ${r.busy?('占'+r.busy):''}${r.resv?(' 预留'+r.resv):''}</span>`).join('')+'</div></details>'; }
  el('r_accBox').innerHTML=h;
  el('r_actBox').innerHTML='';
  el('r_accBox').querySelectorAll('[data-selacc]').forEach(x=>x.onclick=()=>{
    el('r_accBox').querySelectorAll('.acc-free').forEach(n=>n.classList.remove('on')); x.classList.add('on');
    showActions(x.dataset.selacc);
  });
}
function showActions(accId){
  const a=ACCOUNTS.find(x=>String(x.id)===String(accId));
  el('r_actBox').innerHTML='<div style="border:1px solid var(--line);border-radius:8px;padding:10px 12px">'+
    '选中账号：<b>'+esc(acctName(a))+'</b>'+
    '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">'+
      '<button data-do="reserved">预留（先占住）</button>'+
      '<button class="ghost" data-do="confirmed">正式占用（手头有账号/在教室）</button>'+
    '</div>'+
    '<div class="muted" style="font-size:11px;margin-top:6px">正式占用后，会议链接到「会议链接设定 → 线上课/临时」里补；没有账号信息就先预留。</div></div>';
  el('r_actBox').querySelectorAll('[data-do]').forEach(b=>b.onclick=()=>saveOccupy(accId, b.dataset.do));
}
async function saveOccupy(accId, status){
  const bind=el('r_bind').value, s=el('r_st').value, e=el('r_et').value;
  let courseId=null, title=null;
  if(bind==='course'){ courseId=el('r_course').value||null; if(!courseId){ warn('请选线上课'); return; } const c=COURSES.find(x=>String(x.id)===String(courseId)); title=c?c.name:null; }
  else { title=el('r_title').value.trim()||'临时使用'; }
  const who=(window.ROLE&&(window.ROLE.label||window.ROLE.role))||'admin';
  let rows=[], checkPairs=[];   // checkPairs: [date]
  if(el('r_rec').value==='weekly'){
    const sd=el('r_sd').value, ed=el('r_ed').value; if(!sd||!ed){ warn('请填起止日期'); return; }
    if(!WDSEL.size){ warn('请选周几'); return; }
    [...WDSEL].forEach(wd=>{ rows.push({ kind:(bind==='course'?'course':'temp'), course_id:(bind==='course'?courseId:null), title, recurrence:'weekly', weekday:Number(wd), start_date:sd, end_date:ed, start_time:s, end_time:e, uses_meeting:true, meeting_account_id:accId, status, room_id:null, created_by:who, note:(status==='reserved'?'账号预留':'账号占用') }); });
    let d=sd,g=0; while(d<=ed&&g++<400){ const w=weekdayOf(d); const wN=w===0?7:w; if(WDSEL.has(String(wN))) checkPairs.push(d); d=addDays(d,1); }
  } else {
    const dt=el('r_date').value; if(!dt){ warn('请选日期'); return; }
    rows.push({ kind:(bind==='course'?'course':'temp'), course_id:(bind==='course'?courseId:null), title, recurrence:'once', booking_date:dt, weekday:null, start_time:s, end_time:e, uses_meeting:true, meeting_account_id:accId, status, room_id:null, created_by:who, note:(status==='reserved'?'账号预留':'账号占用') });
    checkPairs.push(dt);
  }
  const clash=[]; checkPairs.forEach(dt=>{ if(accountConflicts(BOOKINGS,accId,dt,s,e,null).length) clash.push(dt); });
  if(clash.length && !confirm('该账号在以下日期该时段已被占：\n'+clash.slice(0,10).join('、')+(clash.length>10?'…':'')+'\n\n仍要占用吗？')) return;
  try{
    await sbInsert('sched_bookings', rows);
    BOOKINGS=await sbGet('sched_bookings','select=*');
    warn(''); toast(status==='reserved'?'已预留':'已正式占用');
    refreshCourseDropdown(); renderPickList(); el('r_accBox').innerHTML=''; el('r_actBox').innerHTML=''; renderOverview();
  }catch(err){ warn(esc(err.message)); }
}
function warn(m){ el('r_warn').innerHTML=m?('<span class="badge b-err">'+m+'</span>'):''; }
// ===== 占用一览（默认收起详情，可编辑/删除）=====
function occTitle(b){ const c=b.course_id?COURSES.find(x=>String(x.id)===String(b.course_id)):null; return c?c.name:(b.title||KIND_LABEL[b.kind]||'占用'); }
function renderOverview(){
  const accF=el('v_acc').value, stF=el('v_status').value;
  let list=BOOKINGS.filter(b=>b.uses_meeting&&b.meeting_account_id);
  if(accF) list=list.filter(b=>String(b.meeting_account_id)===String(accF));
  if(stF) list=list.filter(b=>(b.status||'confirmed')===stF);
  list=list.slice().sort((a,b)=>{ const da=a.booking_date||a.start_date||'', db=b.booking_date||b.start_date||''; return da.localeCompare(db); });
  el('v_count').textContent='共 '+list.length+' 条';
  if(el('v_wrap') && el('v_wrap').classList.contains('hidden')) return;   // 收起状态：只更新条数，不渲染长表
  const hasLink=b=>{ if(b.meeting_link||b.meeting_id) return true; if(b.course_id){ const c=COURSES.find(x=>String(x.id)===String(b.course_id)); return !!(c&&(c.meeting_link||c.meeting_id)); } return false; };
  let h='<table><thead><tr><th>账号</th><th>对象</th><th>周期</th><th>时段</th><th>状态</th><th>链接</th><th>操作</th></tr></thead><tbody>';
  if(!list.length) h+='<tr><td colspan="7" class="muted">无占用</td></tr>';
  list.forEach(b=>{ const st=b.status||'confirmed';
    const when=b.recurrence==='weekly'?(weekdaysLabel(String(b.weekday))+' '+(b.start_date||'')+'~'+(b.end_date||'')):(b.booking_date||'');
    h+=`<tr><td>${esc(aname(b.meeting_account_id))}</td><td><b>${esc(occTitle(b))}</b>${b.note?(' <small class="muted">'+esc(b.note)+'</small>'):''}</td>`+
      `<td style="font-size:12px">${esc(when)}</td><td>${esc(b.start_time||'')}-${esc(b.end_time||'')}</td>`+
      `<td>${st==='reserved'?'<span class="badge b-warn">预留</span>':'<span class="badge b-ok">正式</span>'}</td>`+
      `<td>${hasLink(b)?'<span class="badge b-ok" style="font-size:10px">已设</span>':'<span class="muted">—</span>'}</td>`+
      `<td><button class="sm ghost" data-edito="${b.id}">编辑</button> <button class="sm danger" data-delo="${b.id}">删</button></td></tr>`;
  });
  h+='</tbody></table>';
  el('v_box').innerHTML=h;
  el('v_box').querySelectorAll('[data-delo]').forEach(x=>x.onclick=async()=>{ if(!confirm('删除该账号占用？')) return; await sbDelete('sched_bookings',x.dataset.delo); BOOKINGS=await sbGet('sched_bookings','select=*'); refreshCourseDropdown(); renderPickList(); renderOverview(); toast('已删除'); });
  el('v_box').querySelectorAll('[data-edito]').forEach(x=>x.onclick=()=>editOccupy(x.dataset.edito));
}
function aname(id){ const a=ACCOUNTS.find(x=>String(x.id)===String(id)); return a?acctName(a):('#'+id); }
function detailText(b){
  const when=b.recurrence==='weekly'?(weekdaysLabel(String(b.weekday))+' '+(b.start_date||'')+'~'+(b.end_date||'')):(b.booking_date||'');
  const link=(b.meeting_link||b.meeting_id)?('　'+(b.meeting_link?('链接:'+b.meeting_link):'')+(b.meeting_id?('　会议号:'+b.meeting_id):'')):'　（未设链接）';
  return when+' '+(b.start_time||'')+'-'+(b.end_time||'')+'　'+(b.note||'')+link+'　录入:'+(b.created_by||'');
}
function editOccupy(id){
  const b=BOOKINGS.find(x=>String(x.id)===String(id)); if(!b) return;
  const isWeekly=b.recurrence==='weekly';
  let h='<div style="position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;z-index:60;overflow:auto;padding:40px 16px"><div class="card" style="width:520px;max-width:94vw;margin:auto">'+
    '<h3 style="margin-top:2px">编辑账号占用 · '+esc(occTitle(b))+'</h3><div class="row">'+
    '<div class="field"><label>账号</label><select id="oe_acc">'+accSorted().map(a=>`<option value="${a.id}"${String(a.id)===String(b.meeting_account_id)?' selected':''}>${esc(acctName(a))}</option>`).join('')+'</select></div>'+
    (isWeekly?('<div class="field"><label>起始日</label><input type="date" id="oe_sd" value="'+esc(b.start_date||'')+'"></div><div class="field"><label>结束日</label><input type="date" id="oe_ed" value="'+esc(b.end_date||'')+'"></div>')
             :('<div class="field"><label>日期</label><input type="date" id="oe_date" value="'+esc(b.booking_date||'')+'"></div>'))+
    '<div class="field"><label>开始</label><input type="time" id="oe_st" value="'+esc(b.start_time||'')+'"></div>'+
    '<div class="field"><label>结束</label><input type="time" id="oe_et" value="'+esc(b.end_time||'')+'"></div>'+
    '<div class="field"><label>状态</label><select id="oe_status"><option value="confirmed"'+(b.status!=='reserved'?' selected':'')+'>正式</option><option value="reserved"'+(b.status==='reserved'?' selected':'')+'>预留</option></select></div>'+

  const wrap=document.createElement('div'); wrap.innerHTML=h; document.body.appendChild(wrap.firstChild);

// 线上课/临时占用的链接设定：列出占了账号的线上课与临时占用

        `<td>${b.status==='reserved'?'<span class="badge b-warn">预留</span>':'<span class="badge b-ok">正式</span>'}</td>`+
        `<td>${hasLink?('<span class="badge b-ok" style="font-size:10px">已设</span>'+(c.meeting_link?(' <a href="'+esc(c.meeting_link)+'" target="_blank" style="font-size:10px">链接</a>'):'')+(c.meeting_id?(' <span class="muted" style="font-size:10px">'+esc(c.meeting_id)+'</span>'):'')+(c.host_key?(' <span class="muted" style="font-size:10px">密钥'+esc(c.host_key)+'</span>'):'')):'<span class="muted">—</span>'}</td>`+

  h+='<h4 style="margin:14px 0 6px">临时占用（'+tempBk.length+'）</h4>';
  if(tempBk.length){
    h+='<table><thead><tr><th>用途</th><th>账号</th><th>日期/周期</th><th>状态</th><th>链接</th><th>操作</th></tr></thead><tbody>';
    tempBk.forEach(b=>{ const hasLink=!!(b.meeting_link||b.meeting_id);
      const when=b.recurrence==='weekly'?(weekdaysLabel(String(b.weekday))+' '+(b.start_date||'')+'~'+(b.end_date||'')):(b.booking_date||'');
      h+=`<tr><td><b>${esc(b.title||'临时使用')}</b></td><td>${esc(aname(b.meeting_account_id))}</td><td>${esc(when)} ${esc(b.start_time||'')}-${esc(b.end_time||'')}</td>`+
        `<td>${b.status==='reserved'?'<span class="badge b-warn">预留</span>':'<span class="badge b-ok">正式</span>'}</td>`+
        `<td>${hasLink?'<span class="badge b-ok" style="font-size:10px">已设</span>':'<span class="muted">—</span>'}</td>`+

function renderMtgRoom(){
  const roomId=el('ms_room').value;
  const room=ROOMS.find(r=>String(r.id)===String(roomId));
  if(!room){ el('ms_body').innerHTML='<div class="muted">请选教室。</div>'; return; }
  // 本教室每周排的课（去重课程）
  const bIds=[...new Set(BOOKINGS.filter(b=>b.kind==='course'&&String(b.room_id)===String(room.id)).map(b=>String(b.course_id)))];
  const courses=bIds.map(id=>COURSES.find(c=>String(c.id)===String(id))).filter(Boolean);
  const boundAcc=room.meeting_account_id?aname(room.meeting_account_id):null;
  if(!courses.length){ el('ms_body').innerHTML='<div class="muted">这间教室还没有排课。请先到「排教室」把课排进来。</div>'; return; }
  let h=`<div style="font-size:13px;margin-bottom:8px"><b>${esc(room.name)}</b> <span class="muted">${esc(room.campus)}${boundAcc?(' · 绑定账号：'+esc(boundAcc)):' · 未绑定账号'}</span></div>`;
  // 本教室有绑定账号，但存在「已排却没占账号」的占用 → 提供一键补绑
  if(room.meeting_account_id){
    const unbound=BOOKINGS.filter(b=>b.kind==='course'&&String(b.room_id)===String(room.id)&&!(b.uses_meeting&&b.meeting_account_id));
    if(unbound.length){
      h+='<div style="background:#fff8f0;border:1px solid #f0d9b3;border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:12px">有 '+unbound.length+' 条本教室占用还没绑定腾讯账号（看板/冲突检测会漏）。<button class="sm" id="ms_bindall" style="margin-left:6px">一键补绑本教室账号</button></div>';
    }
  }
  h+='<table><thead><tr><th>课程</th><th>专业</th><th>周几·时段</th><th>会议链接</th><th>操作</th></tr></thead><tbody>';
  courses.sort((a,b)=>(a.term||'').localeCompare(b.term||'')||(a.weekdays||'').localeCompare(b.weekdays||'')).forEach(c=>{
    const hasLink=!!(c.meeting_link||c.meeting_id);
    h+=`<tr><td><b>${esc((c.term?c.term+' ':'')+(c.name||''))}</b>${(c.start_date||c.end_date)?('<br><small class="muted">'+esc((c.start_date||'')+'~'+(c.end_date||''))+'</small>'):''}</td><td>${esc(c.major||c.category||'')}</td>`+
      `<td>${weekdaysLabel(c.weekdays)} ${c.start_time||''}-${c.end_time||''}</td>`+
      `<td>${hasLink?('<span class="badge b-ok">已设</span> <small class="muted">'+esc((c.meeting_id||'')||'有链接')+'</small>'):'<span class="badge b-warn">未设</span>'}</td>`+
      `<td><button class="sm ghost" data-msset="${c.id}">${hasLink?'重设':'设链接'}</button>${hasLink?(' <button class="sm ghost" data-mscopy="'+c.id+'">统一覆盖其他课</button>'):''}</td></tr>`;
  });
  h+='</tbody></table>';
  el('ms_body').innerHTML=h;
  bind('[data-msset]', id=>mtgSetForm(id, room));
  bind('[data-mscopy]', id=>mtgCopyForm(id, room));
  if(el('ms_bindall')) el('ms_bindall').onclick=async()=>{
    const unbound=BOOKINGS.filter(b=>b.kind==='course'&&String(b.room_id)===String(room.id)&&!(b.uses_meeting&&b.meeting_account_id));
    if(!unbound.length) return;
    if(!confirm('把本教室 '+unbound.length+' 条未绑账号的占用，全部绑定到「'+esc(boundAcc||'')+'」？')) return;
    const btn=el('ms_bindall'); btn.disabled=true; btn.textContent='处理中…';
    try{ for(const b of unbound) await sbUpdate('sched_bookings', b.id, {uses_meeting:true, meeting_account_id:room.meeting_account_id});
      await reloadMtg(); renderMtgRoom(); toast('已补绑 '+unbound.length+' 条'); }
    catch(e){ toast('失败：'+e.message, false); btn.disabled=false; btn.textContent='一键补绑本教室账号'; }
  };
}

function mtgSetForm(courseId, room){
  const c=COURSES.find(x=>String(x.id)===String(courseId)); if(!c) return;
  const title=[c.term,c.category,c.name].filter(Boolean).join('-');
  const tpls=MTEMPLATES.filter(t=>!c.term||t.term===c.term);
  let parsed=null, chosenTpl=null;
  function render(){
    const dateRange=(c.start_date&&c.end_date)?(c.start_date+' ~ '+c.end_date):(c.start_date||c.end_date||'—');
    let h='<div style="position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;z-index:60;overflow:auto;padding:40px 16px"><div class="card" style="width:600px;max-width:94vw;margin:auto">'+
      '<h3 style="margin-top:2px">设会议链接 · 「'+esc(c.name)+'」</h3>'+
      // ① 会议标题（可选已有通用会议）
      '<div style="border-top:1px solid var(--line);margin:10px 0;padding-top:10px"><b>① 会议标题</b>'+
        (tpls.length?('<div style="margin-top:6px"><select id="ms_tpl" style="width:100%"><option value="">— 自定义标题（不用通用会议）—</option>'+
          tpls.map(t=>`<option value="${t.id}"${chosenTpl&&String(chosenTpl.id)===String(t.id)?' selected':''}>${esc(t.title||('通用会议#'+t.id))}${(t.meeting_link||t.meeting_id)?'（含通用链接）':''}</option>`).join('')+
          '</select></div>'):'')+
        '<div style="display:flex;gap:8px;margin-top:6px"><input id="ms_title" value="'+esc(chosenTpl?(chosenTpl.title||title):title)+'" style="flex:1"><button type="button" class="ghost sm" id="ms_ctitle">复制</button></div>'+
      '</div>'+
      // ② 会议设定详细信息（对照着设）
      '<div style="border-top:1px solid var(--line);margin:10px 0;padding-top:10px"><b>② 会议设定信息（对照设定周期会议）</b>'+
        '<table style="margin-top:6px"><tbody>'+
          `<tr><td class="muted" style="width:90px">周几·时段</td><td><b>${weekdaysLabel(c.weekdays)} ${esc(c.start_time||'')}-${esc(c.end_time||'')}</b></td></tr>`+
          `<tr><td class="muted">起止日期</td><td><b>${esc(dateRange)}</b></td></tr>`+
          `<tr><td class="muted">回数</td><td>${c.sessions?esc(String(c.sessions))+' 次':'—'}</td></tr>`+
          `<tr><td class="muted">教室</td><td>${esc(room.name)}（${esc(room.campus)}）</td></tr>`+
        '</tbody></table>'+
        '<div class="muted" style="font-size:11px;margin-top:4px">按上面的周几、时段、起止日期在腾讯会议里建「周期会议」。</div>'+
      '</div>';
    if(chosenTpl && (chosenTpl.meeting_link||chosenTpl.meeting_id)){
      h+='<div style="border-top:1px solid var(--line);margin:10px 0;padding-top:10px"><b>③ 使用该通用会议的链接</b>'+
        '<table style="margin-top:6px"><tbody>'+
        `<tr><td class="muted" style="width:90px">链接</td><td>${chosenTpl.meeting_link?esc(chosenTpl.meeting_link):'—'}</td></tr>`+
        `<tr><td class="muted">会议号</td><td>${chosenTpl.meeting_id?esc(chosenTpl.meeting_id):'—'}</td></tr>`+
        '</tbody></table><div class="muted" style="font-size:11px;margin-top:4px">直接用这个通用链接，无需再粘贴解析。</div></div>';
    } else {
      h+='<div style="border-top:1px solid var(--line);margin:10px 0;padding-top:10px"><b>③ 粘贴会议邀请解析</b><div class="field" style="margin-top:6px"><textarea id="ms_txt" rows="5" placeholder="把腾讯会议邀请整段粘贴进来"></textarea></div><button type="button" class="ghost sm" id="ms_parse">解析</button><div id="ms_prev" style="margin-top:8px"></div></div>';
    }
    const canSave = chosenTpl ? !!(chosenTpl.meeting_link||chosenTpl.meeting_id) : !!parsed;
    if(!chosenTpl){
      h+='<div style="border-top:1px solid var(--line);margin:10px 0;padding-top:10px"><b>④ 存为本期通用会议（可选）</b>'+
        '<div style="display:flex;gap:8px;align-items:center;margin-top:6px">'+
          '<span id="ms_saveTplChip" data-on="0" style="cursor:pointer;user-select:none;border:1px solid var(--line);border-radius:14px;padding:3px 12px;font-size:12px;color:#666">存为通用会议</span>'+
          '<input id="ms_tplTitle" placeholder="通用会议名（留空用上面标题）" style="flex:1;display:none">'+
        '</div>'+
        '<div class="muted" style="font-size:11px;margin-top:4px">开启后，这条链接会存进本期通用会议库，之后同一期的其他课在上方下拉里就能直接选用。</div></div>';
    }
    h+='<div style="margin-top:12px;display:flex;gap:8px"><button id="ms_save" '+(canSave?'':'disabled')+'>保存链接</button><button class="ghost" id="ms_cancel">取消</button></div>'+
      '</div></div>';
    el('ms_form').innerHTML=h;
    if(el('ms_saveTplChip')) el('ms_saveTplChip').onclick=()=>{ const c2=el('ms_saveTplChip'); const on=c2.dataset.on==='1'?'0':'1'; c2.dataset.on=on;
      c2.style.background=on==='1'?'var(--blue)':''; c2.style.color=on==='1'?'#fff':'#666'; c2.style.borderColor=on==='1'?'var(--blue)':'var(--line)';
      el('ms_tplTitle').style.display=on==='1'?'':'none'; };
    if(el('ms_tpl')) el('ms_tpl').onchange=()=>{ const id=el('ms_tpl').value; chosenTpl=id?MTEMPLATES.find(t=>String(t.id)===String(id)):null; parsed=null; render(); };
    el('ms_ctitle').onclick=()=>navigator.clipboard.writeText(el('ms_title').value).then(()=>toast('标题已复制'));
    if(el('ms_parse')) el('ms_parse').onclick=()=>{ parsed=parseTencent(el('ms_txt').value);
      if(!parsed.link&&!parsed.id){ el('ms_prev').innerHTML='<span class="badge b-err">没识别到链接或会议号</span>'; el('ms_save').disabled=true; return; }
      el('ms_prev').innerHTML='<table><tbody>'+`<tr><td class="muted">链接</td><td>${parsed.link?esc(parsed.link):'—'}</td></tr><tr><td class="muted">会议号</td><td>${parsed.id?esc(parsed.id):'—'}</td></tr></tbody></table>`;
      el('ms_save').disabled=false; };
    el('ms_cancel').onclick=()=>{ el('ms_form').innerHTML=''; };
    el('ms_save').onclick=async()=>{
      let link,mid;
      if(chosenTpl){ link=chosenTpl.meeting_link||null; mid=chosenTpl.meeting_id||null; }
      else { if(!parsed) return; link=parsed.link||null; mid=parsed.id||null; }
      const btn=el('ms_save'); btn.disabled=true; btn.textContent='保存中…';
      try{
        await sbUpdate('sched_courses', c.id, {meeting_link:link, meeting_id:mid});
        // 同步该课在本教室的占用：标记占用教室绑定的会议账号，看板/搜索才显示网络与账号
        if(room && room.meeting_account_id){
          const bs=BOOKINGS.filter(b=>b.kind==='course'&&String(b.course_id)===String(c.id)&&String(b.room_id)===String(room.id));
          for(const b of bs) await sbUpdate('sched_bookings', b.id, {uses_meeting:true, meeting_account_id:room.meeting_account_id});
        }
        // 存为本期通用会议
        if(!chosenTpl && el('ms_saveTplChip') && el('ms_saveTplChip').dataset.on==='1'){
          const tplTitle=(el('ms_tplTitle').value.trim())||el('ms_title').value.trim()||null;
          await sbInsert('sched_meeting_templates', { term:c.term||null, major:c.major||null, title:tplTitle,
            meeting_link:link, meeting_id:mid, start_time:c.start_time||null, end_time:c.end_time||null });
        }
        await reloadMtg(); el('ms_form').innerHTML=''; renderMtgRoom(); toast('已保存会议链接'+(room&&room.meeting_account_id?'（已绑定教室账号）':''));
      }
      catch(e){ toast(esc(e.message), false); btn.disabled=false; btn.textContent='保存链接'; }
    };
  }
  render();
}
/* 统一覆盖：把某门课的链接，覆盖到本教室其他（默认同专业）课程 */
function mtgCopyForm(courseId, room){
  const src=COURSES.find(x=>String(x.id)===String(courseId)); if(!src) return;
  if(!src.meeting_link&&!src.meeting_id){ toast('这门课还没设链接', false); return; }
  const bIds=[...new Set(BOOKINGS.filter(b=>b.kind==='course'&&String(b.room_id)===String(room.id)).map(b=>String(b.course_id)))];
  const others=bIds.map(id=>COURSES.find(c=>String(c.id)===String(id))).filter(c=>c&&String(c.id)!==String(src.id));
  if(!others.length){ toast('本教室没有其他课可覆盖', false); return; }
  const sel=new Set(others.filter(c=>(c.major||'')===(src.major||'')).map(c=>String(c.id))); // 默认勾同专业
  function render(){
    let h='<div style="position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;z-index:60;overflow:auto;padding:40px 16px"><div class="card" style="width:520px;max-width:94vw;margin:auto">'+
      '<h3 style="margin-top:2px">统一覆盖会议链接</h3>'+
      '<div class="tip">把「'+esc(src.name)+'」的会议链接/会议号，覆盖到本教室下面勾选的课程（默认勾选同专业）。上课时段各课不变。</div>'+
      '<div style="max-height:300px;overflow:auto;margin:8px 0">'+
      others.map(c=>{ const on=sel.has(String(c.id)); const same=(c.major||'')===(src.major||'');
        return `<div class="mscov" data-cov="${c.id}" style="cursor:pointer;border:1px solid ${on?'#2c8a4f':'var(--line)'};background:${on?'#e7f6ec':'#fff'};border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:13px">${on?'✓ ':''}<b>${esc((c.term?c.term+' ':'')+(c.name||''))}</b> <small class="muted">${esc(c.major||c.category||'')}${same?'':' · 非同专业'} · ${weekdaysLabel(c.weekdays)} ${c.start_time||''}-${c.end_time||''}</small></div>`;
      }).join('')+'</div>'+
      '<div style="display:flex;gap:8px"><button id="ms_covdo">覆盖到所选</button><button class="ghost" id="ms_covcancel">取消</button></div></div></div>';
    el('ms_form').innerHTML=h;
    document.querySelectorAll('.mscov').forEach(x=>x.onclick=()=>{ const id=String(x.dataset.cov); if(sel.has(id))sel.delete(id); else sel.add(id); render(); });
    el('ms_covcancel').onclick=()=>{ el('ms_form').innerHTML=''; };
    el('ms_covdo').onclick=async()=>{
      if(!sel.size){ toast('未选择', false); return; }
      const btn=el('ms_covdo'); btn.disabled=true; btn.textContent='覆盖中…';
      try{ for(const id of sel){ await sbUpdate('sched_courses', id, {meeting_link:src.meeting_link||null, meeting_id:src.meeting_id||null});
          if(room && room.meeting_account_id){ const bs=BOOKINGS.filter(b=>b.kind==='course'&&String(b.course_id)===String(id)&&String(b.room_id)===String(room.id));
            for(const b of bs) await sbUpdate('sched_bookings', b.id, {uses_meeting:true, meeting_account_id:room.meeting_account_id}); } }
        await reloadMtg(); el('ms_form').innerHTML=''; renderMtgRoom(); toast('已覆盖 '+sel.size+' 门课'); }
      catch(e){ toast('失败：'+e.message, false); btn.disabled=false; btn.textContent='覆盖到所选'; }
    };
  }
  render();
}

boot();
</script>
</body></html>
