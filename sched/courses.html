<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>课程查询 · 唯新</title>
<link rel="stylesheet" href="style.css">
<style>
.fl{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:8px; }
.fl > .lbl{ font-size:12px; color:var(--sub); min-width:42px; }
.chip{ display:inline-block; padding:3px 10px; border:1px solid var(--line); border-radius:14px; font-size:13px;
  cursor:pointer; background:#fff; color:var(--sub); user-select:none; }
.chip.on{ background:var(--blue); color:#fff; border-color:var(--blue); }
.chip.more{ border-style:dashed; }
.sbox{ width:100%; box-sizing:border-box; font-size:16px; padding:11px 14px; border:1px solid var(--line); border-radius:8px; }
.srow{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:8px; }
.chip small{ margin-left:4px; font-size:11px; opacity:.65; }
.chip.on small{ opacity:.9; }
.chip.zero{ opacity:.4; }
.glabel{ font-size:11px; color:var(--sub); background:#eef1f5; border-radius:4px; padding:1px 6px; margin-left:6px; }
#filters.dim .fl{ opacity:.45; }
.ccard.ended{ opacity:.6; }
.topline{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin:2px 0 10px; flex-wrap:wrap; }
.topline .cnt{ font-size:14px; font-weight:600; }
.ccard{ background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:10px; cursor:pointer; }
.ccard .l1{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.ccard .nm{ font-weight:700; font-size:15px; }
.ccard .tag{ display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; border:1px solid; }
.ccard .l2,.ccard .l3,.ccard .l4{ font-size:13px; color:var(--sub); margin-top:4px; }
.ccard .l4{ color:var(--blue); font-weight:600; }
.ccard .arrow{ margin-left:auto; color:var(--sub); font-size:12px; }
.ccard .sep{ color:#c5cad2; margin:0 5px; }
.detail{ margin-top:8px; border-top:1px dashed var(--line); padding-top:6px; }
.detail .r{ display:flex; gap:10px; padding:3px 4px; font-size:13px; flex-wrap:wrap; border-radius:4px; }
.detail .r .n{ width:34px; color:var(--sub); }
.detail .r .d{ width:104px; }
.detail .r .t{ width:100px; }
.detail .past{ color:#b4b9c1; }
.detail .off{ color:#9aa0a8; text-decoration:line-through; }
.detail .off .why{ text-decoration:none; display:inline-block; margin-left:4px; }
.detail .next{ background:#eef4f0; color:var(--blue); font-weight:600; }
@media (max-width:600px){
  .detail .r .d{ width:auto; min-width:92px; } .detail .r .t{ width:auto; }
}
</style>
</head><body>
<div id="nav"></div>
<div class="wrap">
  <div class="card">
    <input id="q" class="sbox" type="search" placeholder="搜课程名、老师、专业、校区、星期…（例：N1、周一、市谷）" autocomplete="off">
    <div class="srow"><span class="chip" id="onlyChip">只在筛选结果里搜</span><span class="muted" id="sNote" style="font-size:12px"></span></div>
  </div>
  <div class="card" id="filters">
    <div class="fl" id="fCat"><span class="lbl">类别</span></div>
    <div class="fl" id="fLang"><span class="lbl">语种</span></div>
    <div class="fl" id="fMajor"><span class="lbl">专业</span></div>
    <div class="fl" id="fTerm"><span class="lbl">期数</span></div>
    <div class="fl" id="fTermM"><span class="lbl">月</span></div>
    <div class="fl" id="fStatus"><span class="lbl">状态</span></div>
    <div class="fl" id="fCampus"><span class="lbl">校区</span></div>
    <div class="fl" id="fWd"><span class="lbl">星期</span></div>
    <div class="fl" id="fKw"><span class="lbl">关键词</span></div>
  </div>
  <div class="topline"><span class="muted" id="hint"></span><span><span class="cnt" id="cnt"></span> <button class="ghost sm hidden" id="clearBtn">清除筛选</button></span></div>
  <div id="list"></div>
</div>
<script src="common.js?v=20261005"></script>
<script>
const PAGE_SIZE = 30;
const STATUSES = ['未开课','进行中','已结课'];
const STATUS_ORDER = {'进行中':0,'未开课':1,'已结课':2};
// 关键词快捷筛选的词表：只显示课程名里实际出现过的词；以后加词直接往这里加
const KEYWORDS = ['N1','N2','N3','N4','N5','EJU','TOEIC','TOEFL','过去问','面试','小论文','研究计划书','共通课'];
const SHAKAI_GROUP = ['社会人文','社会学','新闻传播学','新聞传播学','社会福祉学'];   // 与 timetable.html 一致
const MAJOR_FOLD = 12;
let COURSES=[], HOLIDAYS=[], BOOKINGS=[], ROOMS=[], SESS={};
let INFO = {}, WDS = {}, HAY = {};
const ROWS = ['cat','lang','major','term','status','campus','wd','kw'];
const F = { cat:new Set(), lang:new Set(), major:new Set(), term:new Set(), status:new Set(['未开课','进行中']), campus:new Set(), wd:new Set(), kw:new Set(), q:'', only:false };
const MORE_OPEN = { term:false, termM:false, major:false };
let SHOWN = PAGE_SIZE;
const OPENED = new Set();

el('nav').innerHTML = renderNav('courses.html');
currentRole().then(r=>{
  if(r) el('nav').innerHTML = renderNav('courses.html', r);
  if(r && !(isAdminRole(r) || hasPerm(r,'course_view') || hasPerm(r,'timetable') || hasPerm(r,'course'))){
    document.querySelector('.wrap').innerHTML = '<div class="card">当前账号没有「课程查询」权限。</div>'; return;
  }
  boot();
}).catch(()=>boot());

/* ---------- 日期推算（复用 timetable.html 的算法）---------- */
function holidayOf(d){
  for(const h of HOLIDAYS){ const s=h.start_date, e=h.end_date||h.start_date; if(s && d>=s && d<=e) return h; }
  return null;
}
function csv(s){ return new Set(String(s||'').split(',').map(x=>x.trim()).filter(Boolean)); }
function reasonMap(c){ const m={}; (c.skip_reasons||'').split(';').forEach(p=>{ const i=p.indexOf('='); if(i>0) m[p.slice(0,i).trim()]=p.slice(i+1); }); return m; }
// 推算：weekdays + 开课日 + 休讲日 + 全局假期（未豁免）；合并组按 merge_order 轮流
function calcDates(c){
  const out=[];
  const grp = c.merge_group ? COURSES.filter(x=>x.merge_group===c.merge_group).sort((a,b)=>(a.merge_order||99)-(b.merge_order||99)) : [c];
  const ref = grp[0];
  if(!ref.weekdays) return out;
  const wds = parseWeekdaysSched(ref.weekdays);
  const starts = grp.map(x=>x.start_date).filter(Boolean).sort(), ends = grp.map(x=>x.end_date).filter(Boolean).sort();
  if(!starts.length || !ends.length) return out;
  let d=starts[0], guard=0, idx=0;
  while(d<=ends[ends.length-1] && guard++<500){
    if(wds.includes(weekdayOf(d))){
      const cur = grp[idx % grp.length]; idx++;
      if(cur===c && (!c.start_date||d>=c.start_date) && (!c.end_date||d<=c.end_date)){
        const hol=holidayOf(d), skip=csv(c.skip_dates), except=csv(c.holiday_except);
        if(hol && !except.has(d)) out.push({date:d, off:'假期', why:hol.label||''});
        else if(skip.has(d)) out.push({date:d, off:'休讲', why:reasonMap(c)[d]||''});
        else out.push({date:d});
      }
    }
    d=addDays(d,1);
  }
  return out;
}
// 优先用课程安排里的单回（course_sessions，course_id 与 sched_courses.id 一致）；没有再推算
function datesOf(c){
  const real = SESS[String(c.id)];
  let list;
  if(real && real.length){
    const set=new Set(real); list=[...set].sort().map(d=>({date:d}));
    const skip=csv(c.skip_dates), rm=reasonMap(c);
    list.forEach(x=>{ if(skip.has(x.date)){ x.off='休讲'; x.why=rm[x.date]||''; } });
    skip.forEach(d=>{ if(!set.has(d) && (!c.start_date||d>=c.start_date) && (!c.end_date||d<=c.end_date)) list.push({date:d, off:'休讲', why:rm[d]||''}); });
    list.sort((a,b)=>a.date<b.date?-1:1);
  }else list=calcDates(c);
  return list;
}
function roomOn(c, date){
  const wd=weekdayOf(date);
  const bs=BOOKINGS.filter(b=>String(b.course_id)===String(c.id) && b.status!=='rejected' && bookingOnDate(b,date) && (b.recurrence!=='weekly' || Number(b.weekday)===wd));
  if(!bs.length) return '';
  const r=ROOMS.find(x=>String(x.id)===String(bs[0].room_id));
  if(!r) return '';
  return (r.campus && !String(r.name).includes(r.campus) ? r.campus+' ' : '') + r.name;
}
function placeOf(c, date){
  return roomOn(c,date) || (c.mode==='线上' || c.campus==='线上' ? '线上' : (c.campus||''));
}
function buildInfo(c){
  const today=todayStr(), nowT=new Date().toTimeString().slice(0,5);
  const dates=datesOf(c).map(x=>Object.assign(x,{ s:c.start_time||'', e:c.end_time||'', room: x.off?'':placeOf(c,x.date) }));
  const act=dates.filter(x=>!x.off);
  const isPast=x=> x.date<today || (x.date===today && x.e && x.e<=nowT);
  const done=act.filter(isPast).length;
  const next=act.find(x=>!isPast(x))||null;
  const total = c.sessions!=null ? c.sessions : act.length;
  const first=c.start_date||(act[0]&&act[0].date)||'', last=c.end_date||(act.length&&act[act.length-1].date)||'';
  let status='进行中';
  if(first && today<first) status='未开课';
  else if(last && today>last) status='已结课';
  else if(act.length && done>=act.length) status='已结课';
  return { dates, total, done, status, next, isPast };
}

/* ---------- 筛选（每一行互相独立；行内多选取并集，行间取交集）---------- */
function catOf(c){ return c.category||''; }
function termKeyOf(c){ return c.term || termOf(c.start_date); }
function campusOf(c){ return c.mode==='线上' && !c.campus ? '线上' : (c.campus||''); }
function majorOf(c){ return (c.major||'').trim(); }
function nameHay(c){ return ((c.name||'')+' '+(c.merge_name||'')).toLowerCase(); }
function rowTest(key, c, v){
  switch(key){
    case 'cat': return catOf(c)===v;
    case 'lang': return /语言|語学/.test(catOf(c)) && langType(c)===v;
    case 'major': return v==='社会人文' ? SHAKAI_GROUP.includes(majorOf(c)) : majorOf(c)===v;
    case 'term': return termKeyOf(c)===v;
    case 'status': return INFO[c.id].status===v;
    case 'campus': return campusOf(c)===v;
    case 'wd': return WDS[c.id].includes(v);
    case 'kw': return nameHay(c).includes(String(v).toLowerCase());
  }
  return true;
}
function passRow(key, c){ const s=F[key]; return !s.size || [...s].some(v=>rowTest(key,c,v)); }
function passAll(c, except){ return ROWS.every(k=>k===except || passRow(k,c)); }
function anyFilter(){ return ROWS.some(k=>F[k].size>0); }
// 「状态」默认带着「未开课 / 进行中」（把已结课的挡在外面）；那是默认值不是用户点的，不算「点选了条件」，用户自己点过状态或点过「清除」才算
let STATUS_DEFAULT=true;
function userFiltering(){ return ROWS.some(k=>F[k].size>0 && !(k==='status' && STATUS_DEFAULT)); }
function filtered(){ return COURSES.filter(c=>passAll(c)); }
function sortCourses(list, byStatus){
  return list.sort((a,b)=>
    (byStatus ? STATUS_ORDER[INFO[a.id].status]-STATUS_ORDER[INFO[b.id].status] : 0) ||
    (a.start_time||'').localeCompare(b.start_time||'') || (a.name||'').localeCompare(b.name||''));
}

/* ---------- 搜索 ---------- */
const CN_NUM='一二三四五六日', JP_DAY='月火水木金土日';
function buildHay(c){
  const wd=WDS[c.id].map(d=>['周'+CN_NUM[d-1],'星期'+CN_NUM[d-1],'礼拜'+CN_NUM[d-1],JP_DAY[d-1]+'曜',JP_DAY[d-1]+'曜日'].join(' ')).join(' ');
  const lang = /语言|語学/.test(catOf(c)) ? langType(c) : '';
  return [c.name,c.merge_name,c.teacher,c.major,c.category,c.campus,c.mode,c.term,termKeyOf(c),lang,wd].filter(Boolean).join(' ').toLowerCase();
}
function tokens(){ return F.q.trim().toLowerCase().split(/[\s　]+/).filter(Boolean); }
function searching(){ return tokens().length>0; }
function currentList(){
  if(!searching()) return sortCourses(filtered(), false);
  const toks=tokens();
  const base = F.only ? filtered() : COURSES.slice();
  return sortCourses(base.filter(c=>toks.every(t=>HAY[c.id].includes(t))), true);
}

/* ---------- 渲染 ---------- */
function setRow(id, html){ const row=el(id); const lbl=row.querySelector('.lbl'); row.innerHTML=''; row.appendChild(lbl); row.insertAdjacentHTML('beforeend', html); }
function renderFilters(){
  // 每一行的「其他行都满足」的课程集合，用来给每个 chip 算门数
  const bases={}; ROWS.forEach(k=>{ bases[k]=COURSES.filter(c=>passAll(c,k)); });
  const cnt=(k,v)=>bases[k].filter(c=>rowTest(k,c,v)).length;
  const chip=(k,v,text)=>{
    const on=F[k].has(v), n=cnt(k,v);
    return `<span class="chip${on?' on':''}${n===0&&!on?' zero':''}" data-k="${k}" data-v="${esc(v)}">${esc(text==null?v:text)}<small>${n}</small></span>`;
  };
  const moreChip=(key,open,n)=> n||open ? `<span class="chip more" data-more="${key}">${open?'收起 ▴':'更多 ▾ ('+n+')'}</span>` : '';

  setRow('fCat', CATEGORIES.map(c=>chip('cat',c)).join(''));
  setRow('fLang', ['日语','英语'].map(c=>chip('lang',c)).join(''));

  // 专业：按类别分组（组名是小标签），只列实际出现的专业；前 12 个外 + 已选中的在外面，其余「更多」
  const cats=[...new Set([...CATEGORIES, ...COURSES.map(c=>catOf(c)||'其他')])];
  const items=[];
  cats.forEach(cat=>{
    const ms=[...new Set(COURSES.filter(c=>(catOf(c)||'其他')===cat).map(majorOf).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh'));
    if(!ms.length) return;
    if(!ms.includes('社会人文') && ms.some(m=>SHAKAI_GROUP.includes(m))) ms.unshift('社会人文');
    ms.forEach(m=>items.push({g:cat, v:m}));
  });
  const showAll=MORE_OPEN.major;
  const vis=items.filter((it,i)=>showAll || i<MAJOR_FOLD || F.major.has(it.v));
  let mh='', lastG=null;
  vis.forEach(it=>{ if(it.g!==lastG){ mh+=`<span class="glabel">${esc(it.g)}</span>`; lastG=it.g; } mh+=chip('major',it.v); });
  setRow('fMajor', mh + moreChip('major', showAll, items.length-vis.length));

  // 期数：近期的在外面，其余「更多」；期 / 月两行
  [['fTerm',false,'term'],['fTermM',true,'termM']].forEach(([id,month,key])=>{
    const all=[...new Set(COURSES.map(termKeyOf).filter(Boolean))].filter(t=>isMonthTerm(t)===month).sort((a,b)=>termSortKey(b)-termSortKey(a));
    el(id).classList.toggle('hidden', !all.length);
    const recent=new Set(recentTermKeys(month?'month':'term'));
    const outer=all.filter(t=>MORE_OPEN[key] || recent.has(termSortKey(t)) || F.term.has(t));
    const inner=all.length-outer.length;
    setRow(id, outer.map(t=>chip('term',t)).join('') + moreChip(key, MORE_OPEN[key], inner));
  });
  setRow('fStatus', STATUSES.map(v=>chip('status',v)).join(''));
  const camps=['高马','市谷','线上'].filter(x=>COURSES.some(c=>campusOf(c)===x));
  setRow('fCampus', camps.map(v=>chip('campus',v)).join(''));
  setRow('fWd', [1,2,3,4,5,6,7].map(d=>chip('wd',d,WEEKDAYS[d])).join(''));
  const kws=KEYWORDS.filter(k=>COURSES.some(c=>nameHay(c).includes(k.toLowerCase())));
  el('fKw').classList.toggle('hidden', !kws.length);
  setRow('fKw', kws.map(k=>chip('kw',k)).join(''));
}
function md(date){ const [,m,d]=date.split('-').map(Number); return m+'/'+d; }
function cardHtml(c){
  const i=INFO[c.id], cc=catColor(c.category);
  const wl=weekdaysLabel(WDS[c.id].join(','));
  const time=(c.start_time&&c.end_time)? c.start_time.slice(0,5)+'–'+c.end_time.slice(0,5) : '';
  const stTxt = i.status==='进行中' ? `进行中 · 已上 ${i.done}/${i.total} 回` : i.status;
  const sep='<span class="sep">|</span>';
  const l2=[c.teacher, c.major, c.mode, campusOf(c)].filter(Boolean).map(esc).join(sep);
  const l3=[ (wl||time)? esc((wl+' '+time).trim()):'', (c.start_date||c.end_date)? esc((c.start_date||'?')+' ~ '+(c.end_date||'?')):'', `共 ${i.total} 回`, stTxt ].filter(Boolean).join(sep);
  const nx=i.next ? `<div class="l4">下次：${md(i.next.date)}（${WEEKDAYS[weekdayOf(i.next.date)]}）${esc(i.next.s)} · ${esc(i.next.room)}</div>` : '';
  const open=OPENED.has(String(c.id));
  return `<div class="ccard${searching()&&i.status==='已结课'?' ended':''}" data-id="${c.id}">`+
    `<div class="l1"><span class="nm">${esc(c.merge_name||c.name)}</span>`+
    `<span class="tag" style="background:${cc.bg};border-color:${cc.bd};color:${cc.tx}">${esc(c.category||'')}</span>`+
    (termKeyOf(c)?`<span class="badge b-mute">${esc(termKeyOf(c))}</span>`:'')+
    `<span class="arrow">${open?'收起 ▴':'展开 ▾'}</span></div>`+
    `<div class="l2">${l2}</div><div class="l3">${l3}</div>${nx}`+
    (open?detailHtml(c):'')+`</div>`;
}
function detailHtml(c){
  const i=INFO[c.id];
  if(!i.dates.length) return '<div class="detail muted">没有可推算的上课日期（缺少开课日 / 结课日 / 星期）。</div>';
  let n=0;
  return '<div class="detail">'+i.dates.map(x=>{
    if(x.off) return `<div class="r off"><span class="n"></span><span class="d">${md(x.date)}（${WEEKDAYS[weekdayOf(x.date)]}）</span><span class="t">${x.off}${x.why?'<span class="why"> · '+esc(x.why)+'</span>':''}</span></div>`;
    n++;
    const cls = x===i.next ? 'next' : (i.isPast(x) ? 'past' : '');
    return `<div class="r ${cls}"><span class="n">${n}</span><span class="d">${md(x.date)}（${WEEKDAYS[weekdayOf(x.date)]}）</span><span class="t">${esc(x.s)}–${esc(x.e)}</span><span>${esc(x.room)}</span></div>`;
  }).join('')+'</div>';
}
function renderList(){
  const sr=searching();
  // 打开时不列课程：输入了搜索词，或点选了任意筛选条件才出结果
  if(!sr && !userFiltering()){
    el('filters').classList.remove('dim'); el('onlyChip').classList.toggle('on', F.only); el('sNote').textContent='';
    el('clearBtn').classList.toggle('hidden', !anyFilter());
    el('cnt').textContent=''; el('hint').textContent='';
    el('list').innerHTML='<div class="tip">输入关键词，或点选上面的条件查看课程</div>';
    return;
  }
  const list=currentList();
  el('filters').classList.toggle('dim', sr && !F.only);
  el('onlyChip').classList.toggle('on', F.only);
  el('sNote').textContent = sr && !F.only ? '正在搜索全部课程，筛选暂不生效' : (sr ? '只在筛选结果里搜' : '');
  el('clearBtn').classList.toggle('hidden', !anyFilter());
  el('cnt').textContent='共 '+list.length+' 门';
  el('hint').textContent= list.length ? '点卡片展开全部上课日期' : '';
  const shown=list.slice(0,SHOWN);
  el('list').innerHTML = shown.length ? shown.map(cardHtml).join('') +
      (list.length>shown.length ? `<div style="text-align:center"><button class="ghost" id="moreBtn">显示更多（还有 ${list.length-shown.length} 门）</button></div>` : '')
    : '<div class="tip">'+(sr?'没有搜到符合的课程。':'没有符合条件的课程，试试放宽期数 / 状态筛选。')+'</div>';
}
function renderAll(){ renderFilters(); renderList(); }

function bind(){
  el('filters').addEventListener('click', e=>{
    const t=e.target.closest('.chip'); if(!t) return;
    const d=t.dataset;
    if(d.more!==undefined){ MORE_OPEN[d.more]=!MORE_OPEN[d.more]; renderFilters(); return; }
    const k=d.k, v=k==='wd'?Number(d.v):d.v;
    if(k==='status') STATUS_DEFAULT=false;
    F[k].has(v)?F[k].delete(v):F[k].add(v);
    SHOWN=PAGE_SIZE; renderAll();
  });
  el('clearBtn').onclick=()=>{ ROWS.forEach(k=>F[k].clear()); STATUS_DEFAULT=false; SHOWN=PAGE_SIZE; renderAll(); };
  el('onlyChip').onclick=()=>{ F.only=!F.only; SHOWN=PAGE_SIZE; renderList(); };
  el('q').oninput=()=>{ F.q=el('q').value; SHOWN=PAGE_SIZE; renderList(); };
  el('list').addEventListener('click', e=>{
    if(e.target.id==='moreBtn'){ SHOWN+=PAGE_SIZE; renderList(); return; }
    const card=e.target.closest('.ccard'); if(!card) return;
    const id=card.dataset.id; OPENED.has(id)?OPENED.delete(id):OPENED.add(id);
    const c=COURSES.find(x=>String(x.id)===id); card.outerHTML=cardHtml(c);
  });
}

async function boot(){
  el('list').innerHTML='<div class="tip">加载中…</div>';
  try{
    const CF='id,name,merge_name,merge_group,merge_order,category,major,course_type,teacher,campus,mode,term,weekdays,start_time,end_time,start_date,end_date,sessions,skip_dates,skip_reasons,holiday_except,deleted_at';
    const [cs, hol, bks, rooms, ses] = await Promise.all([
      sbGet('sched_courses','select='+CF),
      sbGet('sched_holidays','select=*&order=start_date').catch(()=>[]),
      sbGet('sched_bookings','select=id,room_id,course_id,recurrence,weekday,start_date,end_date,booking_date,start_time,end_time,status&kind=eq.course').catch(()=>[]),
      sbGet('sched_rooms','select=id,name,campus').catch(()=>[]),
      sbGet('course_sessions','select=course_id,session_date').catch(()=>[])
    ]);
    COURSES=cs.filter(c=>!c.deleted_at); HOLIDAYS=hol; BOOKINGS=bks.map(b=>Object.assign({kind:'course'},b)); ROOMS=rooms;
    ses.forEach(s=>{ if(s.course_id!=null && s.session_date) (SESS[String(s.course_id)]=SESS[String(s.course_id)]||[]).push(s.session_date); });
    COURSES.forEach(c=>{ WDS[c.id]=parseWeekdaysSched(c.weekdays); INFO[c.id]=buildInfo(c); HAY[c.id]=buildHay(c); });
  }catch(e){ el('list').innerHTML='<div class="tip">读取失败：'+esc(e.message)+'</div>'; return; }
  bind(); renderAll();
}
</script>
