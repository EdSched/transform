<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>操作记录 · 唯新</title>
<link rel="stylesheet" href="style.css">
<style>
  .chips{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:8px; }
  .chips .lbl{ font-size:12px; color:var(--sub); width:44px; }
  .chip2{ padding:4px 12px; border:1px solid var(--line); background:#fff; border-radius:14px; cursor:pointer; font-size:13px; user-select:none; }
  .chip2.on{ background:var(--blue); color:#fff; border-color:var(--blue); }
  tr.lrow{ cursor:pointer; }
  tr.lrow:hover{ background:#f4f8f5; }
  .kv{ display:grid; grid-template-columns:110px 1fr; gap:2px 10px; font-size:12px; }
  .kv b{ color:var(--sub); font-weight:normal; }
</style>
</head><body>
<div id="nav"></div>
<div class="wrap">
  <div id="denied" class="hidden"><div class="tip">没有查看操作记录的权限（需要「教室占用管理」或「账号与权限管理」权限）。</div></div>
  <div id="main" class="hidden">
    <div class="seg2" id="tabs" style="margin-bottom:10px"><span class="chip2 on" data-t="log">操作记录</span><span class="chip2 hidden" data-t="arch" id="tabArch">月度归档</span></div>
    <div id="pane_arch" class="hidden"></div>
    <div id="pane_log">
    <div class="card">
      <div class="row">
        <div class="field" style="flex:1;min-width:240px"><label>搜索（人名 / 学生 / 教室）</label><input id="q" placeholder="输入姓名、学生名、教室名…" style="width:100%"></div>
        <div class="field"><label>&nbsp;</label><span class="muted" id="cnt"></span></div>
      </div>
      <div class="chips"><span class="lbl">操作</span><span id="cAct"></span></div>
      <div class="chips"><span class="lbl">类型</span><span id="cKind"></span></div>
      <div class="chips"><span class="lbl">时间</span><span id="cTime"></span>
        <input type="month" id="monthPick" class="hidden" style="width:150px"></div>
    </div>
    <div id="trailBar" class="hidden"></div>
    <div class="card"><div id="logBox"><div class="muted">加载中…</div></div></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="common.js?v=20261022"></script>
<script src="../shared/search.js?v=20261029"></script>
<script>
const ACTIONS=[['create','新建'],['approve','批准'],['reject','驳回'],['edit','修改'],['cancel','取消/删除'],['archive','归档']];
const ACT_LABEL=Object.fromEntries(ACTIONS);
const KINDS=[['vip','VIP'],['temp','临时'],['rental','出租'],['meeting','会议'],['course','课程']];
const FIELD_LABEL={ booking_date:'日期', start_date:'起始日', end_date:'结束日', start_time:'开始', end_time:'结束', room_id:'教室', status:'状态', student_name:'学生', major:'专业',
  title:'事由/名称', note:'备注', user_name:'使用人', reject_reason:'驳回理由', req_other:'其他教室申请', urgent:'紧急', kind:'类型', recurrence:'周期', weekday:'周几',
  uses_meeting:'占用会议账号', meeting_account_id:'会议账号', show_title:'对外显示标题', entry_name:'录入人', created_by:'创建标记', allow_multi:'允许同人多间',
  orig_room_id:'原申请教室', req_campus:'申请校区', reviewed_at:'审核时间', meeting_link:'会议链接', meeting_id:'会议号', course_id:'课程', client_token:'设备标记', id:'记录号' };
const SEL={ act:new Set(), kind:new Set(), time:'7d', month:'' };
const STATE={ rows:[], shown:30, trail:null };
let ROOMS=[], ACCOUNTS=[], CAN_ARCH=false;
const rmap=()=>Object.fromEntries(ROOMS.map(r=>[String(r.id),r]));
function roomText(id){ const r=rmap()[String(id)]; return r?(r.campus+' '+r.name):(id?('#'+id):'—'); }

el('nav').innerHTML = renderNav('oplog.html');
// 嵌在排课首页里时（iframe 地址没有 ?k=），权限由首页通过 canmanage / canarchive 传入，和 booking.html 一致；
// 真正的读写权限仍由数据库（RLS）按登录身份把关
const QP=new URLSearchParams(location.search);
let EMB_MANAGE=QP.get('canmanage')==='1', EMB_ARCH=QP.get('canarchive')==='1';
pageRole().catch(()=>null).then(r=>{
  if(r) el('nav').innerHTML = renderNav('oplog.html', r);
  const ps=permSet(r);
  const ok = EMB_MANAGE || (r && (ps.has('occupy')||ps.has('manage')||r.role==='admin'));
  if(ok){ el('main').classList.remove('hidden'); CAN_ARCH=EMB_ARCH||(r&&(ps.has('manage')||r.role==='admin')); boot(); }
  else el('denied').classList.remove('hidden');
});

function chipRow(box, items, isOn, onClick){
  box.innerHTML=items.map(([k,t])=>`<span class="chip2${isOn(k)?' on':''}" data-k="${k}">${t}</span>`).join('');
  box.querySelectorAll('.chip2').forEach(c=>c.onclick=()=>onClick(c.dataset.k));
}
function renderChips(){
  chipRow(el('cAct'), ACTIONS, k=>SEL.act.has(k), k=>{ SEL.act.has(k)?SEL.act.delete(k):SEL.act.add(k); renderChips(); load(); });
  chipRow(el('cKind'), KINDS, k=>SEL.kind.has(k), k=>{ SEL.kind.has(k)?SEL.kind.delete(k):SEL.kind.add(k); renderChips(); load(); });
  chipRow(el('cTime'), [['7d','近 7 天'],['30d','近 30 天'],['month','按月']], k=>SEL.time===k, k=>{
    SEL.time=k; el('monthPick').classList.toggle('hidden',k!=='month');
    if(k==='month' && !el('monthPick').value) el('monthPick').value=todayStr().slice(0,7);
    SEL.month=el('monthPick').value; renderChips(); load(); });
}
async function boot(){
  ROOMS = await sbGet('sched_rooms','select=id,campus,name&order=campus,sort').catch(()=>[]);
  renderChips();
  if(CAN_ARCH){ el('tabArch').classList.remove('hidden'); }
  document.querySelectorAll('#tabs .chip2').forEach(c=>c.onclick=()=>{
    document.querySelectorAll('#tabs .chip2').forEach(x=>x.classList.toggle('on',x===c));
    el('pane_log').classList.toggle('hidden',c.dataset.t!=='log'); el('pane_arch').classList.toggle('hidden',c.dataset.t!=='arch');
    if(c.dataset.t==='arch') archInit();
  });
  if(new URLSearchParams(location.search).get('tab')==='arch' && CAN_ARCH) document.querySelector('#tabs [data-t=arch]').click();
  el('monthPick').onchange=()=>{ SEL.month=el('monthPick').value; load(); };
  bindSearch(el('q'), ()=>{ STATE.shown=30; renderRows(); });
  load();
}
function timeRange(){
  const now=new Date();
  if(SEL.time==='7d')  return [new Date(now-7*86400000).toISOString(), null];
  if(SEL.time==='30d') return [new Date(now-30*86400000).toISOString(), null];
  if(!SEL.month) return [null,null];
  const [y,m]=SEL.month.split('-').map(Number);
  return [new Date(y,m-1,1).toISOString(), new Date(y,m,1).toISOString()];
}
async function load(){
  STATE.shown=30; STATE.trail=null; el('trailBar').classList.add('hidden');
  el('logBox').innerHTML='<div class="muted">加载中…</div>';
  const [from,to]=timeRange();
  let q='select=*&order=at.desc&limit=1000';
  if(from) q+='&at=gte.'+encodeURIComponent(from);
  if(to)   q+='&at=lt.'+encodeURIComponent(to);
  if(SEL.act.size)  q+='&action=in.('+[...SEL.act].join(',')+')';
  if(SEL.kind.size) q+='&kind=in.('+[...SEL.kind].join(',')+')';
  try{ STATE.rows=await sbGet('sched_booking_log', q); }
  catch(e){ el('logBox').innerHTML='<span class="badge b-err">'+esc(e.message)+'</span>'; return; }
  renderRows();
}
async function showTrail(bid){
  el('logBox').innerHTML='<div class="muted">加载中…</div>';
  try{ STATE.rows=await sbGet('sched_booking_log','select=*&booking_id=eq.'+bid+'&order=at.asc&limit=500'); }
  catch(e){ el('logBox').innerHTML='<span class="badge b-err">'+esc(e.message)+'</span>'; return; }
  STATE.trail=bid; STATE.shown=500;
  const bar=el('trailBar'); bar.classList.remove('hidden');
  bar.innerHTML='<div class="tip">占用 #'+esc(bid)+' 的全部记录（从提交到最后一步，按时间正序）。 <button class="ghost sm" id="trailBack">返回列表</button></div>';
  el('trailBack').onclick=load;
  renderRows(true);
}
function whenText(x){
  const s=x.snapshot||{};
  if(x.action==='archive') return esc((s.month||'')+' 月');
  if(s.recurrence==='weekly') return esc((s.weekday?weekdaysLabel(String(s.weekday))+' ':'')+(s.start_date||'')+'~'+(s.end_date||''))+'<br><small class="muted">'+esc((s.start_time||'')+'-'+(s.end_time||''))+'</small>';
  return esc(x.booking_date||s.booking_date||'')+'<br><small class="muted">'+esc((s.start_time||'')+'-'+(s.end_time||''))+'</small>';
}
function fmtAt(iso){ const d=new Date(iso); return ymd(d)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function matches(x){
  const q=(el('q').value||'').trim(); if(!q) return true;
  return searchMatch(q,[x.actor,x.user_name,x.student_name,roomText(x.room_id),(x.snapshot||{}).entry_name],{names:3});
}
function val(k,v){
  if(v==null||v==='') return '空';
  if(k==='room_id'||k==='orig_room_id') return roomText(v);
  if(typeof v==='boolean') return v?'是':'否';
  return String(v);
}
function detailHtml(x){
  let h='';
  if(x.action==='archive'){
    const s=x.snapshot||{};
    return '<div class="kv"><b>月份</b><span>'+esc(s.month||'')+'</span><b>删除条数</b><span>'+esc(s.count)+'</span><b>文件</b><span>'+esc(s.path||'')+'</span><b>操作人</b><span>'+esc(x.actor||'')+'</span></div>';
  }
  if(x.changes && Object.keys(x.changes).length){
    h+='<div style="margin-bottom:8px"><b style="font-size:12px">改了什么</b><div class="kv" style="margin-top:4px">'+
      Object.keys(x.changes).map(k=>`<b>${esc(FIELD_LABEL[k]||k)}</b><span>${esc(val(k,x.changes[k].from))} → ${esc(val(k,x.changes[k].to))}</span>`).join('')+'</div></div>';
  }
  if(x.snapshot){
    const lbl = x.action==='cancel' ? '删除前的整条内容' : (x.action==='create' ? '新建的内容' : '操作前的内容');
    h+='<div><b style="font-size:12px">'+lbl+'</b><div class="kv" style="margin-top:4px">'+
      Object.keys(x.snapshot).filter(k=>x.snapshot[k]!==null && x.snapshot[k]!=='' && k!=='client_token')
        .map(k=>`<b>${esc(FIELD_LABEL[k]||k)}</b><span>${esc(val(k,x.snapshot[k]))}</span>`).join('')+'</div></div>';
  }
  if(x.booking_id) h+='<div style="margin-top:8px"><button class="ghost sm" data-trail="'+x.booking_id+'">同一条的全部记录</button></div>';
  return h;
}
function renderRows(isTrail){
  const list=STATE.rows.filter(matches);
  el('cnt').textContent='共 '+list.length+' 条'+(STATE.rows.length>=1000?'（已达读取上限 1000 条，请缩小时间范围）':'');
  if(!list.length){ el('logBox').innerHTML='<div class="muted">没有符合条件的记录</div>'; return; }
  const shown=list.slice(0,STATE.shown);
  let h='<table><thead><tr><th>时间</th><th>操作</th><th>操作人</th><th>类型</th><th>日期时段</th><th>校区教室</th><th>使用人</th><th>学生</th></tr></thead><tbody>';
  shown.forEach((x,i)=>{
    const bad = x.action==='reject'||x.action==='cancel' ? 'b-err' : (x.action==='archive'?'b-warn':'b-ok');
    h+=`<tr class="lrow" data-i="${i}"><td>${esc(fmtAt(x.at))}</td><td><span class="badge ${bad}">${esc(ACT_LABEL[x.action]||x.action)}</span></td>`+
      `<td>${esc(x.actor||'—')}${x.actor_kind==='anon'?' <small class="muted">(未登录)</small>':''}</td><td>${esc(KIND_LABEL[x.kind]||x.kind||'—')}</td>`+
      `<td>${whenText(x)}</td><td>${esc(x.room_id?roomText(x.room_id):'—')}</td><td>${esc(x.user_name||'')}</td><td>${esc(x.student_name||'')}</td></tr>`+
      `<tr class="hidden" data-d="${i}"><td colspan="8" style="background:#fafbfa">${detailHtml(x)}</td></tr>`;
  });
  h+='</tbody></table>';
  if(list.length>shown.length) h+=`<div style="text-align:center;margin-top:10px"><button class="ghost sm" id="more">显示更多（还有 ${list.length-shown.length} 条）</button></div>`;
  const box=el('logBox'); box.innerHTML=h;
  box.querySelectorAll('tr.lrow').forEach(tr=>tr.onclick=()=>box.querySelector('tr[data-d="'+tr.dataset.i+'"]').classList.toggle('hidden'));
  box.querySelectorAll('[data-trail]').forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); showTrail(b.dataset.trail); });
  if(el('more')) el('more').onclick=()=>{ STATE.shown+=30; renderRows(isTrail); };
}

/* ================= 月度归档 ================= */
const ARCH={ months:[], cur:'', busy:false };
const monthOf=d=>String(d||'').slice(0,7);
const monthRange=m=>{ const [y,mo]=m.split('-').map(Number); const last=new Date(y,mo,0).getDate();
  return { first:m+'-01', last:m+'-'+String(last).padStart(2,'0'), atFrom:new Date(y,mo-1,1).toISOString(), atTo:new Date(y,mo,1).toISOString() }; };
// 归档范围：非课程；单次且日期在该月，或每周重复且结束日 <= 该月最后一天（含此前已整段结束的）
function archQuery(m){
  const r=monthRange(m);
  return 'select=*&kind=neq.course&or=(and(recurrence.eq.once,booking_date.gte.'+r.first+',booking_date.lte.'+r.last+'),and(recurrence.eq.weekly,end_date.lte.'+r.last+'))';
}
async function archInit(){
  const box=el('pane_arch'); box.innerHTML='<div class="card"><div class="muted">加载中…</div></div>';
  const thisMonth=todayStr().slice(0,7);
  let rows=[];
  try{ rows=await sbGet('sched_bookings','select=id,recurrence,booking_date,end_date&kind=neq.course'); }
  catch(e){ box.innerHTML='<div class="card"><span class="badge b-err">'+esc(e.message)+'</span></div>'; return; }
  const set=new Set();
  rows.forEach(b=>{ const m=monthOf(b.recurrence==='weekly'?b.end_date:b.booking_date); if(m && m<thisMonth) set.add(m); });
  ARCH.months=[...set].sort().reverse();
  if(!ARCH.months.includes(ARCH.cur)) ARCH.cur=ARCH.months[0]||'';
  await archRender();
}
async function archRender(){
  const box=el('pane_arch');
  let h='<div class="card"><b>月度归档</b><div class="muted" style="font-size:12px;margin:4px 0 8px">只能归档已经过完的月份（本月不行）。先「生成并保存」（下载 Excel，同时存入 Storage），再「清空这个月」。课程占用不在此处删除；操作记录本身不会被删。</div>';
  h+='<div class="chips" style="margin-top:0"><span class="lbl">月份</span>'+(ARCH.months.length?ARCH.months.map(m=>`<span class="chip2${m===ARCH.cur?' on':''}" data-am="${m}">${m}</span>`).join(''):'<span class="muted">没有可归档的月份</span>')+'</div>';
  h+='<div id="archInfo" style="margin-top:12px"></div></div>';
  h+='<div class="card"><b>已归档的文件</b><div id="archFiles" style="margin-top:8px"><div class="muted">加载中…</div></div></div>';
  box.innerHTML=h;
  box.querySelectorAll('[data-am]').forEach(c=>c.onclick=()=>{ ARCH.cur=c.dataset.am; archRender(); });
  archFiles();
  if(ARCH.cur) archInfo();
}
// 读 Storage 里的说明文件 年-月.json；没有 = null。能不能清空只看它，不看内存
async function archMeta(m){
  await schedAuthReady();
  const r=await fetch(SB_URL+'/storage/v1/object/authenticated/sched-archive/'+encodeURIComponent(m+'.json')+'?t='+Date.now(),{ headers:sbHeaders(), cache:'no-store' });
  if(r.status===404||r.status===400) return null;
  if(!r.ok) throw new Error('读取归档说明失败：'+r.status+' '+await r.text());
  try{ const j=await r.json(); return (j&&Array.isArray(j.ids))?j:null; }catch(e){ return null; }
}
async function archHasXlsx(m){
  const r=await fetch(SB_URL+'/storage/v1/object/list/sched-archive',{ method:'POST', headers:sbHeaders(), body:JSON.stringify({ prefix:'', search:m, limit:20 }) });
  if(!r.ok) return false;
  return (await r.json()).some(f=>f.name===m+'.xlsx');
}
async function archInfo(){
  const m=ARCH.cur, r=monthRange(m), box=el('archInfo'); box.innerHTML='<div class="muted">统计中…</div>';
  let rows=[], nl=0, meta=null, hasX=false;
  try{
    rows=await sbGet('sched_bookings',archQuery(m).replace('select=*','select=id'));
    nl=(await sbGet('sched_booking_log','select=id&at=gte.'+encodeURIComponent(r.atFrom)+'&at=lt.'+encodeURIComponent(r.atTo))).length;
    meta=await archMeta(m);
    if(!meta) hasX=await archHasXlsx(m);
  }catch(e){ box.innerHTML='<span class="badge b-err">'+esc(e.message)+'</span>'; return; }
  if(ARCH.cur!==m) return;   // 读的过程中切了月份
  const nb=rows.length;
  // 现在可归档的和保存时的完全一致，才允许清空
  const cur=new Set(rows.map(x=>String(x.id)));
  const same=!!meta && meta.ids.length===nb && meta.ids.every(id=>cur.has(String(id)));
  const can=same && nb>0;
  let why='';
  if(!meta) why=hasX?'这个月只有旧的 '+m+'.xlsx，没有说明文件，请重新「生成并保存」一次':'先点「生成并保存」';
  else if(!same) why='保存后数据有变化（保存时 '+meta.ids.length+' 条，现在 '+nb+' 条），请重新「生成并保存」';
  else if(!nb) why='这个月没有可归档的教室占用';
  const when=meta&&meta.saved_at?new Date(meta.saved_at).toLocaleString('sv-SE',{timeZone:'Asia/Tokyo'}).slice(0,16):'';
  box.innerHTML=`<div>可归档的教室占用：<b>${nb}</b> 条（含此前已整段结束的每周重复）；这个月的操作记录：<b>${nl}</b> 条</div>`+
    '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+
    '<button id="archSave">生成并保存</button>'+
    `<button id="archPurge" class="danger"${can?'':' disabled style="opacity:.45;cursor:not-allowed"'}>清空这个月</button>`+
    (can?'':`<span class="muted" style="font-size:12px">${esc(why)}</span>`)+'</div>'+
    '<div id="archMsg" style="margin-top:8px;font-size:13px">'+(meta?`已保存 <b>${esc(m)}.xlsx</b>（${meta.count} 条占用${meta.saved_by?'，'+esc(meta.saved_by):''}${when?'，'+esc(when):''}）${can?'，可以清空。':'。'}`:'')+'</div>';
  el('archSave').onclick=()=>archSave(m, nb);
  if(can) el('archPurge').onclick=()=>archPurge(m, meta);
}
function bookingWhen(b){ return b.recurrence==='weekly' ? (weekdaysLabel(String(b.weekday))+' '+(b.start_date||'')+'~'+(b.end_date||'')) : (b.booking_date||''); }
async function archSave(m, nb){
  if(ARCH.busy) return; ARCH.busy=true;
  const btn=el('archSave'), msg=el('archMsg'); btn.disabled=true; btn.textContent='生成中…'; msg.textContent='';
  try{
    if(typeof XLSX==='undefined') throw new Error('Excel 组件没有加载成功，请检查网络后刷新');
    const r=monthRange(m);
    const bks=await sbGet('sched_bookings', archQuery(m));
    const logs=await sbGet('sched_booking_log','select=*&at=gte.'+encodeURIComponent(r.atFrom)+'&at=lt.'+encodeURIComponent(r.atTo)+'&order=at.asc');
    const rm=Object.fromEntries(ROOMS.map(x=>[String(x.id),x]));
    const roomCampus=id=>rm[String(id)]?rm[String(id)].campus:'', roomName=id=>rm[String(id)]?rm[String(id)].name:'';
    const sheet1=bks.map(b=>({ '记录号':b.id, '类型':KIND_LABEL[b.kind]||b.kind, '校区':roomCampus(b.room_id), '教室':roomName(b.room_id), '日期/周期':bookingWhen(b),
      '开始':b.start_time, '结束':b.end_time, '使用人':b.user_name||'', '学生':b.student_name||'', '专业':b.major||'', '事由':b.title||'',
      '状态':b.status||'', '录入人':b.entry_name||'', '最后操作人':b.last_actor||'', '备注':b.note||'', '创建时间':b.created_at||'' }));
    const sheet2=logs.map(x=>({ '时间':fmtAt(x.at), '操作':ACT_LABEL[x.action]||x.action, '操作人':x.actor||'', '类型':KIND_LABEL[x.kind]||x.kind||'', '日期':x.booking_date||'',
      '校区':roomCampus(x.room_id), '教室':roomName(x.room_id), '使用人':x.user_name||'', '学生':x.student_name||'', '占用记录号':x.booking_id||'',
      '修改内容':x.changes?Object.keys(x.changes).map(k=>(FIELD_LABEL[k]||k)+'：'+val(k,x.changes[k].from)+' → '+val(k,x.changes[k].to)).join('；'):'',
      '整条内容':x.snapshot?JSON.stringify(x.snapshot):'' }));
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sheet1.length?sheet1:[{'记录号':''}]), '教室占用');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sheet2.length?sheet2:[{'时间':''}]), '操作记录');
    const buf=XLSX.write(wb,{ bookType:'xlsx', type:'array' });
    const type='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
    const blob=new Blob([buf],{type});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=m+'.xlsx'; document.body.appendChild(a); a.click(); a.remove();
    await schedAuthReady();
    const path=m+'.xlsx';
    const up=await fetch(SB_URL+'/storage/v1/object/sched-archive/'+path,{ method:'POST', headers:sbHeaders({ 'Content-Type':type, 'x-upsert':'true' }), body:blob });
    if(!up.ok) throw new Error('已下载到本机，但上传 Storage 失败：'+up.status+' '+await up.text()+'。上传成功前不能清空。');
    // 说明文件：之后能不能清空、清哪些，都以它为准
    const meta={ month:m, count:bks.length, ids:bks.map(x=>x.id), saved_at:new Date().toISOString(), saved_by:(typeof schedEntryName==='function'&&schedEntryName())||'管理员' };
    const up2=await fetch(SB_URL+'/storage/v1/object/sched-archive/'+m+'.json',{ method:'POST', headers:sbHeaders({ 'Content-Type':'application/json', 'x-upsert':'true' }), body:JSON.stringify(meta) });
    if(!up2.ok) throw new Error('Excel 已保存，但上传说明文件失败：'+up2.status+' '+await up2.text()+'。没有说明文件不能清空，请再点一次「生成并保存」。');
    await archInfo(); archFiles();
  }catch(e){ msg.innerHTML='<span class="badge b-err">'+esc(e.message)+'</span>'; btn.disabled=false; btn.textContent='生成并保存'; }
  finally{ ARCH.busy=false; }
}
async function archPurge(m, meta){
  const nb=meta.ids.length;
  if(!confirm('确定清空 '+m+' 的教室占用（共 '+nb+' 条）？\n\n文件 '+m+'.xlsx 已保存。清空后无法在系统里恢复，只能看归档文件。')) return;
  if(!confirm('再确认一次：真的清空 '+m+' 吗？')) return;
  const btn=el('archPurge'); btn.disabled=true; btn.textContent='清空中…';
  try{
    await schedAuthReady();
    const r=await fetch(SB_URL+'/rest/v1/rpc/sched_archive_purge',{ method:'POST', headers:sbHeaders(), body:JSON.stringify({ p_month:m, p_ids:meta.ids }) });
    if(!r.ok) throw new Error(sbErrMsg ? (sbErrMsg(await r.text())||'清空失败') : '清空失败');
    const j=await r.json();
    toast('已清空 '+m+'：删除 '+j.count+' 条');
    await archInit(); load();
  }catch(e){ el('archMsg').innerHTML='<span class="badge b-err">'+esc(e.message)+'</span>'; btn.disabled=false; btn.textContent='清空这个月'; }
}
async function archFiles(){
  const box=el('archFiles'); if(!box) return;
  try{
    await schedAuthReady();
    const r=await fetch(SB_URL+'/storage/v1/object/list/sched-archive',{ method:'POST', headers:sbHeaders(), body:JSON.stringify({ prefix:'', limit:200, sortBy:{ column:'name', order:'desc' } }) });
    if(!r.ok) throw new Error(r.status+' '+await r.text());
    const files=(await r.json()).filter(f=>f.name&&/\.xlsx$/.test(f.name));
    box.innerHTML = files.length ? files.map(f=>`<button class="ghost sm" data-f="${esc(f.name)}" style="margin:0 6px 6px 0">${esc(f.name)}</button>`).join('') : '<span class="muted">还没有归档文件</span>';
    box.querySelectorAll('[data-f]').forEach(b=>b.onclick=async()=>{
      try{
        const s=await fetch(SB_URL+'/storage/v1/object/sign/sched-archive/'+encodeURIComponent(b.dataset.f),{ method:'POST', headers:sbHeaders(), body:JSON.stringify({ expiresIn:300 }) });
        if(!s.ok) throw new Error(s.status+' '+await s.text());
        const j=await s.json(); window.open(SB_URL+'/storage/v1'+j.signedURL,'_blank');
      }catch(e){ toast('下载失败：'+e.message,false); }
    });
  }catch(e){ box.innerHTML='<span class="badge b-err">'+esc(e.message)+'</span>'; }
}
</script>
