<!DOCTYPE html>
<html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>教室占用录入 · 唯新</title>
<link rel="stylesheet" href="style.css">
</head><body>
<div id="nav"></div>
<div class="wrap">
  <div class="tip">
    <b>教室占用录入（管理员）：</b>查空闲 → 点教室 → 填信息，<b>直接生效</b>为已确认占用。支持临时使用 / VIP / 对外出租 / 开会。班级课程请走「课程录入 + 排教室」。
  </div>
  <div class="card">
    <div class="row">
      <div class="field"><label>用途</label><select id="use">
        <option value="temp">临时使用</option><option value="vip">VIP</option>
        <option value="rental">对外出租</option><option value="meeting">开会</option></select></div>
      <div class="field"><label>校区</label><select id="campus"></select></div>
      <div class="field"><label>重复</label><select id="rec"><option value="once">单次</option><option value="weekly">每周重复</option></select></div>
      <div class="field"><label id="dateLbl">日期</label><input type="date" id="date"></div>
      <div class="field hidden" id="endWrap"><label>结束日期</label><input type="date" id="endDate"></div>
      <div class="field hidden" id="wdWrap"><label>星期几（可多选）</label>
        <div id="wdPick" style="display:flex;gap:4px;flex-wrap:wrap"></div></div>
      <div class="field"><label>开始</label><select id="st"></select></div>
      <div class="field"><label>结束</label><select id="et"></select></div>
      <div class="field"><label>人数</label><input type="number" id="ppl" min="1" style="width:80px"></div>
      <div class="field"><label>&nbsp;</label><button id="find">查空闲</button></div>
    </div>
    <div id="dateWarn"></div>
  </div>
  <div class="card" id="resBox"><div class="muted">设定条件后点「查空闲」</div></div>
  <div class="card">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
      <b>当天各教室占用一览</b>
      <span class="legend" style="margin:0">
        <span><i style="background:var(--course)"></i>排课</span>
        <span><i style="background:var(--vip)"></i>VIP</span>
        <span><i style="background:var(--temp)"></i>临时</span>
        <span><i style="background:var(--rental)"></i>出租</span>
      </span>
    </div>
    <div class="board" id="gridBox"><div class="muted">选校区+日期后显示</div></div>
  </div>

  <div class="card">
    <h3 style="margin-top:2px" id="mineTitle">我录入的占用</h3>
    <div class="muted" style="font-size:12px;margin-bottom:8px">这里显示你自己录入的教室占用，可以删除。管理员可删全部。</div>
    <div id="mineBox"><div class="muted">加载中…</div></div>
  </div>
</div>

<div id="modal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:40px 16px">
  <div class="card" style="width:440px;max-width:92vw;margin:auto">
    <h3 style="margin-top:2px">录入占用 · <span id="m_room"></span></h3>
    <div id="m_when" class="muted" style="font-size:13px;margin-bottom:8px"></div>
    <div class="field"><label>用途/说明</label><input id="m_title" placeholder="如 VIP面试指导 / 谭老师外借"></div>
    <div class="field" style="margin-top:8px"><label>对外看板(today)显示</label><select id="m_showtitle"><option value="0">只标「占用」（不露用途）</option><option value="1">显示用途标题</option></select></div>
    <div class="field" style="margin-top:8px"><label>使用人/单位</label><input id="m_user"></div>
    <div class="field" style="margin-top:8px"><label>是否占用会议账号</label><select id="m_um">
      <option value="false">否</option><option value="true">是（占该教室固定账号）</option></select>
      <div id="m_umtip" class="hidden" style="margin-top:5px;font-size:11px;color:#b5651d;background:#fdf6ed;border:1px solid #f0d9b3;border-radius:6px;padding:5px 8px">提醒：会议账号在别的时段可能另有安排，请按你上面填的「日期+时段」确认这个账号那时是空的再占用（账号的整体绑定时间不等于你这次要用的时间）。</div></div>
    <div class="field" style="margin-top:8px"><label>备注</label><input id="m_note"></div>
    <div id="m_warn" class="hidden" style="margin-top:8px"></div>
    <div style="margin-top:14px;display:flex;gap:8px">
      <button id="m_submit">保存占用</button>
      <button class="ghost" id="m_cancel">取消</button>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
el('nav').innerHTML = renderNav('booking.html');
getRoleByCode(currentCode()).then(r=>{ if(r){ window.ROLE=r; el('nav').innerHTML = renderNav('booking.html', r); renderGrid(); renderMine(); } }).catch(()=>{});
let ROOMS=[], ACCOUNTS=[], BOOKINGS=[], CUR=null;
const BK_TKEY='sched_booking_token';
function myToken(){ let t=localStorage.getItem(BK_TKEY); if(!t){ t='bk'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); localStorage.setItem(BK_TKEY,t); } return t; }
function isManager(){ const ps=(window.ROLE&&window.ROLE.perms||'').split(',').map(s=>s.trim()); return (window.ROLE&&window.ROLE.role==='admin')||ps.includes('manage')||ps.includes('occupy'); }

async function boot(){
  fillSelect(el('campus'), CAMPUSES);
  fillSelect(el('st'), SLOTS); fillSelect(el('et'), SLOTS);
  el('date').value = todayStr();
  // 周几多选按钮（1=周一…7=周日）
  const WD=['一','二','三','四','五','六','日'];
  el('wdPick').innerHTML = WD.map((w,i)=>`<button type="button" class="ghost sm wdb" data-wd="${i+1}">${w}</button>`).join('');
  window.SELWD=new Set();
  el('wdPick').querySelectorAll('.wdb').forEach(b=>b.onclick=()=>{
    const wd=b.dataset.wd;
    if(SELWD.has(wd)){ SELWD.delete(wd); b.style.background=''; b.style.color=''; }
    else { SELWD.add(wd); b.style.background='var(--blue)'; b.style.color='#fff'; }
  });
  el('rec').onchange=()=>{
    const weekly=el('rec').value==='weekly';
    el('endWrap').classList.toggle('hidden',!weekly);
    el('wdWrap').classList.toggle('hidden',!weekly);
    el('dateLbl').textContent = weekly?'开始日期':'日期';
  };
  const i=SLOTS.indexOf('18:00'); if(i>0){ el('st').value='18:00'; el('et').value='21:00'; }
  ROOMS    = await sbGet('sched_rooms','select=*&active=eq.true&order=campus,sort');
  ACCOUNTS = await sbGet('sched_meeting_accounts','select=*&active=eq.true');
  BOOKINGS = await sbGet('sched_bookings','select=*');
  { const cs = await sbGet('sched_courses','select=id,skip_dates'); window.SKIPMAP={}; cs.forEach(c=>{ if(c.skip_dates) window.SKIPMAP[c.id]=new Set(c.skip_dates.split(',').map(x=>x.trim())); }); }
  el('find').onclick = find;
  el('date').onchange = renderGrid;
  el('campus').onchange = renderGrid;
  el('use').onchange = ()=>{ renderGrid(); if(el('resBox').dataset.done) find(); };
  renderMine();
  el('m_um').onchange = ()=>{ el('m_umtip').classList.toggle('hidden', el('m_um').value!=='true'); };
  el('m_cancel').onclick = ()=>el('modal').classList.add('hidden');
  el('m_submit').onclick = submit;
  renderGrid();
}
const isCosmo=r=>/コスモ|cosmo|外借/i.test((r.name||'')+(r.campus||''));
// 用途决定候选教室：VIP→只VIP；meeting→VIP+会议室；其它→全部
function isRental(r){ return r.type==='租用' || /コスモ|cosmo|外借|租用/i.test((r.name||'')); }
function poolFor(use, campus){
  let p=ROOMS.filter(r=>r.campus===campus);
  // 租用教室（如東京コスモ）只有管理员（有教室占用管理权限）能在此占用；普通录入账号看不到
  if(!isManager()) p=p.filter(r=>!isRental(r));
  // VIP/开会优先用专用教室，但专用不够时也可用大教室——全部列出，专用排前
  if(use==='vip'||use==='meeting'){
    const pref = use==='vip' ? (r=>r.type==='VIP') : (r=>r.type==='VIP'||r.type==='会议室');
    p=p.slice().sort((a,b)=>{ const pa=pref(a)?0:1, pb=pref(b)?0:1; return pa-pb; });
  }
  return p;
}
function renderGrid(){
  const campus=el('campus').value, date=el('date').value, use=el('use').value;
  const rooms=poolFor(use, campus).map(r=>({id:r.id,name:r.name,sub:r.capacity+'人'}));
  const box=el('gridBox');
  if(!campus||!date||!rooms.length){ box.innerHTML='<div class="muted">该校区暂无对应教室</div>'; return; }
  const todays=BOOKINGS.filter(b=>bookingOnDate(b,date) &&
    !(b.kind==='course'&&b.course_id&&window.SKIPMAP&&window.SKIPMAP[b.course_id]&&window.SKIPMAP[b.course_id].has(date)));
  const mgr=isManager();
  box.innerHTML = renderOccupancyGrid(rooms, todays, 'room_id', mgr?{occClickable:true}:{});
  if(mgr){
    box.querySelectorAll('[data-occ]').forEach(td=>td.onclick=async()=>{
      const b=BOOKINGS.find(y=>String(y.id)===String(td.dataset.occ)); if(!b) return;
      if(b.kind==='course'){ toast('课程占用请到课程管理里改', false); return; }
      const rn=(ROOMS.find(r=>String(r.id)===String(b.room_id))||{}).name||'';
      if(!confirm('删除该占用？\n'+rn+'　'+(b.title||KIND_LABEL[b.kind]||'')+'　'+(b.start_time||'')+'-'+(b.end_time||''))) return;
      try{ await sbDelete('sched_bookings', b.id); BOOKINGS=BOOKINGS.filter(y=>String(y.id)!==String(b.id)); renderGrid(); renderMine(); toast('已删除'); }
      catch(e){ toast(e.message, false); }
    });
  }
}
function find(){
  const use=el('use').value, campus=el('campus').value, date=el('date').value;
  const s=el('st').value, e=el('et').value, ppl=Number(el('ppl').value)||0;
  if(e<=s){ toast('结束需晚于开始', false); return; }
  let pool=poolFor(use, campus).filter(r=>!isCosmo(r));
  if(ppl) pool=pool.filter(r=>r.capacity>=ppl);
  const rows=pool.map(r=>{ const conf=roomConflicts(BOOKINGS,r.id,date,s,e,null); return {r,free:conf.length===0,conf}; });
  let h=`<div class="muted" style="margin-bottom:8px">${WEEKDAYS[weekdayOf(date)]} ${date} ${s}-${e}${ppl?(' · ≥'+ppl+'人'):''} · 用途：${KIND_LABEL[use==='vip'?'vip':use]||use}</div>`;
  h+='<table><thead><tr><th>教室</th><th>容量</th><th>状态</th><th>操作</th></tr></thead><tbody>';
  rows.forEach(({r,free,conf})=>{
    h+=`<tr><td>${esc(r.name)}</td><td>${r.capacity}人</td>`+
      (free?'<td><span class="badge b-ok">空闲</span></td>':`<td><span class="badge b-err">占用</span> <small class="muted">${conf.map(c=>c.title||KIND_LABEL[c.kind]).join('、')}</small></td>`)+
      `<td>${free?`<button class="sm" data-r="${r.id}">录入占用</button>`:`<button class="sm ghost" data-near="${r.id}">就近空档</button>`}</td></tr>`+
      `<tr id="near-${r.id}" class="hidden"><td colspan="4"></td></tr>`;
  });
  h+='</tbody></table>';
  if(!rows.length) h+='<div class="muted">无匹配教室</div>';
  const box=el('resBox'); box.innerHTML=h; box.dataset.done='1';
  box.querySelectorAll('button[data-r]').forEach(b=>b.onclick=()=>openModal(b.dataset.r));
  box.querySelectorAll('button[data-near]').forEach(b=>b.onclick=()=>showNear(b.dataset.near));
}
function showNear(roomId){
  const row=el('near-'+roomId); if(!row.classList.contains('hidden')){ row.classList.add('hidden'); return; }
  const date=el('date').value, s=el('st').value, e=el('et').value;
  const r=ROOMS.find(x=>String(x.id)===String(roomId));
  const nb=findNearby(BOOKINGS, roomId, date, s, e, 5);
  let h='<div style="padding:6px 2px"><b>'+esc(r.name)+' 的就近空档</b>';
  h+='<div style="margin-top:6px"><span class="muted">当天其他空时段：</span>'+
     (nb.sameDay.length? nb.sameDay.map(t=>`<button class="sm ghost" data-pick="${date}|${t}">${t}</button>`).join(' ') : '<span class="muted">无</span>')+'</div>';
  h+='<div style="margin-top:6px"><span class="muted">同时段前后几天有空：</span>'+
     (nb.nearDates.length? nb.nearDates.map(o=>`<button class="sm ghost" data-pick="${o.date}|${s}-${e}">${o.date}（${WEEKDAYS[weekdayOf(o.date)]}）</button>`).join(' ') : '<span class="muted">无</span>')+'</div></div>';
  row.querySelector('td').innerHTML=h; row.classList.remove('hidden');
  row.querySelectorAll('button[data-pick]').forEach(b=>b.onclick=()=>{
    const [d,tt]=b.dataset.pick.split('|'); const [ns,ne]=tt.split('-');
    el('date').value=d; el('st').value=ns; el('et').value=ne; find();
  });
}
function openModal(roomId){
  const r = ROOMS.find(x=>String(x.id)===String(roomId)); CUR=r;
  el('m_room').textContent = r.name;
  el('m_when').textContent = `${el('date').value}（${WEEKDAYS[weekdayOf(el('date').value)]}）${el('st').value}-${el('et').value} · ${r.campus}`;
  ['m_title','m_user','m_note'].forEach(id=>el(id).value='');
  el('m_um').value='false';
  el('m_warn').classList.add('hidden');
  el('modal').classList.remove('hidden');
}
async function submit(){
  const s=el('st').value, e=el('et').value, use=el('use').value;
  const warn=m=>{ el('m_warn').className=''; el('m_warn').innerHTML='<span class="badge b-err">'+m+'</span>'; };
  const um = el('m_um').value==='true';
  const accId = um ? (CUR.meeting_account_id||null) : null;
  if(um && !accId){ warn('该教室没有绑定固定会议账号，无法占用账号'); return; }

  const weekly = el('rec').value==='weekly';
  // 生成要录入的日期列表
  let dates=[];
  if(weekly){
    const sd=el('date').value, ed=el('endDate').value;
    if(!sd||!ed){ warn('请填开始和结束日期'); return; }
    if(!SELWD.size){ warn('请至少选一个星期几'); return; }
    let d=sd; let guard=0;
    while(d<=ed && guard<400){
      const wd=weekdayOf(d); const wdNum=(wd===0?7:wd); // 本项目 weekdayOf 周日=0，转成7
      if(SELWD.has(String(wdNum))) dates.push(d);
      d=addDays(d,1); guard++;
    }
    if(!dates.length){ warn('该日期范围内没有选中的星期几'); return; }
  } else {
    if(!el('date').value){ warn('请选日期'); return; }
    dates=[el('date').value];
  }
  // 逐日期检查冲突
  const conflictDates=[];
  for(const date of dates){
    const rc=roomConflicts(BOOKINGS, CUR.id, date, s, e, null);
    if(rc.length) conflictDates.push(date);
    if(um){ const ac=accountConflicts(BOOKINGS, accId, date, s, e, null); if(ac.length && !conflictDates.includes(date)) conflictDates.push(date); }
  }
  if(conflictDates.length){
    warn('以下日期该教室/账号已被占用，请调整：'+conflictDates.slice(0,8).join('、')+(conflictDates.length>8?' 等':''));
    return;
  }
  const sb=el('m_submit'); if(sb.disabled) return; sb.disabled=true; sb.textContent='保存中…';
  try{
    for(const date of dates){
      const rec={ room_id:CUR.id, kind:use, title: el('m_title').value.trim()||KIND_LABEL[use]||null,
        user_name: el('m_user').value.trim()||null, recurrence: 'once', weekday: weekdayOf(date), booking_date:date, start_time:s, end_time:e,
        uses_meeting:um, meeting_account_id:accId, show_title: el('m_showtitle')?el('m_showtitle').value==='1':false,
        status:'confirmed', created_by:myToken()+'|'+((window.ROLE&&(window.ROLE.label||window.ROLE.role))||''), note: el('m_note').value.trim()||null };
      const ins=await sbInsert('sched_bookings', rec); BOOKINGS.push(ins[0]);
    }
    el('modal').classList.add('hidden'); toast(weekly?('已批量录入 '+dates.length+' 条'):'已录入并生效'); find(); renderGrid(); renderMine();
  }catch(err){ warn(esc(err.message)); }
  finally{ sb.disabled=false; sb.textContent='保存占用'; }
}
function renderMine(){
  const box=el('mineBox'); if(!box) return;
  const mgr=isManager(); const tok=myToken();
  const isMine=b=>String(b.created_by||'').split('|')[0]===tok;
  el('mineTitle').textContent = mgr?'教室占用（管理员：可删全部）':'我在本设备录入的占用';
  // 非课程占用；普通账号只看本设备录入的，管理员看全部
  let list=BOOKINGS.filter(b=>b.kind!=='course');
  if(!mgr) list=list.filter(isMine);
  const rmap={}; ROOMS.forEach(r=>rmap[r.id]=r);
  list=list.slice().sort((a,b)=>{ const da=a.booking_date||a.start_date||'', db=b.booking_date||b.start_date||''; return db.localeCompare(da); });
  const LIMIT=60; const shown=list.slice(0,LIMIT);
  const showWho=mgr;
  let h='<table><thead><tr><th>用途</th><th>教室</th><th>日期</th><th>时段</th><th>使用人</th>'+(showWho?'<th>录入者</th>':'')+'<th></th></tr></thead><tbody>';
  if(!shown.length) h+='<tr><td colspan="'+(showWho?7:6)+'" class="muted">暂无</td></tr>';
  shown.forEach(b=>{ const r=rmap[b.room_id];
    const when=b.recurrence==='weekly'?(weekdaysLabel(String(b.weekday))+' '+(b.start_date||'')+'~'+(b.end_date||'')):(b.booking_date||'');
    const who=String(b.created_by||'').split('|')[1]||String(b.created_by||'').slice(0,8);
    h+=`<tr><td>${esc(KIND_LABEL[b.kind]||b.kind)}</td><td>${esc(r?r.name:'—')}${r?('<span class="muted" style="font-size:11px">（'+esc(r.campus)+'）</span>'):''}</td>`+
      `<td>${esc(when)}</td><td>${esc(b.start_time||'')}-${esc(b.end_time||'')}</td><td>${esc(b.user_name||'')}</td>`+
      (showWho?`<td class="muted" style="font-size:11px">${esc(who)}</td>`:'')+
      `<td><button class="sm danger" data-delmine="${b.id}">删除</button></td></tr>`;
  });
  h+='</tbody></table>';
  if(list.length>LIMIT) h+='<div class="muted" style="font-size:11px;margin-top:6px">仅显示最近 '+LIMIT+' 条（共 '+list.length+' 条）</div>';
  box.innerHTML=h;
  box.querySelectorAll('[data-delmine]').forEach(x=>x.onclick=async()=>{
    const b=BOOKINGS.find(y=>String(y.id)===String(x.dataset.delmine)); if(!b) return;
    if(!mgr && !isMine(b)){ toast('只能删除本设备录入的', false); return; }
    if(!confirm('删除这条占用？')) return;
    try{ await sbDelete('sched_bookings', b.id); BOOKINGS=BOOKINGS.filter(y=>String(y.id)!==String(b.id)); renderMine(); renderGrid(); toast('已删除'); }
    catch(e){ toast(e.message, false); }
  });
}
boot();
</script>
</body></html>
